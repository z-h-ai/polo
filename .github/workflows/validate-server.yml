name: Validate Server (Integration)

on:
  workflow_dispatch:

jobs:
  validate-server:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: validate-server (${{ matrix.os }})
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sweep stale managed test resources
        shell: bash
        run: bash scripts/trl sweep --repo=polo

      - name: Run --validate-server (includes automation conditions pass/fail)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CRAFT_ANTHROPIC_API_KEY }}
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: bash scripts/trl run --profile=validate -- bun run apps/cli/src/index.ts --validate-server --no-spinner --timeout 180000 --workspace-dir .github/agents

      - name: Upload test resource cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trl-cleanup-report
          path: .pipeline/test-resource-runs/**/cleanup-report.json
          if-no-files-found: ignore
