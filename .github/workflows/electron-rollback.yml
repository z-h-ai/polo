name: Verify Manual Electron Update Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already selected manually in Zeabur, without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: electron-production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Validate rollback version
        run: |
          bun -e '
            import { isStrictSemver } from "./scripts/strict-semver.ts";
            if (!isStrictSemver(process.argv[1])) throw new Error("Rollback version must be strict SemVer");
          ' "${{ inputs.version }}"
      - name: Verify manually selected rollback release
        run: |
          rollback_version="${{ inputs.version }}"
          rollback_tag="v${rollback_version}"
          rollback_commit="$(git rev-list -n 1 "${rollback_tag}^{commit}")"
          bun scripts/electron-release-bundle.ts verify \
            --url https://updates.polo.z-h-ai.com/electron/latest \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$rollback_tag" \
            --version "$rollback_version" \
            --commit "$rollback_commit"
