name: Roll Back Electron Update Pointer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Retained version to make current, without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: electron-production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
      ZEABUR_PUBLISHER_SERVICE_ID: ${{ vars.ZEABUR_PUBLISHER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Validate rollback version
        run: |
          bun -e '
            import { isStrictSemver } from "./scripts/strict-semver.ts";
            if (!isStrictSemver(process.argv[1])) throw new Error("Rollback version must be strict SemVer");
          ' "${{ inputs.version }}"
      - name: Authenticate Zeabur CLI
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          test -n "$ZEABUR_TOKEN"
          test -n "$ZEABUR_ENVIRONMENT_ID"
          test -n "$ZEABUR_PUBLISHER_SERVICE_ID"
          curl -fsSL https://zeabur.com/install.sh | bash
          export PATH="$HOME/.zeabur/bin:$PATH"
          echo "$HOME/.zeabur/bin" >> "$GITHUB_PATH"
          zeabur auth login --token "$ZEABUR_TOKEN"
      - name: Atomically point latest at retained version
        run: |
          zeabur service exec \
            --id "$ZEABUR_PUBLISHER_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" -- \
            /app/publisher rollback \
              --releases-dir /data/releases \
              --version "${{ inputs.version }}"
