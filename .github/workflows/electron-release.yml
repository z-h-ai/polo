name: Publish Electron Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: electron-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bootstrap: ${{ steps.release.outputs.bootstrap }}
      version: ${{ steps.release.outputs.version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      previous_commit_sha: ${{ steps.release.outputs.previous_commit_sha }}
      previous_macos_name: ${{ steps.release.outputs.previous_macos_name }}
      previous_macos_sha256: ${{ steps.release.outputs.previous_macos_sha256 }}
      previous_linux_name: ${{ steps.release.outputs.previous_linux_name }}
      previous_linux_sha256: ${{ steps.release.outputs.previous_linux_sha256 }}
      previous_installer_sha256: ${{ steps.release.outputs.previous_installer_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - id: release
        name: Validate tag, versions, commit, and online predecessor
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}^{commit}")"
          bun scripts/electron-release-contract.ts preflight \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --tag-commit "$tag_commit" \
            --root-package package.json \
            --electron-package apps/electron/package.json \
            --github-output "$GITHUB_OUTPUT" \
            --contract-output previous-release-contract.json
      - name: Upload predecessor contract
        if: steps.release.outputs.bootstrap != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: electron-previous-contract-${{ github.sha }}
          path: previous-release-contract.json
          if-no-files-found: error

  build:
    needs: preflight
    uses: ./.github/workflows/electron-artifact-full.yml
    with:
      bootstrap: ${{ needs.preflight.outputs.bootstrap == 'true' }}
      previous_release_tag: ${{ needs.preflight.outputs.previous_tag }}
      previous_release_version: ${{ needs.preflight.outputs.previous_version }}
      previous_release_commit_sha: ${{ needs.preflight.outputs.previous_commit_sha }}
      previous_macos_name: ${{ needs.preflight.outputs.previous_macos_name }}
      previous_macos_sha256: ${{ needs.preflight.outputs.previous_macos_sha256 }}
      previous_linux_name: ${{ needs.preflight.outputs.previous_linux_name }}
      previous_linux_sha256: ${{ needs.preflight.outputs.previous_linux_sha256 }}
      previous_installer_sha256: ${{ needs.preflight.outputs.previous_installer_sha256 }}
    secrets:
      macos_csc_link: ${{ secrets.POLO_AI_MACOS_CSC_LINK }}
      macos_csc_key_password: ${{ secrets.POLO_AI_MACOS_CSC_KEY_PASSWORD }}
      apple_id: ${{ secrets.POLO_AI_APPLE_ID }}
      apple_app_specific_password: ${{ secrets.POLO_AI_APPLE_APP_SPECIFIC_PASSWORD }}
      apple_team_id: ${{ secrets.POLO_AI_APPLE_TEAM_ID }}

  draft-release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-release-*-${{ github.sha }}
          path: collected
          merge-multiple: true
      - name: Assemble and validate release directory
        run: |
          bun scripts/electron-release-bundle.ts prepare \
            --input collected \
            --output release \
            --install-script scripts/install-app.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ needs.preflight.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --published-at "$(git show -s --format=%cI "$GITHUB_SHA")"
      - name: Create immutable Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true"
            mkdir existing-release
            gh release download "$GITHUB_REF_NAME" --dir existing-release
            test "$(find existing-release -maxdepth 1 -type f | wc -l)" -eq 9
            for file in release/*; do
              cmp "$file" "existing-release/$(basename "$file")"
            done
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft --verify-tag --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
  production:
    needs: [preflight, draft-release]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
      ZEABUR_UPDATES_SERVICE_ID: ${{ vars.ZEABUR_UPDATES_SERVICE_ID }}
      ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Trigger Zeabur release pull
        shell: bash
        run: |
          set -euo pipefail
          for name in ZEABUR_TOKEN ZEABUR_UPDATES_SERVICE_ID ZEABUR_ENVIRONMENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
          npx zeabur@latest auth login --token "$ZEABUR_TOKEN"
          npx zeabur@latest service exec \
            --id "$ZEABUR_UPDATES_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" \
            -- /app/polo-release-pull \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --version "$VERSION" \
              --commit "$GITHUB_SHA"
      - name: Verify Zeabur updater bundle
        id: public-verify
        continue-on-error: true
        run: |
          for attempt in $(seq 1 6); do
            if bun scripts/electron-release-bundle.ts verify \
              --url https://updates.polo.z-h-ai.com/electron/latest \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --version "$VERSION" \
              --commit "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
      - name: Restore latest after failed public verification
        if: steps.public-verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if npx zeabur@latest service exec \
              --id "$ZEABUR_UPDATES_SERVICE_ID" \
              --env-id "$ZEABUR_ENVIRONMENT_ID" \
              -- /usr/local/bin/bun /app/publish-electron-release.ts rollback-failed \
                --releases-dir /data/releases \
                --version "$VERSION" \
              && npx zeabur@latest service exec \
                --id "$ZEABUR_UPDATES_SERVICE_ID" \
                --env-id "$ZEABUR_ENVIRONMENT_ID" \
                -- /usr/local/bin/bun /app/publish-electron-release.ts assert-not-latest \
                  --releases-dir /data/releases \
                  --version "$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Stop release after public verification failure
        if: steps.public-verify.outcome == 'failure'
        run: exit 1
      - name: Confirm Zeabur release after public verification
        id: confirm-release
        if: steps.public-verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx zeabur@latest service exec \
            --id "$ZEABUR_UPDATES_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" \
            -- /usr/local/bin/bun /app/publish-electron-release.ts confirm \
              --releases-dir /data/releases \
              --version "$VERSION"
      - name: Verify confirmed Zeabur pointer
        id: confirm-pointer
        if: steps.confirm-release.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx zeabur@latest service exec \
            --id "$ZEABUR_UPDATES_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" \
            -- /usr/local/bin/bun /app/publish-electron-release.ts assert-confirmed \
              --releases-dir /data/releases \
              --version "$VERSION"
      - name: Restore latest after failed finalization
        if: steps.confirm-release.outcome == 'failure' || steps.confirm-pointer.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if npx zeabur@latest service exec \
              --id "$ZEABUR_UPDATES_SERVICE_ID" \
              --env-id "$ZEABUR_ENVIRONMENT_ID" \
              -- /usr/local/bin/bun /app/publish-electron-release.ts rollback-failed \
                --releases-dir /data/releases \
                --version "$VERSION" \
              && npx zeabur@latest service exec \
                --id "$ZEABUR_UPDATES_SERVICE_ID" \
                --env-id "$ZEABUR_ENVIRONMENT_ID" \
                -- /usr/local/bin/bun /app/publish-electron-release.ts assert-not-latest \
                  --releases-dir /data/releases \
                  --version "$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Stop release after finalization failure
        if: steps.confirm-release.outcome == 'failure' || steps.confirm-pointer.outcome == 'failure'
        run: exit 1
  publish-release:
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish approved GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
