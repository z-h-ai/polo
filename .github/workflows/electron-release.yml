name: Publish Electron Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: electron-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bootstrap: ${{ steps.release.outputs.bootstrap }}
      version: ${{ steps.release.outputs.version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      previous_commit_sha: ${{ steps.release.outputs.previous_commit_sha }}
      previous_macos_name: ${{ steps.release.outputs.previous_macos_name }}
      previous_macos_sha256: ${{ steps.release.outputs.previous_macos_sha256 }}
      previous_windows_name: ${{ steps.release.outputs.previous_windows_name }}
      previous_windows_sha256: ${{ steps.release.outputs.previous_windows_sha256 }}
      previous_linux_name: ${{ steps.release.outputs.previous_linux_name }}
      previous_linux_sha256: ${{ steps.release.outputs.previous_linux_sha256 }}
      previous_installer_sha256: ${{ steps.release.outputs.previous_installer_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - id: release
        name: Validate tag, versions, commit, and online predecessor
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}^{commit}")"
          bun scripts/electron-release-contract.ts preflight \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --tag-commit "$tag_commit" \
            --root-package package.json \
            --electron-package apps/electron/package.json \
            --github-output "$GITHUB_OUTPUT" \
            --contract-output previous-release-contract.json
      - name: Upload predecessor contract
        if: steps.release.outputs.bootstrap != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: electron-previous-contract-${{ github.sha }}
          path: previous-release-contract.json
          if-no-files-found: error

  build:
    needs: preflight
    uses: ./.github/workflows/electron-artifact-full.yml
    with:
      bootstrap: ${{ needs.preflight.outputs.bootstrap == 'true' }}
      previous_release_tag: ${{ needs.preflight.outputs.previous_tag }}
      previous_release_version: ${{ needs.preflight.outputs.previous_version }}
      previous_release_commit_sha: ${{ needs.preflight.outputs.previous_commit_sha }}
      previous_macos_name: ${{ needs.preflight.outputs.previous_macos_name }}
      previous_macos_sha256: ${{ needs.preflight.outputs.previous_macos_sha256 }}
      previous_windows_name: ${{ needs.preflight.outputs.previous_windows_name }}
      previous_windows_sha256: ${{ needs.preflight.outputs.previous_windows_sha256 }}
      previous_linux_name: ${{ needs.preflight.outputs.previous_linux_name }}
      previous_linux_sha256: ${{ needs.preflight.outputs.previous_linux_sha256 }}
      previous_installer_sha256: ${{ needs.preflight.outputs.previous_installer_sha256 }}
    secrets:
      macos_csc_link: ${{ secrets.POLO_AI_MACOS_CSC_LINK }}
      macos_csc_key_password: ${{ secrets.POLO_AI_MACOS_CSC_KEY_PASSWORD }}
      apple_id: ${{ secrets.POLO_AI_APPLE_ID }}
      apple_app_specific_password: ${{ secrets.POLO_AI_APPLE_APP_SPECIFIC_PASSWORD }}
      apple_team_id: ${{ secrets.POLO_AI_APPLE_TEAM_ID }}
      windows_csc_link: ${{ secrets.POLO_AI_WINDOWS_CSC_LINK }}
      windows_csc_key_password: ${{ secrets.POLO_AI_WINDOWS_CSC_KEY_PASSWORD }}

  draft-release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-release-*-${{ github.sha }}
          path: collected
          merge-multiple: true
      - name: Assemble and validate release directory
        run: |
          bun scripts/electron-release-bundle.ts prepare \
            --input collected \
            --output release \
            --install-script scripts/install-app.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ needs.preflight.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --published-at "$(git show -s --format=%cI "$GITHUB_SHA")"
      - name: Build Linux publisher executable
        run: |
          bun build scripts/publish-electron-release.ts \
            --compile --target=bun-linux-x64 \
            --outfile electron-release-publisher
      - name: Create immutable Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true"
            mkdir existing-release
            gh release download "$GITHUB_REF_NAME" --dir existing-release
            test "$(find existing-release -maxdepth 1 -type f | wc -l)" -eq 8
            for file in release/*; do
              cmp "$file" "existing-release/$(basename "$file")"
            done
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electron-production-bundle-${{ github.sha }}
          path: |
            release
            electron-release-publisher
          if-no-files-found: error
          retention-days: 14

  production:
    needs: [preflight, draft-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
      ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
      ZEABUR_PUBLISHER_SERVICE_ID: ${{ vars.ZEABUR_PUBLISHER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@v4
        with:
          name: electron-production-bundle-${{ github.sha }}
          path: production
      - name: Require protected deployment configuration
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          for name in ZEABUR_TOKEN ZEABUR_PROJECT_ID ZEABUR_ENVIRONMENT_ID ZEABUR_PUBLISHER_SERVICE_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing production value $name"; exit 1; fi
          done
      - name: Install and authenticate Zeabur CLI
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          curl -fsSL https://zeabur.com/install.sh | bash
          export PATH="$HOME/.zeabur/bin:$PATH"
          echo "$HOME/.zeabur/bin" >> "$GITHUB_PATH"
          zeabur auth login --token "$ZEABUR_TOKEN"
      - name: Build temporary publisher deployment context
        run: |
          mkdir publisher-context
          cp -R production/release publisher-context/release
          cp production/electron-release-publisher publisher-context/publisher
          chmod 755 publisher-context/publisher
          cat > publisher-context/Dockerfile <<EOF
          FROM debian:bookworm-slim
          WORKDIR /app
          COPY --chmod=755 publisher /app/publisher
          COPY release /app/release
          CMD ["sh", "-c", "/app/publisher publish --source /app/release --releases-dir /data/releases --version '$VERSION' --repository '$GITHUB_REPOSITORY' --tag '$GITHUB_REF_NAME' --commit '$GITHUB_SHA' && exec sleep infinity"]
          EOF
      - name: Deploy publisher to the PVC-mounted service
        working-directory: publisher-context
        run: |
          zeabur deploy \
            --project-id "$ZEABUR_PROJECT_ID" \
            --environment-id "$ZEABUR_ENVIRONMENT_ID" \
            --service-id "$ZEABUR_PUBLISHER_SERVICE_ID"
      - id: smoke
        name: Verify public updater bytes and read-only behavior
        continue-on-error: true
        run: |
          for attempt in $(seq 1 12); do
            if bun scripts/electron-release-bundle.ts verify \
              --url https://updates.polo.z-h-ai.com/electron/latest \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --version "$VERSION" \
              --commit "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
      - name: Roll back failed public verification
        if: steps.smoke.outcome != 'success'
        run: |
          zeabur service exec \
            --id "$ZEABUR_PUBLISHER_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" -- \
            /app/publisher rollback-failed --releases-dir /data/releases --version "$VERSION"
          exit 1
      - name: Confirm release and discard rollback marker
        run: |
          zeabur service exec \
            --id "$ZEABUR_PUBLISHER_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" -- \
            /app/publisher confirm --releases-dir /data/releases --version "$VERSION"

  publish-release:
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish approved GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
