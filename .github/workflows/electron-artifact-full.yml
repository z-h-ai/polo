name: Reusable Electron Release Build

on:
  workflow_call:
    inputs:
      bootstrap:
        required: true
        type: boolean
      previous_release_tag:
        type: string
        default: ""
      previous_release_version:
        type: string
        default: ""
      previous_release_commit_sha:
        type: string
        default: ""
      previous_macos_name:
        type: string
        default: ""
      previous_macos_sha256:
        type: string
        default: ""
      previous_linux_name:
        type: string
        default: ""
      previous_linux_sha256:
        type: string
        default: ""
      previous_installer_sha256:
        type: string
        default: ""
    secrets:
      macos_csc_link:
        required: true
      macos_csc_key_password:
        required: true
      apple_id:
        required: true
      apple_app_specific_password:
        required: true
      apple_team_id:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} release lifecycle
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
            updater: true
            manifest: latest-mac.yml
            artifact: Polo-AI-x64.zip
            manual_installer: Polo-AI-x64.dmg
          # Keep the automatic-update contract on x64 for now. This native
          # Apple Silicon build is a separately signed manual installer.
          - platform: macos
            arch: arm64
            runner: macos-15
            updater: false
            manual_installer: Polo-AI-arm64.dmg
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            updater: true
            manifest: latest-linux.yml
            artifact: Polo-AI-x64.AppImage
          # Windows is deliberately unsigned in this release phase. It is a
          # manual NSIS installer and does not participate in updater manifests.
          - platform: windows
            arch: x64
            runner: windows-latest
            updater: false
            manual_installer: Polo-AI-x64.exe
    runs-on: ${{ matrix.runner }}
    env:
      PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
      PREVIOUS_RELEASE_VERSION: ${{ inputs.previous_release_version }}
      PREVIOUS_RELEASE_COMMIT_SHA: ${{ inputs.previous_release_commit_sha }}
      EXPECTED_PREVIOUS_ARTIFACT_SHA256: ${{ (matrix.platform == 'macos' && inputs.previous_macos_sha256) || inputs.previous_linux_sha256 }}
      EXPECTED_PREVIOUS_INSTALLER_SHA256: ${{ inputs.previous_installer_sha256 }}
      PREVIOUS_ARTIFACT_NAME: ${{ (matrix.platform == 'macos' && inputs.previous_macos_name) || inputs.previous_linux_name }}
      # Apple Silicon remains outside updater lifecycle manifests, but manual
      # installation does not relax Developer ID/notarization/stapling gates.
      # `signing` runs the complete macOS identity audit without requiring an
      # architecture-unsafe x64 predecessor upgrade fixture.
      POLO_AI_ARTIFACT_VALIDATION_MODE: ${{ matrix.platform == 'macos' && matrix.arch == 'arm64' && 'signing' || matrix.updater && (inputs.bootstrap && 'bootstrap' || 'full') || 'smoke' }}
      POLO_AI_PREVIOUS_ARTIFACT: ${{ github.workspace }}/previous/${{ (matrix.platform == 'macos' && inputs.previous_macos_name) || inputs.previous_linux_name }}
      POLO_AI_PREVIOUS_INSTALL_SCRIPT: ${{ github.workspace }}/previous/install-app.sh
      POLO_AI_RELEASE_MACOS_TEAM_ID: ${{ vars.POLO_AI_RELEASE_MACOS_TEAM_ID }}
      POLO_AI_RELEASE_MACOS_APP_REQUIREMENT: ${{ vars.POLO_AI_RELEASE_MACOS_APP_REQUIREMENT }}
      POLO_AI_RELEASE_MACOS_UV_REQUIREMENT: ${{ vars.POLO_AI_RELEASE_MACOS_UV_REQUIREMENT }}
      POLO_AI_RELEASE_SIGNING_AUDIT_FILE: ${{ matrix.platform == 'macos' && format('{0}/apps/electron/release/release-signing-audit-macos-{1}.jsonl', github.workspace, matrix.arch) || '' }}
      CSC_LINK: ${{ matrix.platform == 'macos' && secrets.macos_csc_link || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.macos_csc_key_password || '' }}
      APPLE_ID: ${{ matrix.platform == 'macos' && secrets.apple_id || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.apple_app_specific_password || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.apple_team_id || '' }}

    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p 'require("./apps/electron/package.json").version')"
          echo "CURRENT_ELECTRON_VERSION=$current_version" >> "$GITHUB_ENV"
          missing=""
          if [ "${{ matrix.platform }}" = "macos" ]; then
            for name in CSC_LINK CSC_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
            for name in POLO_AI_RELEASE_MACOS_TEAM_ID POLO_AI_RELEASE_MACOS_APP_REQUIREMENT POLO_AI_RELEASE_MACOS_UV_REQUIREMENT APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
            if [ "$POLO_AI_RELEASE_MACOS_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
              echo "::error::macOS signing and notarization Team IDs differ"
              exit 1
            fi
          fi
          if [ "${{ inputs.bootstrap }}" != "true" ] && [ "${{ matrix.updater }}" = "true" ]; then
            for name in PREVIOUS_RELEASE_TAG PREVIOUS_RELEASE_VERSION PREVIOUS_RELEASE_COMMIT_SHA EXPECTED_PREVIOUS_ARTIFACT_SHA256 PREVIOUS_ARTIFACT_NAME; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
            if [ -z "$EXPECTED_PREVIOUS_INSTALLER_SHA256" ]; then
              missing="$missing EXPECTED_PREVIOUS_INSTALLER_SHA256"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing release contract or signing fields:$missing"
            exit 1
          fi

      - name: Verify and download previous release
        if: ${{ inputs.bootstrap == false && matrix.updater }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/preflight-previous-release.sh \
            --platform "${{ matrix.platform }}" \
            --artifact-name "$PREVIOUS_ARTIFACT_NAME" \
            --output "previous/verified-contract-${{ matrix.platform }}.json"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prove clean platform runtime preparation contract
        shell: bash
        run: |
          rm -rf \
            apps/electron/vendor \
            apps/electron/node_modules/@anthropic-ai \
            apps/electron/node_modules/@vscode \
            apps/electron/packages \
            apps/electron/resources/bin/darwin-arm64 \
            apps/electron/resources/bin/darwin-x64 \
            apps/electron/resources/bin/linux-arm64 \
            apps/electron/resources/bin/linux-x64 \
            apps/electron/resources/bin/win32-arm64 \
            apps/electron/resources/bin/win32-x64
          bun test scripts/__tests__/prepare-platform-runtime.test.ts
          test ! -e apps/electron/vendor/bun
          test -z "$(find apps/electron/resources/bin -maxdepth 2 -type f -name 'uv*' -print -quit)"

      - name: Revalidate previous release contract
        if: ${{ inputs.bootstrap == false && matrix.updater }}
        shell: bash
        run: |
          args=(
            --repository "$GITHUB_REPOSITORY"
            --tag "$PREVIOUS_RELEASE_TAG"
            --expected-version "$PREVIOUS_RELEASE_VERSION"
            --expected-commit "$PREVIOUS_RELEASE_COMMIT_SHA"
            --resolved-version "$RESOLVED_PREVIOUS_VERSION"
            --resolved-commit "$RESOLVED_PREVIOUS_COMMIT_SHA"
            --current-version "$CURRENT_ELECTRON_VERSION"
            --artifact "$POLO_AI_PREVIOUS_ARTIFACT"
            --artifact-name "$PREVIOUS_ARTIFACT_NAME"
            --artifact-sha256 "$EXPECTED_PREVIOUS_ARTIFACT_SHA256"
            --output "previous/verified-contract-${{ matrix.platform }}.json"
          )
          args+=(--installer "$POLO_AI_PREVIOUS_INSTALL_SCRIPT" --installer-sha256 "$EXPECTED_PREVIOUS_INSTALLER_SHA256")
          bun run scripts/validate-previous-release-contract.ts "${args[@]}"

      - name: Smoke Windows terminal launchers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & apps/electron/resources/scripts/tests/windows-wrapper-smoke.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & apps/electron/resources/scripts/tests/windows-terminal-integration.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke Windows PowerShell installer compatibility
        if: matrix.platform == 'windows'
        # afterPack and NSIS invoke the integration script with Windows
        # PowerShell. Keep the pre-packaging ASCII launch on that same engine
        # so a PowerShell 7-only pass cannot hide an installer failure. The
        # Unicode argument regression remains on PowerShell 7, whose native
        # command-line transport preserves it.
        shell: powershell
        run: |
          & apps/electron/resources/scripts/tests/windows-wrapper-smoke.test.ps1 -AsciiOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse Windows final artifact validator with Windows PowerShell
        if: matrix.platform == 'windows'
        # The final NSIS lifecycle validator contains Unicode filesystem cases.
        # Windows PowerShell requires the source to retain its UTF-8 BOM, so
        # reject a parser regression before electron-builder reaches afterAll.
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $validator = (Resolve-Path 'apps/electron/scripts/validate-final-artifacts.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $validator,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Build and validate macOS release
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -o pipefail
          bun run electron:dist:mac --arch=${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/full-validation-macos-${{ matrix.arch }}.log"

      - name: Build and validate Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          xvfb-run -a bash -c '
            set -o pipefail
            export POLO_AI_E2E_EXPECTED_DISPLAY="$DISPLAY"
            bun run electron:dist:linux --arch=x64 2>&1 | tee "$1"
          ' _ "$RUNNER_TEMP/full-validation-linux.log"

      - name: Build and validate unsigned Windows release
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -o pipefail
          bun run electron:dist:win --arch=x64 2>&1 | tee "$RUNNER_TEMP/full-validation-windows-x64.log"

      - name: Require intentionally unsigned Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = 'apps/electron/release/Polo-AI-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing $installer" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Windows installer must be explicitly unsigned for this release phase; got $($signature.Status)"
          }
          Write-Host 'Windows NSIS installer is intentionally unsigned.'

      - name: Require updater outputs
        if: matrix.updater
        shell: bash
        run: |
          test -f "apps/electron/release/${{ matrix.artifact }}"
          test -f "apps/electron/release/${{ matrix.manifest }}"

      - name: Require macOS Developer ID signing audit
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          audit='apps/electron/release/release-signing-audit-macos-${{ matrix.arch }}.jsonl'
          test -s "$audit"
          grep -F '"label":"DMG outer"' "$audit" >/dev/null
          grep -F '"label":"DMG"' "$audit" >/dev/null
          grep -F '"label":"ZIP"' "$audit" >/dev/null

      - name: Upload curated release input
        if: matrix.updater
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/electron/release/${{ matrix.artifact }}
            apps/electron/release/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS manual installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-macos-dmg-${{ matrix.arch }}-${{ github.sha }}
          path: apps/electron/release/${{ matrix.manual_installer }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows manual installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-windows-${{ matrix.arch }}-${{ github.sha }}
          path: apps/electron/release/${{ matrix.manual_installer }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-validation-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/full-validation-${{ matrix.platform }}-${{ matrix.arch }}.log
            apps/electron/release/release-signing-audit-*.jsonl
            previous/verified-contract-${{ matrix.platform }}.json
          if-no-files-found: ignore
          retention-days: 14
