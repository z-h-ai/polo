name: Reusable Electron Release Build

on:
  workflow_call:
    inputs:
      bootstrap:
        required: true
        type: boolean
      previous_release_tag:
        type: string
        default: ""
      previous_release_version:
        type: string
        default: ""
      previous_release_commit_sha:
        type: string
        default: ""
      previous_macos_name:
        type: string
        default: ""
      previous_macos_sha256:
        type: string
        default: ""
      previous_windows_name:
        type: string
        default: ""
      previous_windows_sha256:
        type: string
        default: ""
      previous_linux_name:
        type: string
        default: ""
      previous_linux_sha256:
        type: string
        default: ""
      previous_installer_sha256:
        type: string
        default: ""
    secrets:
      macos_csc_link:
        required: true
      macos_csc_key_password:
        required: true
      apple_id:
        required: true
      apple_app_specific_password:
        required: true
      apple_team_id:
        required: true
      windows_csc_link:
        required: true
      windows_csc_key_password:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} signed lifecycle
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
            manifest: latest-mac.yml
            artifact: Polo-AI-x64.zip
          - platform: windows
            runner: windows-latest
            manifest: latest.yml
            artifact: Polo-AI-x64.exe
          - platform: linux
            runner: ubuntu-latest
            manifest: latest-linux.yml
            artifact: Polo-AI-x64.AppImage
    runs-on: ${{ matrix.runner }}
    env:
      PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
      PREVIOUS_RELEASE_VERSION: ${{ inputs.previous_release_version }}
      PREVIOUS_RELEASE_COMMIT_SHA: ${{ inputs.previous_release_commit_sha }}
      EXPECTED_PREVIOUS_ARTIFACT_SHA256: ${{ (matrix.platform == 'macos' && inputs.previous_macos_sha256) || (matrix.platform == 'windows' && inputs.previous_windows_sha256) || inputs.previous_linux_sha256 }}
      EXPECTED_PREVIOUS_INSTALLER_SHA256: ${{ inputs.previous_installer_sha256 }}
      PREVIOUS_ARTIFACT_NAME: ${{ (matrix.platform == 'macos' && inputs.previous_macos_name) || (matrix.platform == 'windows' && inputs.previous_windows_name) || inputs.previous_linux_name }}
      POLO_AI_ARTIFACT_VALIDATION_MODE: ${{ inputs.bootstrap && 'bootstrap' || 'full' }}
      POLO_AI_PREVIOUS_ARTIFACT: ${{ github.workspace }}/previous/${{ (matrix.platform == 'macos' && inputs.previous_macos_name) || (matrix.platform == 'windows' && inputs.previous_windows_name) || inputs.previous_linux_name }}
      POLO_AI_PREVIOUS_INSTALL_SCRIPT: ${{ github.workspace }}/previous/install-app.sh
      POLO_AI_RELEASE_MACOS_TEAM_ID: ${{ vars.POLO_AI_RELEASE_MACOS_TEAM_ID }}
      POLO_AI_RELEASE_MACOS_APP_REQUIREMENT: ${{ vars.POLO_AI_RELEASE_MACOS_APP_REQUIREMENT }}
      POLO_AI_RELEASE_MACOS_UV_REQUIREMENT: ${{ vars.POLO_AI_RELEASE_MACOS_UV_REQUIREMENT }}
      POLO_AI_RELEASE_WINDOWS_PUBLISHER: ${{ vars.POLO_AI_RELEASE_WINDOWS_PUBLISHER }}
      POLO_AI_RELEASE_WINDOWS_THUMBPRINT: ${{ vars.POLO_AI_RELEASE_WINDOWS_THUMBPRINT }}
      CSC_LINK: ${{ (matrix.platform == 'macos' && secrets.macos_csc_link) || (matrix.platform == 'windows' && secrets.windows_csc_link) || '' }}
      CSC_KEY_PASSWORD: ${{ (matrix.platform == 'macos' && secrets.macos_csc_key_password) || (matrix.platform == 'windows' && secrets.windows_csc_key_password) || '' }}
      APPLE_ID: ${{ matrix.platform == 'macos' && secrets.apple_id || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.apple_app_specific_password || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.apple_team_id || '' }}

    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p 'require("./apps/electron/package.json").version')"
          echo "CURRENT_ELECTRON_VERSION=$current_version" >> "$GITHUB_ENV"
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ "${{ matrix.platform }}" != "linux" ] && [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ "${{ matrix.platform }}" = "macos" ]; then
            for name in POLO_AI_RELEASE_MACOS_TEAM_ID POLO_AI_RELEASE_MACOS_APP_REQUIREMENT POLO_AI_RELEASE_MACOS_UV_REQUIREMENT APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
            if [ "$POLO_AI_RELEASE_MACOS_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
              echo "::error::macOS signing and notarization Team IDs differ"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            for name in POLO_AI_RELEASE_WINDOWS_PUBLISHER POLO_AI_RELEASE_WINDOWS_THUMBPRINT; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
          fi
          if [ "${{ inputs.bootstrap }}" != "true" ]; then
            for name in PREVIOUS_RELEASE_TAG PREVIOUS_RELEASE_VERSION PREVIOUS_RELEASE_COMMIT_SHA EXPECTED_PREVIOUS_ARTIFACT_SHA256 PREVIOUS_ARTIFACT_NAME; do
              if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
            done
            if [ "${{ matrix.platform }}" != "windows" ] && [ -z "$EXPECTED_PREVIOUS_INSTALLER_SHA256" ]; then
              missing="$missing EXPECTED_PREVIOUS_INSTALLER_SHA256"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing release contract or signing fields:$missing"
            exit 1
          fi

      - name: Verify and download previous Unix release
        if: ${{ inputs.bootstrap == false && matrix.platform != 'windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/preflight-previous-release.sh \
            --platform "${{ matrix.platform }}" \
            --artifact-name "$PREVIOUS_ARTIFACT_NAME" \
            --output "previous/verified-contract-${{ matrix.platform }}.json"

      - name: Verify and download previous Windows release
        if: ${{ inputs.bootstrap == false && matrix.platform == 'windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & scripts/preflight-previous-release.ps1 `
            -ArtifactName $env:PREVIOUS_ARTIFACT_NAME `
            -Output "previous/verified-contract-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "Previous Windows release preflight failed" }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prove clean platform runtime preparation contract
        shell: bash
        run: |
          rm -rf \
            apps/electron/vendor \
            apps/electron/node_modules/@anthropic-ai \
            apps/electron/node_modules/@vscode \
            apps/electron/packages \
            apps/electron/resources/bin/darwin-arm64 \
            apps/electron/resources/bin/darwin-x64 \
            apps/electron/resources/bin/linux-arm64 \
            apps/electron/resources/bin/linux-x64 \
            apps/electron/resources/bin/win32-arm64 \
            apps/electron/resources/bin/win32-x64
          bun test scripts/__tests__/prepare-platform-runtime.test.ts
          test ! -e apps/electron/vendor/bun
          test -z "$(find apps/electron/resources/bin -maxdepth 2 -type f -name 'uv*' -print -quit)"

      - name: Revalidate previous release contract
        if: ${{ inputs.bootstrap == false }}
        shell: bash
        run: |
          args=(
            --repository "$GITHUB_REPOSITORY"
            --tag "$PREVIOUS_RELEASE_TAG"
            --expected-version "$PREVIOUS_RELEASE_VERSION"
            --expected-commit "$PREVIOUS_RELEASE_COMMIT_SHA"
            --resolved-version "$RESOLVED_PREVIOUS_VERSION"
            --resolved-commit "$RESOLVED_PREVIOUS_COMMIT_SHA"
            --current-version "$CURRENT_ELECTRON_VERSION"
            --artifact "$POLO_AI_PREVIOUS_ARTIFACT"
            --artifact-name "$PREVIOUS_ARTIFACT_NAME"
            --artifact-sha256 "$EXPECTED_PREVIOUS_ARTIFACT_SHA256"
            --output "previous/verified-contract-${{ matrix.platform }}.json"
          )
          if [ "${{ matrix.platform }}" != "windows" ]; then
            args+=(--installer "$POLO_AI_PREVIOUS_INSTALL_SCRIPT" --installer-sha256 "$EXPECTED_PREVIOUS_INSTALLER_SHA256")
          fi
          bun run scripts/validate-previous-release-contract.ts "${args[@]}"

      - name: Run Windows terminal ownership tests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          foreach ($test in @(
            "windows-terminal-integration.test.ps1",
            "windows-terminal-integration-race.test.ps1",
            "windows-wrapper-smoke.test.ps1"
          )) {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File "apps/electron/resources/scripts/tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

      - name: Build and validate macOS release
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -o pipefail
          bun run electron:dist:mac --arch=x64 2>&1 | tee "$RUNNER_TEMP/full-validation-macos.log"

      - name: Build and validate Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          bun run electron:dist:win --arch=x64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/full-validation-windows.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows release validation failed" }

      - name: Build and validate Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          xvfb-run -a bash -c '
            set -o pipefail
            export POLO_AI_E2E_EXPECTED_DISPLAY="$DISPLAY"
            bun run electron:dist:linux --arch=x64 2>&1 | tee "$1"
          ' _ "$RUNNER_TEMP/full-validation-linux.log"

      - name: Require updater outputs
        shell: bash
        run: |
          test -f "apps/electron/release/${{ matrix.artifact }}"
          test -f "apps/electron/release/${{ matrix.manifest }}"

      - name: Upload curated release input
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/electron/release/${{ matrix.artifact }}
            apps/electron/release/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-validation-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/full-validation-${{ matrix.platform }}.log
            apps/electron/release/release-signing-audit-*.jsonl
            previous/verified-contract-${{ matrix.platform }}.json
          if-no-files-found: ignore
          retention-days: 14
