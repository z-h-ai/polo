name: Restore failed updates server release
description: Retry the sole PVC writer rollback and prove its durable exact predecessor is latest.

inputs:
  version:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        for attempt in $(seq 1 3); do
          if bash scripts/updates-server-exec.sh \
            /app/polo-release-job cancel \
              --version "${{ inputs.version }}" \
          && bash scripts/updates-server-exec.sh \
            /usr/local/bin/bun /app/publish-electron-release.ts rollback-failed \
              --releases-dir /data/releases \
              --version "${{ inputs.version }}" \
          && bash scripts/updates-server-exec.sh \
            /usr/local/bin/bun /app/publish-electron-release.ts assert-rollback-target \
              --releases-dir /data/releases \
              --version "${{ inputs.version }}"; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then sleep 5; fi
        done
        echo "::error::Could not prove the exact predecessor latest pointer after release failure"
        exit 1
