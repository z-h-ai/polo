<style>

:root {

  --info-rgb: 180, 120, 40;
  --success: oklch(0.55 0.17 145);
  --success-rgb: 34, 120, 60;
  --destructive: oklch(0.58 0.24 28);
  --destructive-rgb: 180, 60, 50;
  --background-elevated: color-mix(in srgb, var(--foreground) 1.5%, var(--background));
  --foreground-dimmed: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --user-bubble: oklch(from var(--foreground) l c h / 0.05);
  --border: oklch(from var(--foreground) l c h / 0.05);
  --input: oklch(from var(--foreground) l c h / 0.1);
  --ring: oklch(from var(--foreground) l c h / 0.25);
  --fg-2: color-mix(in srgb, var(--foreground) 2%, var(--background));
  --fg-3: color-mix(in srgb, var(--foreground) 3%, var(--background));
  --fg-5: color-mix(in srgb, var(--foreground) 5%, var(--background));
  --fg-7: color-mix(in srgb, var(--foreground) 7%, var(--background));
  --fg-10: color-mix(in srgb, var(--foreground) 10%, var(--background));

  --fg-40: color-mix(in srgb, var(--foreground) 40%, var(--background));
  --fg-50: color-mix(in srgb, var(--foreground) 50%, var(--background));
  --fg-60: color-mix(in srgb, var(--foreground) 60%, var(--background));
  --fg-70: color-mix(in srgb, var(--foreground) 70%, var(--background));
  --fg-80: color-mix(in srgb, var(--foreground) 80%, var(--background));

  --muted: oklch(from var(--foreground) l c h / 0.05);
  --muted-foreground: var(--fg-50);

  --amber-strong: #d97706;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--background));
  --info-soft: color-mix(in srgb, var(--info) 12%, var(--background));
  --success-soft: color-mix(in srgb, var(--success) 12%, var(--background));
  --danger-soft: color-mix(in srgb, var(--destructive) 10%, var(--background));
  --on-accent: #fff;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --panel-gap: 6px;
  --panel-inset: 6px;
  --tabbar-height: 36px;
  --content-top-offset: 84px;
  --radius-xs: 2px;
  --radius-sm: 3.75px;
  --radius-md: 5.625px;
  --radius-lg: 11.25px;
  --radius-edge: 14px;
  --radius-pill: 999px;
  --topbar-height: 48px;
  /* Shadow opacity registry (index.css:113-115) and layered shadows
     (index.css:118-139, 604-652). The 1px ring is always foreground 6%. */
  --shadow-border-opacity: 0.08;
  --shadow-blur-opacity: 0.06;
  --shadow-minimal:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px;
  --shadow-middle:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 6px 6px -3px;
  --shadow-strong:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 6px 6px -3px,
    rgba(0, 0, 0, calc(var(--shadow-blur-opacity) * 0.67)) 0 12px 12px -6px,
    rgba(0, 0, 0, calc(var(--shadow-blur-opacity) * 0.67)) 0 24px 24px -12px;
  /* Tinted shadow: set --shadow-color to an "r, g, b" triple before use
     (index.css:619-628). */
  --shadow-tinted:
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), calc(var(--shadow-border-opacity) * 1.5)) 0 0 0 1px,
    rgba(var(--shadow-color, 0, 0, 0), var(--shadow-border-opacity)) 0 1px 1px -0.5px,
    rgba(var(--shadow-color, 0, 0, 0), var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(var(--shadow-color, 0, 0, 0), calc(var(--shadow-blur-opacity) * 0.67)) 0 6px 6px -3px;
  --shadow-panel: 0 18px 52px rgba(0,0,0,.18);
  --shadow-modal-small:
    rgba(0,0,0,0) 0 0 0 0,
    rgba(0,0,0,0) 0 0 0 0,
    rgba(var(--foreground-rgb), .06) 0 0 0 1px,
    rgba(0,0,0,.04) 0 1px 1px -.5px,
    rgba(0,0,0,.04) 0 3px 3px 0,
    rgba(0,0,0,.02) 0 6px 6px 0,
    rgba(0,0,0,.02) 0 12px 12px 0,
    rgba(0,0,0,.02) 0 24px 24px 0;
}

html[data-theme="dark"] {
  --background: oklch(0.145 0.015 270);
  --foreground: oklch(0.95 0.01 270);
  --foreground-rgb: 237, 236, 240;
  --accent: oklch(0.65 0.22 293);
  --accent-rgb: 130, 75, 185;
  --info: oklch(0.78 0.14 70);
  --info-rgb: 210, 155, 55;
  --success: oklch(0.60 0.17 145);
  --success-rgb: 50, 140, 80;
  --destructive: oklch(0.65 0.22 28);
  --destructive-rgb: 200, 70, 60;
  --background-elevated: color-mix(in srgb, var(--foreground) 2.5%, var(--background));
  --foreground-dimmed: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --border: oklch(from var(--foreground) l c h / 0.09);
  /* Dark mode uses stronger blur opacity; the ring stays foreground 6%
     exactly as in the source (index.css:267-269 and utility classes). */
  --shadow-border-opacity: 0.15;
  --shadow-blur-opacity: 0.12;
  /* Dark tinted shadows are outline-only at uniform lightness 0.425
     (index.css:632-640). */
  --shadow-tinted:
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    oklch(from rgb(var(--shadow-color, 0, 0, 0)) 0.425 c h / 0.6) 0 0 0 1px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 1px 1px -0.5px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 3px 3px -1.5px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 6px 6px -3px;
  --amber-strong: #fbbf24;
  --shadow-panel: 0 20px 70px rgba(0,0,0,.48);
  --shadow-modal-small:
    rgba(0,0,0,0) 0 0 0 0,
    rgba(0,0,0,0) 0 0 0 0,
    rgba(var(--foreground-rgb), .12) 0 0 0 1px,
    rgba(0,0,0,.08) 0 1px 1px -.5px,
    rgba(0,0,0,.08) 0 3px 3px 0,
    rgba(0,0,0,.04) 0 6px 6px 0,
    rgba(0,0,0,.04) 0 12px 12px 0,
    rgba(0,0,0,.04) 0 24px 24px 0;
}

* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
html { font-size: 15px; font-optical-sizing: auto; background: var(--background); }
body {
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  transition: color .2s ease, background .2s ease;
}
button, input, textarea, select { color: inherit; font: inherit; }
button { border: 0; cursor: pointer; }
/* Source buttons use disabled:pointer-events-none disabled:opacity-50. */
button:disabled { pointer-events: none; opacity: .5; }
/* Source inputs/buttons focus with a 1px foreground/30 ring, not an accent
   outline (input.tsx, button.tsx). */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--foreground) 30%, transparent);
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 6px; }
*:hover::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb:hover { background: var(--fg-20); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
/* SpinKit grid spinner keyframes from packages/ui/src/styles/index.css,
   used by the source Spinner component (LoadingIndicator.tsx). */
@keyframes spinner-grid {
  0%, 70%, 100% { transform: scale3d(0.5, 0.5, 1); }
  35% { transform: scale3d(0, 0, 1); }
}
.icon { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: 0 0 auto; }
.icon svg { width: 100%; height: 100%; }
.muted { color: var(--fg-50); }
.eyebrow { margin: 0 0 7px; color: var(--fg-50); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.button { min-height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: transparent; font-size: 12px; }
.button:hover { background: var(--fg-5); }
.button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.button.danger { border-color: var(--destructive); background: var(--destructive); color: var(--on-accent); }

/* Translated from HomePage.tsx / AppIcon.tsx / TabBar.tsx Tailwind classes.
   The real app root font-size is 15px (index.css --font-size-base), so all
   Tailwind rem utilities resolve at 15px/1rem; px values below are the
   Tailwind rem values written verbatim (1rem = 15px, 0.25rem = 3.75px).
   Breakpoints are Tailwind's sm=40rem / md=48rem (600px / 720px). */

.source-home { height:100%; min-height:0; overflow-y:auto; background:var(--background); color:var(--foreground); padding:30px 15px; }
.source-home-frame { width:100%; height:100%; min-height:0; overflow:hidden; background:var(--background); color:var(--foreground); }
/* TabBar.tsx: fixed, z-panel, h-[var(--tabbar-height)], border-foreground/10,
   bg-background/95, pl 86px on mac (8px elsewhere), pr-2. */
.source-tabbar { position:fixed; inset:0 0 auto; z-index:50; display:flex; align-items:center; height:var(--tabbar-height); padding:0 7.5px 0 86px; border-bottom:1px solid color-mix(in srgb,var(--foreground) 10%,transparent); background:color-mix(in srgb,var(--background) 95%,transparent); }
/* TabBar home button: ghost icon h-7 w-7 rounded-md mr-1. Static active tab is
   Polo, so the home button has no bg (only active when home tab selected). */
.source-tabbar__home { width:26.25px; height:26.25px; margin-right:3.75px; display:flex; align-items:center; justify-content:center; padding:0; border:0; border-radius:5.625px; background:transparent; color:var(--foreground); }
.source-tabbar__home:hover { background:color-mix(in srgb,var(--foreground) 3%,transparent); }
.source-tabbar__home svg { width:15px; height:15px; }
/* TabBar tabs row: h-full items-end gap-1. */
.source-tabbar__tabs { height:100%; min-width:0; flex:1; display:flex; align-items:flex-end; gap:3.75px; overflow:hidden; }
/* Active tab: h-8 min-w-[120px] max-w-[220px] flex-1 gap-1.5 rounded-t-md
   border-foreground/10 border-b-transparent bg-foreground/8 px-2 text-xs. */
.source-tabbar__tab { position:relative; z-index:1; display:flex; flex:1 1 120px; align-items:center; gap:5.625px; min-width:120px; max-width:220px; height:30px; margin-bottom:-1px; padding:0 7.5px; overflow:hidden; border:1px solid color-mix(in srgb,var(--foreground) 10%,transparent); border-bottom-color:transparent; border-radius:5.625px 5.625px 0 0; background:color-mix(in srgb,var(--foreground) 8%,transparent); color:var(--foreground); font-size:0.75rem; line-height:1.3333; text-align:left; transition:background-color 150ms cubic-bezier(.4,0,.2,1),color 150ms cubic-bezier(.4,0,.2,1),border-color 150ms cubic-bezier(.4,0,.2,1); }
/* TabBar TabIcon polo favicon: h-3.5 w-3.5 (13.125px). */
.source-tabbar__tab img { width:13.125px; height:13.125px; flex:none; object-fit:contain; }.source-tabbar__tab span:nth-child(2){min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* TabBar close button: h-5 w-5 rounded-sm text-foreground/45, hover bg 10% +
   full foreground; its X icon is size-3.5 (13.125px). */
.source-tabbar__close{width:18.75px;height:18.75px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:3.75px;color:color-mix(in srgb,var(--foreground) 45%,transparent)}
.source-tabbar__close:hover{background:color-mix(in srgb,var(--foreground) 10%,transparent);color:var(--foreground)}
.source-tabbar__close svg{width:13.125px;height:13.125px}
/* TabContent home branch: --content-top-offset is 36px on home. */
.source-home-frame__content{height:100%;min-height:0;padding-top:36px}
/* HomePage main: px-4 py-8 sm:px-8 → 15px sides, 30px top/bottom, 30px at sm. */
@media (min-width:600px) { .source-home { padding-left:30px; padding-right:30px; } }
/* HomePage content: mx-auto max-w-7xl space-y-10. */
.source-home__content { width:100%; max-width:1050px; margin:0 auto; display:flex; flex-direction:column; gap:37.5px; }
/* HomePage heading row: mb-4 gap-4. */
.source-home__heading { display:flex; align-items:flex-end; justify-content:space-between; gap:15px; margin-bottom:15px; }
.source-home h1,.source-home h2 { margin:0; font-weight:600; color:var(--foreground); }
/* text-lg = 1.125rem/1.75 line-height at 15px root. */
.source-home h1 { font-size:1.125rem; line-height:1.5556; }
/* External-apps h2: text-base = 1rem. */
.source-home h2 { font-size:1rem; line-height:1.5; }
/* Built-in h2: text-sm font-medium. */
.source-home__builtin h2 { font-size:0.875rem; line-height:1.4286; font-weight:500; }
/* Descriptions: mt-1 text-xs = 0.75rem/1.3333. */
.source-home p { margin:3.75px 0 0; color:var(--fg-50); font-size:0.75rem; line-height:1.3333; }
/* Built-in frame: rounded-xl p-4 border-foreground/10 bg-foreground-2. */
.source-home__builtin { border:1px solid color-mix(in srgb,var(--foreground) 10%,transparent); border-radius:0.75rem; background:var(--fg-2); padding:15px; }
/* App grid: gap-x-4 gap-y-5, 3 → 4 (sm) → 6 (md) columns. */
.source-home__grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:15px; row-gap:18.75px; }
.source-home__grid--builtin { margin-top:15px; }
/* OrganizationAppCard grid: HomePage.tsx renders org cards in a
   sm:grid-cols-2 xl:grid-cols-3 responsive grid with gap-4. */
.source-home__grid--cards { grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:15px; row-gap:15px; }
@media (min-width:600px) { .source-home__grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
@media (min-width:720px) { .source-home__grid { grid-template-columns:repeat(6,minmax(0,1fr)); } }
/* AppIcon button: gap-3 p-3 rounded-lg hover bg-foreground/4, -translate-y-0.5. */
.source-app-icon { min-width:0; display:flex; flex-direction:column; align-items:center; align-self:stretch; gap:11.25px; padding:11.25px; border:1px solid transparent; border-radius:0.5rem; color:var(--foreground); background:transparent; text-align:center; outline:none; transition:transform 200ms ease-out,border-color 200ms ease-out,background-color 200ms ease-out,box-shadow 200ms ease-out; }
.source-app-icon.is-hovered { transform:translateY(-1.875px); border-color:color-mix(in srgb,var(--foreground) 10%,transparent); background:color-mix(in srgb,var(--foreground) 4%,transparent); box-shadow:var(--shadow-minimal); }
/* AppIcon art: size-[76px] rounded-lg shadow-xs; hover scale 1.04 + border 16% +
   shadow-minimal. */
.source-app-icon__art { width:76px; height:76px; display:flex; flex-shrink:0; align-items:center; justify-content:center; overflow:hidden; border:1px solid color-mix(in srgb,var(--foreground) 10%,transparent); border-radius:0.5rem; background:var(--background-elevated); box-shadow:0 1px 2px 0 rgba(0,0,0,.05); transition:transform 200ms ease-out,border-color 200ms ease-out,box-shadow 200ms ease-out; }
.source-app-icon.is-hovered .source-app-icon__art { transform:scale(1.04); border-color:color-mix(in srgb,var(--foreground) 16%,transparent); box-shadow:var(--shadow-minimal); }
.source-app-icon__art img { width:100%; height:100%; object-fit:contain; }
/* Add-tile art: dashed border-foreground/20 bg-foreground/3, hover accent. */
.source-app-icon__art--add { overflow:visible; border-style:dashed; border-color:color-mix(in srgb,var(--foreground) 20%,transparent); background:var(--fg-3); color:color-mix(in srgb,var(--foreground) 55%,transparent); }
.source-app-icon.is-hovered .source-app-icon__art--add { border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:color-mix(in srgb,var(--accent) 8%,var(--background)); color:var(--accent); }
/* Label: min-h-9 text-sm font-medium leading-[18px]; transition-colors default
   timing. */
.source-app-icon__label { min-height:33.75px; max-width:104px; display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; color:color-mix(in srgb,var(--foreground) 85%,transparent); font-size:0.875rem; font-weight:500; line-height:18px; transition:color 150ms cubic-bezier(.4,0,.2,1); }
.source-app-icon__label--add { max-width:112px; color:color-mix(in srgb,var(--foreground) 70%,transparent); }
.source-app-icon.is-hovered .source-app-icon__label { color:var(--foreground); }

</style>
