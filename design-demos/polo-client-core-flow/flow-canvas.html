<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User Flow Canvas</title>
  <style>
    :root{color-scheme:dark;--bg:#111318;--panel:#1c2028;--line:#687386;--accent:#7c9cff;--text:#f5f7fb;--muted:#a7afbf}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}
    button,select{font:inherit;color:inherit;background:#292f3a;border:1px solid #3b4351;border-radius:7px;padding:7px 9px}button{cursor:pointer}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#091126}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
    .toolbar{z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#171a21;border-bottom:1px solid #2b303a;box-shadow:0 4px 18px #0008}.brand{font-weight:700;margin-right:8px}.spacer{flex:1}.status{color:var(--muted);white-space:nowrap}
    .viewport{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(#343a46 1px,transparent 1px);background-size:20px 20px}.world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}.edges{position:absolute;overflow:visible;pointer-events:none}.edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.edge.loop{stroke-dasharray:6 5}.edge.walked{stroke:var(--accent);stroke-width:3}.edge-label{fill:var(--muted);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
    .node{position:absolute;background:var(--panel);border:1px solid #3b4351;border-radius:12px;overflow:hidden;box-shadow:0 12px 34px #0008}.node.selected{outline:3px solid var(--accent)}.node.walked{border-color:var(--accent)}.node.target{animation:target 900ms ease}.node-head{height:54px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 9px;background:#252a34;border-bottom:1px solid #3b4351;cursor:grab}.node-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-meta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scenario{padding:3px 6px;max-width:150px}.frame-wrap{position:relative;background:white;overflow:hidden}.node iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;pointer-events:none}.viewport[data-mode=interact] .node iframe{pointer-events:auto}.viewport[data-mode=interact] .node-head{cursor:default}
    .minimap{position:absolute;right:14px;bottom:14px;width:190px;height:120px;background:#13161ce8;border:1px solid #3b4351;border-radius:9px;z-index:15;overflow:hidden}.mini-node{position:absolute;background:#59657a;border-radius:2px}.mini-node.walked{background:var(--accent)}.mini-view{position:absolute;border:1px solid white;pointer-events:none}.pathbar{min-height:38px;display:flex;align-items:center;gap:7px;padding:6px 10px;border-top:1px solid #2b303a;background:#171a21;overflow:auto}.crumb{border:0;background:transparent;padding:4px;color:var(--muted)}.crumb.active{color:var(--accent)}.hint{margin-left:auto;color:var(--muted);white-space:nowrap}@keyframes target{50%{box-shadow:0 0 0 8px #7c9cff55,0 12px 34px #0008}}
    @media(max-width:700px){.brand,.status,.hint{display:none}.toolbar{overflow:auto}.spacer{display:none}.minimap{width:140px;height:90px}}
  </style>
</head>
<body>
<div class="app">
  <header class="toolbar" aria-label="Canvas tools">
    <span class="brand" id="flow-name">User Flow</span>
    <button id="tool-hand" data-tool="hand" aria-pressed="true" title="Hand (1)">Hand</button>
    <button id="tool-select" data-tool="select" aria-pressed="false" title="Select (2)">Select</button>
    <button id="tool-interact" data-tool="interact" aria-pressed="false" title="Interact (3)">Interact</button>
    <button id="fit-all" title="Fit all (0)">Fit all</button>
    <button id="reset">Reset</button>
    <span class="spacer"></span>
    <label>Theme <select id="theme-select"></select></label>
    <label>Language <select id="lang-select"></select></label>
    <label>Viewport <select id="viewport-select"></select></label>
    <span class="status" id="zoom-status">100%</span>
  </header>
  <main class="viewport" id="viewport" data-mode="hand" tabindex="0" aria-label="Interactive user flow canvas">
    <div class="world" id="world"><svg class="edges" id="edges" aria-hidden="true"></svg><div id="nodes"></div></div>
    <div class="minimap" id="minimap" aria-label="Minimap"><div class="mini-view" id="mini-view"></div></div>
  </main>
  <nav class="pathbar" id="pathbar" aria-label="Walked path"><span class="hint">1 Hand · 2 Select · 3 Interact · 0 Fit · +/- Zoom · arrows Navigate</span></nav>
</div>

  function renderNodes(){const g=geometry();nodesRoot.replaceChildren();for(const s of manifest.states){const p=state.positions.get(s.id),node=document.createElement('section');node.className='node';node.dataset.stateId=s.id;node.style.cssText=`width:${g.nodeW}px;height:${g.nodeH}px;transform:translate(${p.x}px,${p.y}px)`;node.innerHTML='<header class="node-head"><div><div class="node-title"></div><div class="node-meta"></div></div></header><div class="frame-wrap"><iframe></iframe></div>';node.querySelector('.node-title').textContent=s.name;node.querySelector('.node-meta').textContent=`${s.userGoal} · ${s.systemFeedback}`;const wrap=node.querySelector('.frame-wrap'),frame=node.querySelector('iframe');wrap.style.cssText=`width:${g.previewW}px;height:${g.previewH}px`;frame.style.cssText=`width:${g.viewport.width}px;height:${g.viewport.height}px;transform:scale(${g.previewScale})`;frame.title=s.name;const scenarios=scenariosFor(s.id);if(!state.scenarios.has(s.id))state.scenarios.set(s.id,scenarios[0]?.id||s.scenario||'default');if(scenarios.length>1){const select=document.createElement('select');select.className='scenario';select.setAttribute('aria-label',`${s.name} scenario`);option(select,scenarios,v=>v.label);select.value=state.scenarios.get(s.id);select.addEventListener('change',()=>{state.scenarios.set(s.id,select.value);markFrameReady(frame);frame.src=`prototype.html?${queryFor(s.id,select.value)}`});node.querySelector('.node-head').append(select)}markFrameReady(frame);frame.src=`prototype.html?${queryFor(s.id,state.scenarios.get(s.id))}`;node.addEventListener('pointerdown',e=>startNodeDrag(e,s.id));node.addEventListener('click',()=>selectNode(s.id));nodesRoot.append(node)}updateClasses();renderEdges();renderMinimap()}
  function worldBounds(){const g=geometry(),ps=[...state.positions.values()];return{minX:Math.min(...ps.map(p=>p.x)),minY:Math.min(...ps.map(p=>p.y)),maxX:Math.max(...ps.map(p=>p.x))+g.nodeW,maxY:Math.max(...ps.map(p=>p.y))+g.nodeH}}
  function renderEdges(){const g=geometry(),bounds=worldBounds(),width=bounds.maxX+layout.pad,height=bounds.maxY+layout.pad;edges.setAttribute('width',width);edges.setAttribute('height',height);edges.setAttribute('viewBox',`0 0 ${width} ${height}`);edges.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>';for(const t of manifest.transitions){const a=state.positions.get(t.from),b=state.positions.get(t.to),loop=t.resultType==='loop'||b.x<=a.x;let d,labelX,labelY;if(loop){const lift=70+(manifest.transitions.indexOf(t)%3)*24;d=`M ${a.x+g.nodeW/2} ${a.y} C ${a.x+g.nodeW/2} ${a.y-lift}, ${b.x+g.nodeW/2} ${b.y-lift}, ${b.x+g.nodeW/2} ${b.y}`;labelX=(a.x+b.x+g.nodeW)/2;labelY=Math.min(a.y,b.y)-lift+14}else{const x1=a.x+g.nodeW,y1=a.y+g.nodeH/2,x2=b.x,y2=b.y+g.nodeH/2,mid=(x1+x2)/2;d=`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;labelX=mid;labelY=(y1+y2)/2-8}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('class',`edge ${loop?'loop':''} ${state.walkedEdges.includes(t.id)?'walked':''}`);path.dataset.transitionId=t.id;edges.append(path);const text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('x',labelX);text.setAttribute('y',labelY);text.setAttribute('text-anchor','middle');text.setAttribute('class','edge-label');text.textContent=`${t.action} · ${t.condition} · ${t.systemResult}`;edges.append(text)}}
  function updateTransform(){world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;document.getElementById('zoom-status').textContent=`${Math.round(state.scale*100)}%`;renderMinimap()}
  function updateClasses(target){document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('selected',n.dataset.stateId===state.selected);n.classList.toggle('walked',state.path.includes(n.dataset.stateId));n.classList.toggle('target',n.dataset.stateId===target)});renderEdges();renderPath()}
  function renderPath(){pathbar.querySelectorAll('.crumb').forEach(n=>n.remove());state.path.forEach((id,i)=>{const b=document.createElement('button');b.className=`crumb ${i===state.path.length-1?'active':''}`;b.textContent=byId.get(id).name;b.addEventListener('click',()=>focusNode(id));pathbar.insertBefore(b,pathbar.querySelector('.hint'))})}
  function selectNode(id){if(state.mode==='interact')return;state.selected=id;updateClasses()}
  function focusNode(id){const g=geometry(),p=state.positions.get(id);state.scale=Math.max(.05,Math.min(1,(canvasViewport.clientWidth-120)/g.nodeW,(canvasViewport.clientHeight-120)/g.nodeH));state.tx=canvasViewport.clientWidth/2-(p.x+g.nodeW/2)*state.scale;state.ty=canvasViewport.clientHeight/2-(p.y+g.nodeH/2)*state.scale;state.selected=id;updateTransform();updateClasses(id)}
  function setMode(mode){state.mode=mode;canvasViewport.dataset.mode=mode;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===mode)))}
  function fit(){const b=worldBounds(),width=b.maxX-b.minX,height=b.maxY-b.minY;state.scale=Math.max(.05,Math.min(.95,(canvasViewport.clientWidth-60)/width,(canvasViewport.clientHeight-60)/height));state.tx=(canvasViewport.clientWidth-width*state.scale)/2-b.minX*state.scale;state.ty=(canvasViewport.clientHeight-height*state.scale)/2-b.minY*state.scale;updateTransform()}
  function reset(){initialPositions();state.path=[manifest.flow.entryState];state.walkedEdges=[];state.selected=null;renderNodes();requestAnimationFrame(fit)}
  function startNodeDrag(e,id){if(state.mode!=='select'||e.target.closest('select'))return;e.preventDefault();const start={x:e.clientX,y:e.clientY,...state.positions.get(id)};const move=event=>{state.positions.set(id,{x:start.x+(event.clientX-start.x)/state.scale,y:start.y+(event.clientY-start.y)/state.scale});document.querySelector(`[data-state-id="${CSS.escape(id)}"]`).style.transform=`translate(${state.positions.get(id).x}px,${state.positions.get(id).y}px)`;renderEdges();renderMinimap()};const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up)};addEventListener('pointermove',move);addEventListener('pointerup',up)}
  let pan=null;canvasViewport.addEventListener('pointerdown',e=>{if(state.mode!=='hand'||e.target!==canvasViewport)return;pan={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};canvasViewport.setPointerCapture(e.pointerId)});canvasViewport.addEventListener('pointermove',e=>{if(!pan)return;state.tx=pan.tx+e.clientX-pan.x;state.ty=pan.ty+e.clientY-pan.y;updateTransform()});canvasViewport.addEventListener('pointerup',()=>pan=null);canvasViewport.addEventListener('wheel',e=>{e.preventDefault();const old=state.scale,next=Math.max(.05,Math.min(2.5,old*Math.exp(-e.deltaY*.001))),r=canvasViewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;state.tx=x-(x-state.tx)*next/old;state.ty=y-(y-state.ty)*next/old;state.scale=next;updateTransform()},{passive:false});
  function renderMinimap(){const mini=document.getElementById('minimap'),g=geometry(),b=worldBounds(),width=b.maxX+layout.pad,height=b.maxY+layout.pad,k=Math.min(mini.clientWidth/width,mini.clientHeight/height);mini.querySelectorAll('.mini-node').forEach(n=>n.remove());for(const[id,p]of state.positions){const n=document.createElement('div');n.className=`mini-node ${state.path.includes(id)?'walked':''}`;Object.assign(n.style,{left:`${p.x*k}px`,top:`${p.y*k}px`,width:`${g.nodeW*k}px`,height:`${g.nodeH*k}px`});mini.append(n)}const view=document.getElementById('mini-view');Object.assign(view.style,{left:`${-state.tx/state.scale*k}px`,top:`${-state.ty/state.scale*k}px`,width:`${canvasViewport.clientWidth/state.scale*k}px`,height:`${canvasViewport.clientHeight/state.scale*k}px`})}
  function refreshFrames(){document.querySelectorAll('.node').forEach(n=>{const frame=n.querySelector('iframe');markFrameReady(frame);frame.src=`prototype.html?${queryFor(n.dataset.stateId,state.scenarios.get(n.dataset.stateId))}`})}
  function changeViewport(id){state.viewport=id;initialPositions();renderNodes();requestAnimationFrame(fit)}
  function snapshot(){const g=geometry();return{mode:state.mode,scale:state.scale,tx:state.tx,ty:state.ty,selected:state.selected,path:[...state.path],walkedEdges:[...state.walkedEdges],theme:state.theme,lang:state.lang,viewport:state.viewport,scenarios:Object.fromEntries(state.scenarios),geometry:{...g,viewport:{...g.viewport}},positions:Object.fromEntries(state.positions)}}
  addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(!d||d.type!=='user-flow:navigate'||d.flowId!==manifest.flow.id)return;const node=[...document.querySelectorAll('.node')].find(n=>n.querySelector('iframe').contentWindow===e.source);if(!node||node.dataset.stateId!==d.fromState)return;const t=manifest.transitions.find(t=>t.id===d.transitionId&&t.from===d.fromState&&t.to===d.toState);if(!t)return;state.walkedEdges.push(t.id);state.path.push(t.to);updateClasses(t.to);focusNode(t.to)});
  document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.tool)));document.getElementById('fit-all').addEventListener('click',fit);document.getElementById('reset').addEventListener('click',reset);
  const theme=document.getElementById('theme-select'),lang=document.getElementById('lang-select'),vp=document.getElementById('viewport-select');option(theme,manifest.protocol.themes);option(lang,manifest.protocol.langs);option(vp,manifest.protocol.viewports,v=>v.name);theme.value=state.theme;lang.value=state.lang;vp.value=state.viewport;theme.addEventListener('change',()=>{state.theme=theme.value;refreshFrames()});lang.addEventListener('change',()=>{state.lang=lang.value;refreshFrames()});vp.addEventListener('change',()=>changeViewport(vp.value));
  addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='1')setMode('hand');else if(e.key==='2')setMode('select');else if(e.key==='3')setMode('interact');else if(e.key==='0')fit();else if(e.key==='+'||e.key==='='){state.scale=Math.min(2.5,state.scale*1.15);updateTransform()}else if(e.key==='-'){state.scale=Math.max(.05,state.scale/1.15);updateTransform()}else if(e.key.startsWith('Arrow')){const i=Math.max(0,manifest.states.findIndex(s=>s.id===state.selected)),next=manifest.states[(i+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+manifest.states.length)%manifest.states.length];focusNode(next.id)}});
  document.getElementById('flow-name').textContent=manifest.flow.name;initialPositions();renderNodes();requestAnimationFrame(fit);window.__USER_FLOW_CANVAS__=Object.freeze({snapshot,focusNode,fit,changeViewport});window.__USER_FLOW_CANVAS_READY__=true;
})();
