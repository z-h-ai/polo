<!DOCTYPE html><html lang="zh-Hans" data-theme="dark" data-viewport="desktop"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Polo 客户端核心任务主路径</title>
  <link rel="stylesheet" href="assets/source-derived.css">
</head>
<body>
  <div class="guard" aria-hidden="true"><div><p class="eyebrow">窗口保护</p><h1>窗口过窄</h1><p>请放大 Polo 窗口后继续使用工作台。Polo 客户端面向桌面窗口。</p></div></div>
  <main id="app"><div class="shell">
        <header class="topbar">
        <div class="brand"><span class="brand-mark">P</span><span>Polo</span></div>
        <nav class="tabs" aria-label="应用标签">
          <button class="tab ">首页</button>
          <button class="tab active">商务写作 · 准备中</button>
        </nav>
        <button class="space"><span class="space-dot"></span>我的空间</button>
      </header>
        <section class="main">
          <div class="subhead"><div><p class="eyebrow">工作 App</p><h1>商务写作</h1><p class="lead">认证创作者 · 桥见圈子 · v1.6.0</p></div><span class="badge">准备中</span></div>
          <div class="workspace"><span class="art">▣</span><p class="eyebrow">我的空间 · App 工作区</p><h2>正在准备本次执行</h2><p>执行请求已接受。本次执行固定使用 v1.6.0，切换 Tab 不会终止。</p><div class="progress" aria-label="准备进度"><span></span></div></div>
        </section>
      </div></main>
  <script id="prototype-config" type="application/json">
  {"flowId":"polo-start-work","states":["space-home","assistant-boundary","app-catalog","app-open","app-preparing"],"themes":["light","dark"],"langs":["zh-Hans"],"viewports":["desktop-fhd","desktop","laptop","tablet-landscape","tablet-portrait","mobile-large","mobile","mobile-compact"],"scenarios":["default"]}
  </script>
  <script>
    (() => {
      const config = JSON.parse(document.getElementById("prototype-config").textContent);
      const params = new URLSearchParams(location.search);
      const choose = (key, values) => values.includes(params.get(key)) ? params.get(key) : values[0];
      const current = {
        scene: choose("scene", config.states),
        theme: choose("theme", config.themes),
        lang: choose("lang", config.langs),
        viewport: choose("viewport", config.viewports),
        scenario: choose("scenario", config.scenarios)
      };
      document.documentElement.dataset.theme = current.theme;
      document.documentElement.lang = current.lang;
      document.documentElement.dataset.viewport = current.viewport;
      window.__USER_FLOW_CONTEXT__ = Object.freeze(current);

      window.UserFlowHarness = {
        install({ flowId, stateId, transitions }) {
          if (flowId !== config.flowId || stateId !== current.scene) throw new Error("Harness identity mismatch");
          document.addEventListener("click", event => {
            const matches = transitions.filter(item => event.target.closest(item.trigger.selector) && (item.fixture?.id || "default") === current.scenario);
            if (matches.length !== 1) return;
            event.preventDefault();
            const transition = matches[0];
            parent.postMessage({ type: "user-flow:navigate", flowId, fromState: stateId, transitionId: transition.id, toState: transition.to }, location.origin);
          }, true);
        },
        ready() {
          Promise.resolve(document.fonts?.ready).then(() => { window.__USER_FLOW_READY__ = true; });
        }
      };

      const header = (active, extraTabs = "") => `<header class="topbar">
        <div class="brand"><span class="brand-mark">P</span><span>Polo</span></div>
        <nav class="tabs" aria-label="应用标签">
          <button class="tab ${active === "home" ? "active" : ""}">首页</button>
          ${extraTabs}
        </nav>
        <button class="space"><span class="space-dot"></span>我的空间</button>
      </header>`;

      const home = () => `<div class="shell">
        ${header("home")}
        <section class="main">
          <div class="hero"><div><h1>早上好，林然</h1><p class="lead">在 <strong>我的空间</strong> 继续今天的工作。Apps、文件和运行状态始终跟随当前空间。</p></div><button class="quiet-link">我的圈子 · 3 个</button></div>
          <section class="section">
            <div class="section-head"><div><h2>常用 Apps</h2><p>Polo 助手固定在第一位，其余入口来自我的空间。</p></div><button class="quiet-link" data-home-view="catalog">全部 Apps</button></div>
            <div class="grid">
              <article class="card assistant"><span class="art">✦</span><h3>Polo 助手</h3><p class="source">Polo 内置 · 2 个 Skill 已启用</p><p class="description">使用当前空间已经启用的 Skills 完成研究、整理和执行。</p><div class="actions"><button class="button ghost">管理 Skills</button><button class="button primary" data-open="assistant">打开助手</button></div></article>
              <article class="card"><span class="art">▣</span><h3>客户访谈整理</h3><p class="source">认证创作者 · 北极星工作室</p><p class="description">把录音与笔记整理为可审核洞察。</p><div class="actions"><span class="badge">运行中</span><button class="button ghost">打开</button></div></article>
              <article class="card"><span class="art">▦</span><h3>素材清洗器</h3><p class="source">认证创作者 · 北极星工作室</p><p class="description">检查格式与字段，首次打开时会准备所需资源。</p><div class="actions"><button class="button ghost">打开</button></div></article>
            </div>
          </section>
        </section>
      </div>`;

      const catalog = () => `<div class="shell">
        ${header("home")}
        <section class="main">
          <div class="subhead"><div><p class="eyebrow">我的空间</p><h1>全部 Apps</h1><p class="lead">首页只放最常用的 5 个工作 App；其他 Apps 始终可以在这里搜索和打开。</p></div><button class="quiet-link">返回首页</button></div>
          <div class="search"><label>搜索当前空间的 App<input id="app-catalog-search" value="商务写作" aria-label="搜索当前空间的 App"></label><span>显示 1 / 7 个 Apps</span></div>
          <section class="section"><div class="section-head"><div><h2>当前空间的全部 Apps</h2><p>来自 3 个圈子的作品会分别显示，并持续标明来源圈子。</p></div></div>
            <div class="grid">
              <article class="card catalog-card highlighted"><span class="art">▣</span><h3>商务写作</h3><span class="source-pill">来自 桥见圈子</span><p class="description">根据选定材料生成正式商务文本。</p><p class="source">桥见创作室 · v1.6.0</p><div class="actions"><button class="button ghost">显示在首页</button><button class="button primary" data-open="writing">打开</button></div></article>
              <article class="card catalog-card"><span class="art">▣</span><h3>客户访谈整理</h3><span class="source-pill">来自 北极星共创社</span><p class="description">把录音与笔记整理为可审核洞察。</p><div class="actions"><button class="button ghost" data-open="research">打开</button></div></article>
              <article class="card catalog-card"><span class="art">⌾</span><h3>合规审阅</h3><span class="source-pill">来自 桥见圈子</span><p class="description">该版本因严重安全风险被平台阻断。</p><div class="actions"><span class="badge bad">已阻断</span><button class="button ghost" data-explain="blocked">查看原因</button></div></article>
            </div>
          </section>
        </section>
      </div>`;

      const appOpen = () => `<div class="shell">
        ${header("writing", `<button class="tab active">商务写作</button>`)}
        <section class="main">
          <div class="subhead"><div><p class="eyebrow">工作 App</p><h1>商务写作</h1><p class="lead">认证创作者 · 桥见圈子 · v1.6.0<br>根据选定材料生成正式商务文本。</p></div><button class="quiet-link">权限</button></div>
          <div class="workspace"><span class="art">▣</span><p class="eyebrow">我的空间 · App 工作区</p><h2>准备开始一次新的使用</h2><p>启动前会重新验证当前空间、授权和版本。</p><div class="actions"><button class="button primary" data-start-app="writing">开始使用</button></div></div>
        </section>
      </div>`;

      const appPreparing = () => `<div class="shell">
        ${header("writing", `<button class="tab active">商务写作 · 准备中</button>`)}
        <section class="main">
          <div class="subhead"><div><p class="eyebrow">工作 App</p><h1>商务写作</h1><p class="lead">认证创作者 · 桥见圈子 · v1.6.0</p></div><span class="badge">准备中</span></div>
          <div class="workspace"><span class="art">▣</span><p class="eyebrow">我的空间 · App 工作区</p><h2>正在准备本次执行</h2><p>执行请求已接受。本次执行固定使用 v1.6.0，切换 Tab 不会终止。</p><div class="progress" aria-label="准备进度"><span></span></div></div>
        </section>
      </div>`;

      const assistantBoundary = () => `<div class="shell">
        ${header("assistant", `<button class="tab active">Polo 助手</button>`)}
        <section class="main">
          <div class="assistant-boundary"><aside class="assistant-sidebar"><strong>Polo 助手</strong><p>当前空间：我的空间</p><p>对话、资料源、Skills 和运行上下文只属于当前空间。</p></aside><div class="assistant-body"><div><span class="art">✦</span><h2>已进入 Polo 助手</h2><p>客户端只负责打开同一个助手宿主并传入当前空间。正式界面直接复用现有 Polo 助手代码。</p><div class="boundary-note">本节点验证入口、Tab 与空间隔离边界，不重新制作助手内部 Mock。</div></div></div></div>
        </section>
      </div>`;

      const views = {
        "space-home": home,
        "assistant-boundary": assistantBoundary,
        "app-catalog": catalog,
        "app-open": appOpen,
        "app-preparing": appPreparing
      };
      document.getElementById("app").innerHTML = views[current.scene]();

      const transitions = [
        { id: "open-assistant", from: "space-home", to: "assistant-boundary", trigger: { selector: "[data-open='assistant']" }, fixture: { id: "default" } },
        { id: "browse-all-apps", from: "space-home", to: "app-catalog", trigger: { selector: "[data-home-view='catalog']" }, fixture: { id: "default" } },
        { id: "open-writing", from: "app-catalog", to: "app-open", trigger: { selector: "[data-open='writing']" }, fixture: { id: "default" } },
        { id: "start-writing", from: "app-open", to: "app-preparing", trigger: { selector: "[data-start-app='writing']" }, fixture: { id: "default" } }
      ].filter(item => item.from === current.scene);
      UserFlowHarness.install({ flowId: config.flowId, stateId: current.scene, transitions });
      if (current.scene === "app-catalog") requestAnimationFrame(() => document.getElementById("app-catalog-search")?.focus());
      UserFlowHarness.ready();
    })();
  </script>


</body></html>
