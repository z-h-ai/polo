        </div>
        <div data-question-footer style={{flexShrink:0,minHeight:45,display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid var(--border)",background:"var(--background)"}}>
          <span data-question-status aria-live="polite" style={{flex:1,minWidth:0,fontSize:10,lineHeight:1.35,color:error?"var(--destructive)":currentComplete?"var(--fg-40)":"var(--fg-50)"}}>{submitting ? t.submitting : error ? error : currentComplete ? (step===0?t.choseDelete:t.choseNotify) : (step===0?t.chooseDelete:t.chooseNotify)}</span>
          {renderButton({id:"cancel",label:t.cancel,onClick:onCancel})}
          {step>0&&renderButton({id:"back",label:t.back,icon:<Ico.ChevLeft size={13}/>,onClick:()=>moveToStep(step-1)})}
          {step<request.questions.length-1?renderButton({id:"next",label:t.next,primary:true,disabled:!currentComplete,icon:<Ico.ChevRight size={13}/>,onClick:()=>moveToStep(step+1)}):renderButton({id:"confirm",label:error?t.retry:(submitting?t.submitting:t.confirm),primary:true,disabled:!allComplete,icon:submitting?<span style={{width:12,height:12,border:"1.5px solid currentColor",borderTopColor:"transparent",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>:<Ico.Check size={13}/>,onClick:submit})}
        </div>
      </div>;
    }

    function FreeformComposer({ onAsk, draft, onDraftChange, lang }) {
      const t = COPY[lang];
      return <div>
        <div style={{minHeight:33,display:"flex",alignItems:"flex-start",gap:8,marginBottom:8,padding:"1px 1px 2px"}}><button type="button" onClick={onAsk} style={{height:30,padding:"0 8px 0 10px",display:"inline-flex",alignItems:"center",gap:6,border:0,borderRadius:8,background:"color-mix(in srgb,var(--info) 10%,transparent)",color:"var(--info)",boxShadow:"0 1px 2px color-mix(in srgb,var(--info) 18%,transparent)",fontSize:12,fontWeight:500,cursor:"pointer"}}><span style={{width:14,height:14,border:"1.5px solid currentColor",borderRadius:"50%",display:"inline-grid",placeItems:"center",fontSize:9}}>?</span><span>{t.ask}</span><I d={iconPaths.chevDown} size={14}/></button></div>
        <div style={{position:"relative",overflow:"hidden",borderRadius:12,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 3px 8px rgba(0,0,0,.05)"}}>
          <textarea value={draft} onChange={event=>onDraftChange(event.target.value)} placeholder={t.placeholder} style={{display:"block",width:"100%",minHeight:88,maxHeight:300,resize:"none",padding:"16px 16px 12px 20px",border:0,outline:0,color:"var(--foreground)",background:"transparent",lineHeight:1.5}}/>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:8,borderTop:"1px solid var(--border)"}}><button type="button" style={{height:28,padding:"0 8px",border:0,borderRadius:6,background:"transparent",color:"var(--fg-60)"}}>{t.attach}</button><button type="button" style={{height:28,padding:"0 8px",border:0,borderRadius:6,background:"transparent",color:"var(--fg-60)"}}>{t.sources}</button><span style={{flex:1}}/><button type="button" disabled={!draft.trim()} style={{width:28,height:28,border:0,borderRadius:9999,color:"var(--background)",background:draft.trim()?"var(--foreground)":"var(--fg-10)",opacity:draft.trim()?1:.5}}>↑</button></div>
        </div>
      </div>;
    }

    function ChatConversation({ resolution, answerSummary, children, onReset, lang }) {
      const t = COPY[lang];
      const [titleHovered, setTitleHovered] = useState(false);
      const [shareHovered, setShareHovered] = useState(false);
      const bubble = (content, user, key) => <div key={key} style={{paddingTop:user?16:8,paddingBottom:user?8:0,display:"flex",justifyContent:user?"flex-end":"flex-start",animation:"answerIn 220ms ease-out"}}><div style={{maxWidth:user?"80%":"90%",padding:user?"10px 14px":"12px 16px 12px 24px",border:user?"1px solid var(--border)":0,borderRadius:user?10:8,background:user?"var(--user-bubble)":"var(--background)",boxShadow:"0 1px 2px rgba(0,0,0,.05)",fontSize:14,lineHeight:1.6,overflowWrap:"anywhere"}}>{content}</div></div>;
      return <section aria-label="Session" style={{height:"100%",minWidth:0,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--background)"}}>
        <header style={{height:42,minHeight:42,display:"flex",alignItems:"center",gap:6,paddingLeft:16,paddingRight:8}}>
          <div style={{minWidth:0,flex:1}}><button type="button" onMouseEnter={()=>setTitleHovered(true)} onMouseLeave={()=>setTitleHovered(false)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 8px",border:0,borderRadius:6,color:"var(--foreground)",background:titleHovered?"var(--fg-5)":"transparent"}}><h1 style={{margin:0,fontSize:14,fontWeight:600}}>项目删除流程</h1><I d={iconPaths.chevDown} size={14} style={{color:"var(--fg-50)"}}/></button></div>
          {resolution&&<button type="button" onClick={onReset} style={{height:28,padding:"0 10px",border:"1px solid var(--border)",borderRadius:6,background:"transparent",color:"var(--fg-60)",fontSize:11,cursor:"pointer"}}>{t.replay}</button>}
          <button type="button" aria-label="Share session" onMouseEnter={()=>setShareHovered(true)} onMouseLeave={()=>setShareHovered(false)} style={{width:28,height:28,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:6,border:0,borderRadius:6,color:shareHovered?"var(--foreground)":"var(--fg-70)",background:shareHovered?"var(--fg-5)":"var(--background)",boxShadow:"0 1px 2px rgba(0,0,0,.06)"}}><I d={iconPaths.share} size={16}/></button>
        </header>
        <div style={{minHeight:0,flex:1,display:"flex",flexDirection:"column"}}>
          <main data-polo-chat-scroll style={{minHeight:0,flex:1,overflowY:"auto",maskImage:"linear-gradient(to bottom,transparent 0%,black 32px,black calc(100% - 32px),transparent 100%)"}}><div style={{width:"100%",maxWidth:840,minHeight:"100%",margin:"0 auto",padding:"32px 20px",display:"flex",flexDirection:"column",gap:10}}>
            {bubble(t.initialUser,true,"initial-user")}{bubble(t.initialAssistant,false,"initial-assistant")}
            {resolution==="answered"&&<>{bubble(answerSummary,true,"resolved-user")}{bubble(t.continued,false,"resolved-assistant")}</>}
            {resolution==="cancelled"&&<>{bubble(<><strong>{t.cancelled}</strong><br/><span style={{color:"var(--fg-50)",fontSize:12}}>{t.cancelNote}</span></>,true,"cancelled-user")}</>}
          </div></main>
          <div style={{width:"100%",maxWidth:840,margin:"4px auto 0",padding:"1px 16px 16px",flexShrink:0}}>{children}</div>
        </div>
      </section>;
    }

    function PoloShell({ children, theme, onThemeToggle, onReset }) {
      const [sidebarVisible, setSidebarVisible] = useState(true);
      const [hovered, setHovered] = useState("");
      const buttonReset = {padding:0,border:0,fontFamily:"var(--font-sans)",cursor:"pointer"};
      const iconButton = (id, label, glyph, onClick, disabled=false) => <button type="button" aria-label={label} title={label} disabled={disabled} onClick={onClick} onMouseEnter={()=>setHovered(id)} onMouseLeave={()=>setHovered("")} style={{...buttonReset,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,color:id==="polo"?"var(--accent)":"var(--fg-70)",background:hovered===id?"var(--fg-5)":"transparent",opacity:disabled?.3:1}}>{glyph}</button>;
      const navs = [
        ["all","All Sessions","inbox",true,0],["flag","Flagged","flag",false,1],["archive","Archived","archive",false,1],["labels","Labels","tag",false,0],["sources","Sources","database",false,0],["apis","APIs","globe",false,1],["folders","Local Folders","folder",false,1],["skills","Skills","zap",false,0],["auto","Automations","list",false,0],["scheduled","Scheduled","clock",false,1],["event","Event","radio",false,1],["agentic","Agentic","bot",false,1]
      ];
      return <div data-theme={theme} style={{position:"relative",width:"100%",height:"100%",overflow:"hidden",background:"var(--background)",color:"var(--foreground)",colorScheme:theme}}>
        <div data-polo-tabbar style={{position:"fixed",inset:"0 0 auto",zIndex:40,height:36,display:"flex",alignItems:"center",padding:"0 8px 0 86px",borderBottom:"1px solid var(--fg-10)",background:"color-mix(in srgb,var(--background) 95%,transparent)"}}>
          <button type="button" aria-label="Home" style={{...buttonReset,width:28,height:28,display:"grid",placeItems:"center",borderRadius:6,background:"var(--fg-7)"}}><I d={iconPaths.home} size={16} sw={1.5}/></button>
          <button type="button" style={{...buttonReset,height:32,minWidth:120,maxWidth:220,flex:"0 1 220px",alignSelf:"flex-end",marginLeft:4,marginBottom:-1,padding:"0 8px",display:"flex",alignItems:"center",gap:6,border:"1px solid var(--fg-10)",borderBottomColor:"var(--background)",borderRadius:"6px 6px 0 0",background:"var(--fg-7)",fontSize:12}}><span style={{color:"var(--accent)",display:"inline-flex"}}><PoloSymbol size={14}/></span><span style={{flex:1,textAlign:"left"}}>Polo 助手</span><I d={iconPaths.close} size={14} sw={1.5}/></button>
          <span style={{flex:1}}/><span style={{fontSize:10,color:"var(--fg-40)",paddingRight:8}}>POO-50 · 交互原型</span>
        </div>
        <div style={{position:"fixed",top:36,left:0,right:0,zIndex:30,height:"var(--topbar-h)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
          <div style={{minWidth:0,flex:1,display:"flex",alignItems:"center",gap:2,paddingLeft:12}}>{iconButton("sidebar","Toggle Sidebar",<I d={["M9 4V20","M3.5 11.5v1c0 3.77 0 5.66 1.17 6.83C5.84 20.5 7.73 20.5 11.5 20.5h1c3.77 0 5.66 0 6.83-1.17C20.5 18.16 20.5 16.27 20.5 12.5v-1c0-3.77 0-5.66-1.17-6.83C18.16 3.5 16.27 3.5 12.5 3.5h-1c-3.77 0-5.66 0-6.83 1.17C3.5 5.84 3.5 7.73 3.5 11.5Z"]} size={18} sw={1.5}/>,()=>setSidebarVisible(v=>!v))}{iconButton("polo","Polo AI menu",<PoloSymbol size={16}/>)}
            <div data-polo-workspace style={{width:"clamp(220px,42vw,640px)",minWidth:0,marginLeft:4,display:"flex",alignItems:"center",gap:4}}>{iconButton("back","Back",<I d={iconPaths.chevLeft} size={18}/>,null,true)}{iconButton("forward","Forward",<I d={iconPaths.chevRight} size={18}/>,null,true)}<button type="button" style={{...buttonReset,height:30,minWidth:0,flex:1,marginLeft:4,padding:"0 12px",display:"flex",alignItems:"center",gap:8,border:"1px solid var(--fg-7)",borderRadius:8,background:"transparent",color:"var(--fg-50)",fontSize:13}}><span style={{width:16,height:16,borderRadius:"50%",background:"var(--fg-5)"}}/><span style={{flex:1,textAlign:"left"}}>Workspace</span><I d={iconPaths.chevDown} size={12}/></button></div>
          </div>
          <div style={{paddingRight:12,display:"flex",alignItems:"center",gap:2}}>{iconButton("reset","Reset prototype",<I d={iconPaths.plus} size={16}/>,onReset)}{iconButton("theme",theme==="dark"?"切换浅色":"切换深色",theme==="dark"?<span style={{fontSize:14}}>☀</span>:<span style={{fontSize:14}}>☾</span>,onThemeToggle)}{iconButton("help","Help & Documentation",<I d={iconPaths.help} size={16}/>)}</div>
        </div>
        <main data-polo-panels style={{position:"absolute",inset:"84px 0 0",display:"flex",gap:6,minHeight:0,padding:sidebarVisible?"0 6px 6px 0":"0 6px 6px 6px"}}>
          {sidebarVisible&&<aside data-polo-sidebar style={{width:220,flex:"0 0 220px",minHeight:0,display:"flex",flexDirection:"column"}}><button type="button" style={{...buttonReset,width:"calc(100% - 16px)",margin:"0 8px 8px",padding:"7px 8px",display:"flex",alignItems:"center",gap:8,borderRadius:6,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.06)",fontSize:13,textAlign:"left"}}>✎ New Session</button><nav style={{minHeight:0,padding:"4px 8px 16px",display:"grid",alignContent:"start",gap:2,overflow:"auto"}}>{navs.map(([id,label,glyph,active,nested])=><button key={id} type="button" onMouseEnter={()=>setHovered(id)} onMouseLeave={()=>setHovered("")} style={{...buttonReset,width:"100%",display:"flex",alignItems:"center",gap:8,padding:"5px 8px",paddingLeft:nested?28:8,borderRadius:6,background:active?"var(--fg-7)":hovered===id?"var(--fg-5)":"transparent",fontSize:13,textAlign:"left"}}><span style={{width:14,height:14,display:"inline-flex",color:"var(--fg-60)"}}><I d={iconPaths[glyph]} size={14} sw={1.5}/></span>{label}</button>)}</nav></aside>}
          <section data-polo-navigator style={{width:300,flex:"0 0 300px",height:"100%",overflow:"hidden",borderRadius:10,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 4px 12px rgba(0,0,0,.08)"}}><div style={{height:"100%",padding:24,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}><span style={{width:40,height:40,marginBottom:12,padding:10,display:"grid",placeItems:"center",borderRadius:10,color:"var(--fg-50)",background:"var(--fg-5)"}}><I d={iconPaths.inbox} size={20} sw={1.5}/></span><strong style={{fontSize:14}}>No sessions yet</strong><p style={{maxWidth:260,margin:"6px 0 14px",color:"var(--fg-50)",fontSize:13,lineHeight:1.45}}>Sessions with your agent appear here. Start one to get going.</p><button type="button" style={{height:28,padding:"0 12px",border:"1px solid var(--border)",borderRadius:8,background:"var(--background)",fontSize:12}}>New Session</button></div></section>
          <section data-polo-content style={{height:"100%",minWidth:440,flex:"1 1 0",overflow:"hidden",borderRadius:"10px 14px 14px 10px",background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 4px 12px rgba(0,0,0,.08)"}}>{children}</section>
        </main>
      </div>;
    }

    function PrototypeScenarioController() {
      const query = new URLSearchParams(window.location.search);
      const initialTheme = query.get("theme") === "dark" ? "dark" : "light";
      const lang = query.get("lang") === "en" ? "en" : "zh-Hans";
      const availableScenes = ["question","multi-other","error","cancelled","resolved"];
      const scene = availableScenes.includes(query.get("scene")) ? query.get("scene") : "question";
      const initialResolution = scene === "cancelled" ? "cancelled" : scene === "resolved" ? "answered" : null;
      const [theme, setTheme] = useState(initialTheme);
      const [resolution, setResolution] = useState(initialResolution);
      const [answerSummary, setAnswerSummary] = useState(scene === "resolved" ? (lang === "en" ? "Deletion: Move to Trash; Notifications: Project admins and Security team" : "删除方式：移到废纸篓；通知范围：项目管理员、安全团队") : "");
      const [requestSequence, setRequestSequence] = useState(1);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState(scene === "error" ? COPY[lang].error : "");
      const [attempts, setAttempts] = useState(scene === "error" ? 1 : 0);
      const [draft, setDraft] = useState(COPY[lang].draft);
      const timerRef = useRef(null);
      const request = useMemo(() => makeRequest(lang, `question-${requestSequence}`), [lang, requestSequence]);
      const demoState = scene === "multi-other" || scene === "error" ? {step:1,answers:{deletion:["trash"],notifications:["admins","__other__"]},otherTexts:{notifications:lang === "en" ? "Security team" : "安全团队"}} : undefined;
      useEffect(() => { document.documentElement.dataset.theme = theme; document.documentElement.lang = lang; return () => window.clearTimeout(timerRef.current); }, [theme, lang]);
      const reset = () => { window.clearTimeout(timerRef.current); setResolution(null); setAnswerSummary(""); setSubmitting(false); setError(""); setAttempts(0); setRequestSequence(value => value + 1); };
      const submit = response => {
        if (submitting) return;
        setSubmitting(true); setError("");
        timerRef.current = window.setTimeout(() => {
          setSubmitting(false);
          if (attempts === 0) { setAttempts(1); setError(COPY[lang].error); return; }
          const labels = Object.fromEntries(request.questions.flatMap(item => item.options.map(option => [option.id, option.label])));
          const parts = response.answers.map(answer => {
            const header = request.questions.find(item => item.id === answer.questionId)?.header || answer.questionId;
            const values = [...answer.selectedOptionIds.map(id => labels[id] || id), ...(answer.otherText ? [answer.otherText] : [])];
            return `${header}：${values.join(lang === "en" ? ", " : "、")}`;
          });
          setAnswerSummary(parts.join(lang === "en" ? "; " : "；")); setResolution("answered");
        }, 650);
      };
      const cancel = () => { if (submitting) return; setError(""); setResolution("cancelled"); };
      return <PoloShell theme={theme} onThemeToggle={()=>setTheme(value=>value==="dark"?"light":"dark")} onReset={reset}>
        <ChatConversation resolution={resolution} answerSummary={answerSummary} onReset={reset} lang={lang}>
          {!resolution ? <QuestionRequest request={request} onSubmit={submit} onCancel={cancel} submitting={submitting} error={error} lang={lang} demoState={demoState}/> : <FreeformComposer onAsk={reset} draft={draft} onDraftChange={setDraft} lang={lang}/>}
        </ChatConversation>
      </PoloShell>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PrototypeScenarioController/>);
  </script>
</body>
</html>
