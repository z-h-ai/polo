<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useEffect, useMemo, useRef, useState } = React;

    const I = ({ d, size = 18, sw = 2, style }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style} aria-hidden="true">
        {(Array.isArray(d) ? d : [d]).map((path, index) => <path key={index} d={path} />)}

    );

    const iconPaths = {
      check: "M20 6 9 17l-5-5",
      chevLeft: "m15 18-6-6 6-6",
      chevRight: "m9 18 6-6-6-6",
      chevDown: "m6 9 6 6 6-6",
      home: ["M3 11 12 3l9 8", "M5 10v10h14V10", "M9 20v-6h6v6"],
      close: ["M18 6 6 18", "M6 6l12 12"],
      plus: ["M12 5v14", "M5 12h14"],
      help: ["M9.1 9a3 3 0 1 1 5.8 1c0 2-2.9 2.3-2.9 4", "M12 18h.01", "M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20"],
      inbox: ["M4 4h16v16H4z", "M4 13h4l2 3h4l2-3h4"],
      archive: ["M3 8v13h18V8", "M1 3h22v5H1z", "M10 12h4"],
      tag: ["M20.6 13.6 11 4H4v7l9.6 9.6a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8z", "M8.5 8.5h.01"],
      database: ["M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3z", "M4 6v6c0 1.7 3.6 3 8 3", "M4 12v6c0 1.7 3.6 3 8 3"],
      globe: ["M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20", "M2 12h20", "M12 2c2.5 2.7 4 6.1 4 10s-1.5 7.3-4 10c-2.5-2.7-4-6.1-4-10s1.5-7.3 4-10"],
      folder: ["M3 5h6l2 2h10v12H3z", "M3 9h18"],
      zap: "m13 2-9 12h8l-1 8 9-12h-8z",
      list: ["M9 6h11", "M9 12h11", "M9 18h11", "M4 6h.01", "M4 12h.01", "M4 18h.01"],
      clock: ["M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20", "M12 6v6l4 2"],
      radio: ["M5.5 18.5a9 9 0 0 1 0-13", "M8.5 15.5a5 5 0 0 1 0-7", "M12 12h.01"],
      bot: ["M12 8V4", "M9 4h6", "M6 8h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z", "M9 13h.01", "M15 13h.01", "M9 17h6"],
      flag: ["M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z", "M4 22v-7"],
      share: "M8 8.53809C6.74209 8.60866 5.94798 8.80911 5.37868 9.37841C4.5 10.2571 4.5 11.6713 4.5 14.4997V15.4997C4.5 18.3282 4.5 19.7424 5.37868 20.6211C6.25736 21.4997 7.67157 21.4997 10.5 21.4997H13.5C16.3284 21.4997 17.7426 21.4997 18.6213 20.6211C19.5 19.7424 19.5 18.3282 19.5 15.4997V14.4997C19.5 11.6713 19.5 10.2571 18.6213 9.37841C18.052 8.80911 17.2579 8.60866 16 8.53809M12 14V3.5M9.5 5.5C9.99903 4.50411 10.6483 3.78875 11.5606 3.24093C11.7612 3.12053 11.8614 3.06033 12 3.06033C12.1386 3.06033 12.2388 3.12053 12.4394 3.24093C13.3517 3.78875 14.001 4.50411 14.5 5.5"
    };
    const Ico = {
      Check: ({ size = 14 }) => <I d={iconPaths.check} size={size} sw={2.5} />,
      ChevLeft: ({ size = 14 }) => <I d={iconPaths.chevLeft} size={size} />,
      ChevRight: ({ size = 14 }) => <I d={iconPaths.chevRight} size={size} />,
    };

    function PoloSymbol({ size = 18 }) {
      return <svg width={size} height={size} viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M 22 85 V 10 H 44 A 19 19 0 0 1 44 48 H 34" stroke="currentColor" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round"/><circle cx="42" cy="76" r="9" fill="currentColor"/><path d="M 60 65 V 85 H 68" stroke="currentColor" strokeWidth="4" strokeLinecap="round"/><circle cx="84" cy="76" r="9" fill="currentColor"/></svg>;
    }

    function QuestionRequest({ onResolved, requestKey }) {
      const [step, setStep] = useState(0);
      const [singleValue, setSingleValue] = useState("");
      const [otherText, setOtherText] = useState("");
      const [multiValues, setMultiValues] = useState([]);
      const [hoveredOption, setHoveredOption] = useState("");
      const [focusedOption, setFocusedOption] = useState("");
      const [hoveredButton, setHoveredButton] = useState("");
      const [otherFocused, setOtherFocused] = useState(false);
      const [contentVisible, setContentVisible] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const otherInputRef = useRef(null);
      const transitionTimerRef = useRef(null);
      const submitTimerRef = useRef(null);
      const ease = "cubic-bezier(.4,0,.2,1)";

      useEffect(() => {
        window.clearTimeout(transitionTimerRef.current);
        window.clearTimeout(submitTimerRef.current);
        setStep(0); setSingleValue(""); setOtherText(""); setMultiValues([]); setSubmitting(false); setContentVisible(true);
        return () => { window.clearTimeout(transitionTimerRef.current); window.clearTimeout(submitTimerRef.current); };
      }, [requestKey]);

      useEffect(() => {
        if (singleValue !== "other") return;
        const timer = window.setTimeout(() => otherInputRef.current?.focus(), 40);
        return () => window.clearTimeout(timer);
      }, [singleValue]);

      const moveToStep = (nextStep) => {
        if (submitting || nextStep === step) return;
        window.clearTimeout(transitionTimerRef.current);
        setContentVisible(false);
        transitionTimerRef.current = window.setTimeout(() => {
          setStep(nextStep); setHoveredOption(""); setFocusedOption("");
          window.requestAnimationFrame(() => setContentVisible(true));
        }, 125);
      };

      const toggleMultiValue = (value) => {
        if (submitting) return;
        setMultiValues(current => {
          if (value === "none") return current.includes("none") ? [] : ["none"];
          const withoutNone = current.filter(item => item !== "none");
          return withoutNone.includes(value) ? withoutNone.filter(item => item !== value) : [...withoutNone, value];
        });
      };

      const singleComplete = singleValue === "trash" || singleValue === "permanent" || (singleValue === "other" && otherText.trim().length > 0);
      const multiComplete = multiValues.length > 0;
      const currentComplete = step === 0 ? singleComplete : multiComplete;

      const submit = () => {
        if (!singleComplete || !multiComplete || submitting) return;
        setSubmitting(true);
        const deletionSummary = singleValue === "trash" ? "移到废纸篓（推荐，可在 30 天内恢复）" : singleValue === "permanent" ? "永久删除（立即清除且无法恢复）" : `其他：${otherText.trim()}`;
        const labels = { admins: "项目管理员", all: "所有项目成员", none: "不发送通知" };
        const summary = `删除方式：${deletionSummary}；通知范围：${multiValues.map(value => labels[value]).join("、")}`;
        submitTimerRef.current = window.setTimeout(() => { setSubmitting(false); onResolved?.(summary); }, 650);
      };

      const renderChoice = ({ id, title, description, selected, multi = false, recommended = false, onSelect, children }) => {
        const hovered = hoveredOption === id;
        const focused = focusedOption === id;
        return <div key={id} data-polo-option role={multi ? "checkbox" : "radio"} aria-checked={selected} tabIndex={submitting ? -1 : 0}
          onClick={() => !submitting && onSelect()}
          onKeyDown={event => { if (!submitting && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); onSelect(); } }}
          onMouseEnter={() => !submitting && setHoveredOption(id)} onMouseLeave={() => setHoveredOption("")}
          onFocus={() => setFocusedOption(id)} onBlur={event => { if (!event.currentTarget.contains(event.relatedTarget)) setFocusedOption(""); }}
          style={{ width:"100%", display:"flex", alignItems:"flex-start", gap:12, padding:"14px 16px", background:selected?"var(--fg-5)":hovered?"var(--fg-3)":"transparent", cursor:submitting?"default":"pointer", opacity:submitting?.72:1, outline:"none", boxShadow:focused?"inset 0 0 0 1px var(--fg-30)":"none", transition:`background 150ms ${ease}, box-shadow 150ms ${ease}, opacity 150ms ${ease}`, userSelect:"none" }}>
          <span aria-hidden="true" style={{ width:16, height:16, marginTop:3, flexShrink:0, display:"grid", placeItems:"center", borderRadius:multi?4:9999, border:selected?"2px solid var(--accent)":"1.5px solid var(--fg-30)", background:multi&&selected?"var(--accent)":"transparent", color:"var(--background)" }}>
            {multi && selected ? <Ico.Check size={11}/> : !multi && selected ? <span style={{width:8,height:8,borderRadius:9999,background:"var(--accent)"}}/> : null}
          </span>
          <span style={{ flex:1, minWidth:0 }}>
            <span style={{ display:"flex", alignItems:"center", flexWrap:"wrap", gap:8, minHeight:18 }}>
              <span style={{ fontSize:14, lineHeight:1.25, fontWeight:500 }}>{title}</span>
              {recommended && <span style={{ display:"inline-flex", alignItems:"center", height:18, padding:"0 6px", borderRadius:4, border:"1px solid color-mix(in srgb,var(--accent) 55%,transparent)", color:"var(--accent)", background:"color-mix(in srgb,var(--accent) 6%,var(--background))", fontSize:10, fontWeight:500 }}>推荐</span>}
            </span>
            {description && <span style={{ display:"block", marginTop:2, fontSize:12, lineHeight:1.5, color:"var(--fg-50)" }}>{description}</span>}
            {children}
          </span>
        </div>;
      };

      const renderButton = ({ id, label, primary = false, disabled = false, icon, onClick }) => {
        const hovered = hoveredButton === id;
        const inactive = disabled || submitting;
        return <button type="button" disabled={inactive} onClick={onClick} onMouseEnter={() => !inactive && setHoveredButton(id)} onMouseLeave={() => setHoveredButton("")}
          style={{ height:28, display:"inline-flex", alignItems:"center", justifyContent:"center", gap:6, padding:"0 12px", borderRadius:6, border:primary?"1px solid transparent":"1px solid var(--fg-10)", background:primary?(hovered&&!inactive?"var(--fg-80)":"var(--foreground)"):(hovered&&!inactive?"var(--fg-5)":"transparent"), color:primary?"var(--background)":"var(--foreground)", fontSize:12, fontWeight:500, cursor:inactive?"default":"pointer", opacity:inactive?.5:1, transition:`background 150ms ${ease}, opacity 150ms ${ease}` }}>
          {icon}<span>{label}</span>
        </button>;
      };

      const divider = <div style={{height:1,margin:"0 16px",background:"var(--border)"}}/>;
      return <div data-polo-question style={{ position:"relative", width:"100%", minHeight:342, maxHeight:480, display:"flex", flexDirection:"column", overflow:"hidden", borderRadius:12, background:"var(--background)", boxShadow:"0 0 0 1px var(--border), 0 3px 12px rgba(0,0,0,.06)", transition:`height 250ms ${ease}` }}>
        <div style={{ flex:1, minHeight:0, overflowY:"auto", padding:16 }}>
          <div style={{ opacity:contentVisible?1:0, transform:contentVisible?"translateY(0)":"translateY(6px)", transition:`opacity 125ms ${ease}, transform 125ms ${ease}` }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:16, marginBottom:12 }}>
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:14,fontWeight:600}}>{step===0?"删除方式":"通知范围"}</span>{step===1&&<span style={{fontSize:10,fontWeight:500,color:"var(--fg-50)"}}>可多选</span>}</div>
                <div style={{fontSize:13,lineHeight:"18px",color:"var(--fg-60)"}}>{step===0?"删除项目后，相关数据应该如何处理？":"需要通知哪些相关成员？"}</div>
              </div>
              <span style={{flexShrink:0,display:"inline-flex",alignItems:"center",justifyContent:"center",height:22,minWidth:42,padding:"0 8px",borderRadius:9999,background:"var(--fg-5)",color:"var(--fg-50)",fontSize:11,fontWeight:500}}>{step+1} / 2</span>
            </div>
            <div role={step===0?"radiogroup":"group"} aria-label={step===0?"删除方式":"通知范围"} style={{overflow:"hidden",borderRadius:8,background:"var(--background)",border:"1px solid var(--border)",boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
              {step===0 ? <>
                {renderChoice({id:"trash",title:"移到废纸篓",description:"推荐，可在 30 天内恢复",selected:singleValue==="trash",recommended:true,onSelect:()=>setSingleValue("trash")})}{divider}
                {renderChoice({id:"permanent",title:"永久删除",description:"立即清除且无法恢复",selected:singleValue==="permanent",onSelect:()=>setSingleValue("permanent")})}{divider}
                {renderChoice({id:"other",title:"其他",description:"输入不同的处理方式",selected:singleValue==="other",onSelect:()=>setSingleValue("other"),children:singleValue==="other"?<span style={{display:"block",marginTop:10}}><input ref={otherInputRef} value={otherText} onChange={e=>setOtherText(e.target.value)} onClick={e=>e.stopPropagation()} onKeyDown={e=>e.stopPropagation()} onFocus={()=>setOtherFocused(true)} onBlur={()=>setOtherFocused(false)} placeholder="请输入处理方式" aria-label="其他处理方式" style={{width:"100%",height:36,padding:"0 12px",borderRadius:6,border:otherFocused?"1px solid var(--accent)":"1px solid var(--fg-20)",background:"var(--background)",color:"var(--foreground)",outline:"none",boxShadow:otherFocused?"0 0 0 3px var(--fg-5)":"none"}}/></span>:null})}
              </> : <>
                {renderChoice({id:"admins",title:"项目管理员",selected:multiValues.includes("admins"),multi:true,onSelect:()=>toggleMultiValue("admins")})}{divider}
                {renderChoice({id:"all",title:"所有项目成员",selected:multiValues.includes("all"),multi:true,onSelect:()=>toggleMultiValue("all")})}{divider}
                {renderChoice({id:"none",title:"不发送通知",selected:multiValues.includes("none"),multi:true,onSelect:()=>toggleMultiValue("none")})}
              </>}
            </div>
          </div>
        </div>
        <div style={{flexShrink:0,minHeight:45,display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid var(--border)",background:"var(--background)"}}>
          <span aria-live="polite" style={{flex:1,minWidth:0,fontSize:10,lineHeight:1.35,color:currentComplete?"var(--fg-40)":"var(--fg-50)"}}>{submitting?"正在提交回答…":currentComplete?(step===0?"已选择删除方式":"已选择通知范围"):(step===0?"请选择一种处理方式":"请至少选择一个通知范围")}</span>
          {step===1&&renderButton({id:"back",label:"上一步",icon:<Ico.ChevLeft size={13}/>,onClick:()=>moveToStep(0)})}
          {step===0?renderButton({id:"next",label:"下一步",primary:true,disabled:!singleComplete,icon:<Ico.ChevRight size={13}/>,onClick:()=>moveToStep(1)}):renderButton({id:"confirm",label:submitting?"提交中…":"确认",primary:true,disabled:!multiComplete,icon:submitting?<span style={{width:12,height:12,border:"1.5px solid currentColor",borderTopColor:"transparent",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>:<Ico.Check size={13}/>,onClick:submit})}
        </div>
      </div>;
    }

    function FreeformComposer({ onAsk }) {
      const [draft, setDraft] = useState("");
      return <div>
        <div style={{minHeight:33,display:"flex",alignItems:"flex-start",gap:8,marginBottom:8,padding:"1px 1px 2px"}}><button type="button" onClick={onAsk} style={{height:30,padding:"0 8px 0 10px",display:"inline-flex",alignItems:"center",gap:6,border:0,borderRadius:8,background:"color-mix(in srgb,var(--info) 10%,transparent)",color:"var(--info)",boxShadow:"0 1px 2px color-mix(in srgb,var(--info) 18%,transparent)",fontSize:12,fontWeight:500,cursor:"pointer"}}><span style={{width:14,height:14,border:"1.5px solid currentColor",borderRadius:"50%",display:"inline-grid",placeItems:"center",fontSize:9}}>?</span><span>Ask</span><I d={iconPaths.chevDown} size={14}/></button></div>
        <div style={{position:"relative",overflow:"hidden",borderRadius:12,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 3px 8px rgba(0,0,0,.05)"}}>
          <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="What would you like to work on?" style={{display:"block",width:"100%",minHeight:88,maxHeight:300,resize:"none",padding:"16px 16px 12px 20px",border:0,outline:0,color:"var(--foreground)",background:"transparent",lineHeight:1.5}}/>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:8,borderTop:"1px solid var(--border)"}}><button type="button" style={{height:28,padding:"0 8px",border:0,borderRadius:6,background:"transparent",color:"var(--fg-60)"}}>⌕ Attach Files</button><button type="button" style={{height:28,padding:"0 8px",border:0,borderRadius:6,background:"transparent",color:"var(--fg-60)"}}>Choose Sources</button><span style={{flex:1}}/><button type="button" disabled={!draft.trim()} style={{width:28,height:28,border:0,borderRadius:9999,color:"var(--background)",background:draft.trim()?"var(--foreground)":"var(--fg-10)",opacity:draft.trim()?1:.5}}>↑</button></div>
        </div>
      </div>;
    }

    function ChatConversation({ resolved, answerSummary, children, onReset }) {
      const [titleHovered, setTitleHovered] = useState(false);
      const [shareHovered, setShareHovered] = useState(false);
      const bubble = (content, user, key) => <div key={key} style={{paddingTop:user?16:8,paddingBottom:user?8:0,display:"flex",justifyContent:user?"flex-end":"flex-start",animation:"answerIn 220ms ease-out"}}><div style={{maxWidth:user?"80%":"90%",padding:user?"10px 14px":"12px 16px 12px 24px",border:user?"1px solid var(--border)":0,borderRadius:user?10:8,background:user?"var(--user-bubble)":"var(--background)",boxShadow:"0 1px 2px rgba(0,0,0,.05)",fontSize:14,lineHeight:1.6,overflowWrap:"anywhere"}}>{content}</div></div>;
      return <section aria-label="Session" style={{height:"100%",minWidth:0,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--background)"}}>
        <header style={{height:42,minHeight:42,display:"flex",alignItems:"center",gap:6,paddingLeft:16,paddingRight:8}}>
          <div style={{minWidth:0,flex:1}}><button type="button" onMouseEnter={()=>setTitleHovered(true)} onMouseLeave={()=>setTitleHovered(false)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 8px",border:0,borderRadius:6,color:"var(--foreground)",background:titleHovered?"var(--fg-5)":"transparent"}}><h1 style={{margin:0,fontSize:14,fontWeight:600}}>项目删除流程</h1><I d={iconPaths.chevDown} size={14} style={{color:"var(--fg-50)"}}/></button></div>
          {resolved&&<button type="button" onClick={onReset} style={{height:28,padding:"0 10px",border:"1px solid var(--border)",borderRadius:6,background:"transparent",color:"var(--fg-60)",fontSize:11,cursor:"pointer"}}>重新演示</button>}
          <button type="button" aria-label="Share session" onMouseEnter={()=>setShareHovered(true)} onMouseLeave={()=>setShareHovered(false)} style={{width:28,height:28,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:6,border:0,borderRadius:6,color:shareHovered?"var(--foreground)":"var(--fg-70)",background:shareHovered?"var(--fg-5)":"var(--background)",boxShadow:"0 1px 2px rgba(0,0,0,.06)"}}><I d={iconPaths.share} size={16}/></button>
        </header>
        <div style={{minHeight:0,flex:1,display:"flex",flexDirection:"column"}}>
          <main data-polo-chat-scroll style={{minHeight:0,flex:1,overflowY:"auto",maskImage:"linear-gradient(to bottom,transparent 0%,black 32px,black calc(100% - 32px),transparent 100%)"}}><div style={{width:"100%",maxWidth:840,minHeight:"100%",margin:"0 auto",padding:"32px 20px",display:"flex",flexDirection:"column",gap:10}}>
            {bubble("把项目删除流程补完整。",true,"initial-user")}{bubble("删除方式会影响数据能否恢复，我需要先确认一个选择。",false,"initial-assistant")}
            {resolved&&<>{bubble(answerSummary||"已回答",true,"resolved-user")}{bubble("好的，我会按这个选择补完整删除流程，并同步完善确认提示、结果反馈和后续恢复路径。",false,"resolved-assistant")}</>}
          </div></main>
          <div style={{width:"100%",maxWidth:840,margin:"4px auto 0",padding:"1px 16px 16px",flexShrink:0}}>{children}</div>
        </div>
      </section>;
    }

    function PoloShell({ children, theme, onThemeToggle, onReset }) {
      const [sidebarVisible, setSidebarVisible] = useState(true);
      const [hovered, setHovered] = useState("");
      const buttonReset = {padding:0,border:0,fontFamily:"var(--font-sans)",cursor:"pointer"};
      const iconButton = (id, label, glyph, onClick, disabled=false) => <button type="button" aria-label={label} title={label} disabled={disabled} onClick={onClick} onMouseEnter={()=>setHovered(id)} onMouseLeave={()=>setHovered("")} style={{...buttonReset,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,color:id==="polo"?"var(--accent)":"var(--fg-70)",background:hovered===id?"var(--fg-5)":"transparent",opacity:disabled?.3:1}}>{glyph}</button>;
      const navs = [
        ["all","All Sessions","inbox",true,0],["flag","Flagged","flag",false,1],["archive","Archived","archive",false,1],["labels","Labels","tag",false,0],["sources","Sources","database",false,0],["apis","APIs","globe",false,1],["folders","Local Folders","folder",false,1],["skills","Skills","zap",false,0],["auto","Automations","list",false,0],["scheduled","Scheduled","clock",false,1],["event","Event","radio",false,1],["agentic","Agentic","bot",false,1]
      ];
      return <div data-theme={theme} style={{position:"relative",width:"100%",height:"100%",overflow:"hidden",background:"var(--background)",color:"var(--foreground)",colorScheme:theme}}>
        <div data-polo-tabbar style={{position:"fixed",inset:"0 0 auto",zIndex:40,height:36,display:"flex",alignItems:"center",padding:"0 8px 0 86px",borderBottom:"1px solid var(--fg-10)",background:"color-mix(in srgb,var(--background) 95%,transparent)"}}>
          <button type="button" aria-label="Home" style={{...buttonReset,width:28,height:28,display:"grid",placeItems:"center",borderRadius:6,background:"var(--fg-7)"}}><I d={iconPaths.home} size={16} sw={1.5}/></button>
          <button type="button" style={{...buttonReset,height:32,minWidth:120,maxWidth:220,flex:"0 1 220px",alignSelf:"flex-end",marginLeft:4,marginBottom:-1,padding:"0 8px",display:"flex",alignItems:"center",gap:6,border:"1px solid var(--fg-10)",borderBottomColor:"var(--background)",borderRadius:"6px 6px 0 0",background:"var(--fg-7)",fontSize:12}}><span style={{color:"var(--accent)",display:"inline-flex"}}><PoloSymbol size={14}/></span><span style={{flex:1,textAlign:"left"}}>Polo 助手</span><I d={iconPaths.close} size={14} sw={1.5}/></button>
          <span style={{flex:1}}/><span style={{fontSize:10,color:"var(--fg-40)",paddingRight:8}}>POO-50 · 交互原型</span>
        </div>
        <div style={{position:"fixed",top:36,left:0,right:0,zIndex:30,height:"var(--topbar-h)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
          <div style={{minWidth:0,flex:1,display:"flex",alignItems:"center",gap:2,paddingLeft:12}}>{iconButton("sidebar","Toggle Sidebar",<I d={["M9 4V20","M3.5 11.5v1c0 3.77 0 5.66 1.17 6.83C5.84 20.5 7.73 20.5 11.5 20.5h1c3.77 0 5.66 0 6.83-1.17C20.5 18.16 20.5 16.27 20.5 12.5v-1c0-3.77 0-5.66-1.17-6.83C18.16 3.5 16.27 3.5 12.5 3.5h-1c-3.77 0-5.66 0-6.83 1.17C3.5 5.84 3.5 7.73 3.5 11.5Z"]} size={18} sw={1.5}/>,()=>setSidebarVisible(v=>!v))}{iconButton("polo","Polo AI menu",<PoloSymbol size={16}/>)}
            <div data-polo-workspace style={{width:"clamp(220px,42vw,640px)",minWidth:0,marginLeft:4,display:"flex",alignItems:"center",gap:4}}>{iconButton("back","Back",<I d={iconPaths.chevLeft} size={18}/>,null,true)}{iconButton("forward","Forward",<I d={iconPaths.chevRight} size={18}/>,null,true)}<button type="button" style={{...buttonReset,height:30,minWidth:0,flex:1,marginLeft:4,padding:"0 12px",display:"flex",alignItems:"center",gap:8,border:"1px solid var(--fg-7)",borderRadius:8,background:"transparent",color:"var(--fg-50)",fontSize:13}}><span style={{width:16,height:16,borderRadius:"50%",background:"var(--fg-5)"}}/><span style={{flex:1,textAlign:"left"}}>Workspace</span><I d={iconPaths.chevDown} size={12}/></button></div>
          </div>
          <div style={{paddingRight:12,display:"flex",alignItems:"center",gap:2}}>{iconButton("reset","Reset prototype",<I d={iconPaths.plus} size={16}/>,onReset)}{iconButton("theme",theme==="dark"?"切换浅色":"切换深色",theme==="dark"?<span style={{fontSize:14}}>☀</span>:<span style={{fontSize:14}}>☾</span>,onThemeToggle)}{iconButton("help","Help & Documentation",<I d={iconPaths.help} size={16}/>)}</div>
        </div>
        <main data-polo-panels style={{position:"absolute",inset:"84px 0 0",display:"flex",gap:6,minHeight:0,padding:sidebarVisible?"0 6px 6px 0":"0 6px 6px 6px"}}>
          {sidebarVisible&&<aside data-polo-sidebar style={{width:220,flex:"0 0 220px",minHeight:0,display:"flex",flexDirection:"column"}}><button type="button" style={{...buttonReset,width:"calc(100% - 16px)",margin:"0 8px 8px",padding:"7px 8px",display:"flex",alignItems:"center",gap:8,borderRadius:6,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.06)",fontSize:13,textAlign:"left"}}>✎ New Session</button><nav style={{minHeight:0,padding:"4px 8px 16px",display:"grid",alignContent:"start",gap:2,overflow:"auto"}}>{navs.map(([id,label,glyph,active,nested])=><button key={id} type="button" onMouseEnter={()=>setHovered(id)} onMouseLeave={()=>setHovered("")} style={{...buttonReset,width:"100%",display:"flex",alignItems:"center",gap:8,padding:"5px 8px",paddingLeft:nested?28:8,borderRadius:6,background:active?"var(--fg-7)":hovered===id?"var(--fg-5)":"transparent",fontSize:13,textAlign:"left"}}><span style={{width:14,height:14,display:"inline-flex",color:"var(--fg-60)"}}><I d={iconPaths[glyph]} size={14} sw={1.5}/></span>{label}</button>)}</nav></aside>}
          <section data-polo-navigator style={{width:300,flex:"0 0 300px",height:"100%",overflow:"hidden",borderRadius:10,background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 4px 12px rgba(0,0,0,.08)"}}><div style={{height:"100%",padding:24,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}><span style={{width:40,height:40,marginBottom:12,padding:10,display:"grid",placeItems:"center",borderRadius:10,color:"var(--fg-50)",background:"var(--fg-5)"}}><I d={iconPaths.inbox} size={20} sw={1.5}/></span><strong style={{fontSize:14}}>No sessions yet</strong><p style={{maxWidth:260,margin:"6px 0 14px",color:"var(--fg-50)",fontSize:13,lineHeight:1.45}}>Sessions with your agent appear here. Start one to get going.</p><button type="button" style={{height:28,padding:"0 12px",border:"1px solid var(--border)",borderRadius:8,background:"var(--background)",fontSize:12}}>New Session</button></div></section>
          <section data-polo-content style={{height:"100%",minWidth:440,flex:"1 1 0",overflow:"hidden",borderRadius:"10px 14px 14px 10px",background:"var(--background)",boxShadow:"0 0 0 1px var(--border),0 4px 12px rgba(0,0,0,.08)"}}>{children}</section>
        </main>
      </div>;
    }

    function App() {
      const query = new URLSearchParams(window.location.search);
      const initialTheme = query.get("theme") === "dark" ? "dark" : "light";
      const scene = query.get("scene") || "question";
      const initialState = scene === "resolved" ? "freeform" : "question";
      const [theme, setTheme] = useState(initialTheme);
      const [mode, setMode] = useState(initialState);
      const [resolved, setResolved] = useState(scene === "resolved");
      const [answerSummary, setAnswerSummary] = useState(scene === "resolved" ? "删除方式：移到废纸篓；通知范围：项目管理员" : "");
      const [requestKey, setRequestKey] = useState(1);
      useEffect(() => { document.documentElement.dataset.theme = theme; document.documentElement.lang = query.get("lang") === "en" ? "en" : "zh-Hans"; }, [theme]);
      const reset = () => { setResolved(false); setAnswerSummary(""); setMode("question"); setRequestKey(key => key + 1); };
      const resolve = summary => { setAnswerSummary(summary); setResolved(true); setMode("freeform"); };
      return <PoloShell theme={theme} onThemeToggle={()=>setTheme(value=>value==="dark"?"light":"dark")} onReset={reset}>
        <ChatConversation resolved={resolved} answerSummary={answerSummary} onReset={reset}>
          {mode === "question" && !resolved ? <QuestionRequest requestKey={requestKey} onResolved={resolve}/> : <FreeformComposer onAsk={reset}/>} 
        </ChatConversation>
      </PoloShell>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
