    function openOp(op){if(op==='safe-switch'){state.lastFocus=document.activeElement;state.switchOpen=true;state.runPhase='idle';renderModal();return}if(op==='state-recovery'){state.mode='loading';render();setTimeout(()=>{state.mode='normal';render()},700);return}const def=opDefs[op];if(!def)return;state.lastFocus=document.activeElement;state.actionModal={op,def};renderModal()}
    function closeOp(){const restore=state.lastFocus;state.actionModal=null;renderModal();setTimeout(()=>restore?.focus?.(),0)}
    function confirmOp(){const {op,def}=state.actionModal||{};if(!op)return;if(op==='upload')state.taskStep=2;if(op==='run-app')state.taskStep=3;if(op==='approve-export')state.taskStep=4;if(op==='restart-run')state.taskStep=1;if(op==='accept-invite')state.inviteStep=2;if(op==='reconnect')state.network='online';if(op==='download-update')state.download=100;if(op==='leave-enterprise')state.space='personal';state.outcome={flow:state.flow,title:def[3],text:def[4]};closeOp();render()}
    function render(){updateChrome();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',(state.flow==='PC-F04'&&b.dataset.page==='assistant')||(state.flow==='PC-F03'&&b.dataset.page==='circles')||(!['PC-F03','PC-F04'].includes(state.flow)&&b.dataset.page==='catalog')));root.innerHTML='<div class="page"><div class="content">'+(state.mode==='normal'?normalScreen():stateView())+'</div></div>';bindPage();renderModal()}
    function bindPage(){root.querySelectorAll('[data-op]').forEach(button=>button.addEventListener('click',()=>openOp(button.dataset.op)));root.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.page)))}
    function renderModal(){if(state.switchOpen){const phase=state.runPhase;const runs=phase==='failed'?[['项目交付看板','未能终止','failed'],['Polo 助手：8 月项目复盘','已终止','stopped']]:phase==='stopping'?[['项目交付看板','正在终止…','stopping'],['Polo 助手：8 月项目复盘','正在终止…','stopping']]:[['项目交付看板','正在运行','running'],['Polo 助手：8 月项目复盘','正在生成回复','running']];modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="switch-title" tabindex="-1"><div class="modal-head flex"><div><h2 id="switch-title">终止全部并切换</h2><p>切换到 <b>知远智能</b> 前，必须先终止“我的空间”中的全部运行项。</p></div><button class="modal-close" id="cancel-switch" aria-label="关闭">×</button></div><div class="run-list">${runs.map((r,i)=>`<div class="run"><span>${i===0?icon.grid:icon.spark}</span><span class="run-copy"><b>${r[0]}</b><small>我的空间 · ${i===0?'个人任务':'个人助手会话'}</small></span><span class="run-status ${r[2]}">${r[1]}</span></div>`).join('')}</div>${phase==='failed'?'<p class="modal-error"><b>有运行项未能终止。</b> 目标空间尚未加载。请只重试失败项，或取消切换。</p>':''}<footer class="modal-foot"><button class="cancel" data-cancel-switch>取消切换</button>${phase==='failed'?'<button class="retry" id="retry-runs">重试失败项</button>':phase==='stopping'?'<button class="primary" disabled>正在终止…</button>':'<button class="primary" id="stop-switch">终止全部并切换</button>'}</footer></section></div>`;modalRoot.querySelectorAll('#cancel-switch,[data-cancel-switch]').forEach(x=>x.onclick=()=>{state.switchOpen=false;state.runPhase='idle';renderModal();toast('已取消切换，仍留在“我的空间”。','warn')});const stop=byId('stop-switch');if(stop)stop.onclick=()=>{state.runPhase='stopping';renderModal();setTimeout(()=>{state.runPhase='failed';renderModal()},650)};const retry=byId('retry-runs');if(retry)retry.onclick=()=>{state.runPhase='stopping';renderModal();setTimeout(()=>{state.switchOpen=false;state.runPhase='idle';state.space='enterprise';state.outcome={flow:'PC-F06',title:'已切换到知远智能',text:'旧空间运行项全部终止，企业目录、会话、文件与付款方已整体加载。'};render()},650)};setTimeout(()=>modalRoot.querySelector('.modal')?.focus(),0);return}if(!state.actionModal){modalRoot.innerHTML='';return}const {op,def}=state.actionModal;modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="op-title" tabindex="-1"><div class="modal-head flex"><div><h2 id="op-title">${def[0]}</h2><p>${def[1]}</p></div><button class="modal-close" id="close-op" aria-label="关闭">×</button></div><div class="dialog-form">${op==='join-paid'?'<div class="field"><label>付款方式</label><select><option>微信支付 · 尾号 4821</option></select></div><label class="check-row"><input type="checkbox" checked>我确认 ¥39/月自动续费，AI 算力另计</label>':op==='approve-export'?'<label class="check-row"><input type="checkbox" checked>我已核对客户名称、金额与专业结论</label>':op==='delete-account'?'<div class="dialog-callout">阻断项：退款 RF-20260810-018 正在处理。账号、个人空间和关系均不会被删除。</div>':op==='download-update'?'<div class="dialog-callout">正式更新通道 · macOS Apple Silicon · 128 MB<br>签名：Polo Technologies Limited</div>':'<div class="dialog-callout">操作范围：'+current().name+'。该操作不会改变其他 ProductSpace 的数据、权限或付款方。</div>'}</div><footer class="modal-foot"><button class="cancel" id="cancel-op">取消</button><button class="primary ${def[5]==='danger'?'danger':''}" id="confirm-op">${def[2]}</button></footer></section></div>`;byId('close-op').onclick=closeOp;byId('cancel-op').onclick=closeOp;byId('confirm-op').onclick=confirmOp;setTimeout(()=>modalRoot.querySelector('.modal')?.focus(),0)}
    byId('flow-select').innerHTML=clientFlows.map(flow=>`<option value="${flow.id}">${flow.id} · ${flow.name}</option>`).join('');byId('flow-select').value=state.flow;byId('flow-select').addEventListener('change',event=>{state.flow=event.target.value;state.mode='normal';state.outcome=null;document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('selected',button.dataset.mode==='normal'));render()});document.querySelectorAll('.nav [data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));byId('space-trigger').addEventListener('click',()=>{state.menu=!state.menu;byId('space-menu').hidden=!state.menu});document.querySelectorAll('[data-space]').forEach(b=>b.addEventListener('click',()=>chooseSpace(b.dataset.space)));byId('theme-toggle').addEventListener('click',()=>{document.documentElement.classList.toggle('dark');toast(document.documentElement.classList.contains('dark')?'已切换深色外观。':'已切换浅色外观。')});byId('refresh').addEventListener('click',()=>{toast('正在重新确认 '+current().name+' 的目录与授权。');setTimeout(()=>toast('目录已刷新。'),700)});byId('account-btn').addEventListener('click',()=>{state.flow='PC-F09';state.mode='normal';state.outcome=null;byId('flow-select').value=state.flow;render()});
    document.addEventListener('click',e=>{if(!e.target.closest('.space-wrap')&&state.menu){state.menu=false;byId('space-menu').hidden=true}if(e.target.classList.contains('modal-backdrop')&&state.actionModal)closeOp()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.actionModal)closeOp();else if(state.switchOpen){state.switchOpen=false;state.runPhase='idle';renderModal()}else if(state.menu){state.menu=false;byId('space-menu').hidden=true}}});render();
  </script>
