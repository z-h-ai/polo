<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Polo 工作台</title>
  <link rel="stylesheet" href="assets/product.css">
</head>
<body>
  <div class="window-guard" id="window-guard" hidden>
    <div class="guard-card" role="status">
      <div class="guard-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.5 2.6 17a2 2 0 0 0 1.8 3h15.2a2 2 0 0 0 1.8-3L13.7 3.5a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
      <p class="eyebrow">窗口保护</p>
      <h1>窗口过窄</h1>
      <p>请放大 Polo 窗口后继续使用工作台。Polo 客户端面向桌面窗口，不提供移动端工作台布局。</p>
    </div>
  </div>

  <div class="app-shell" id="app-shell">
    <header class="workbench-bar">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">P</span><span>Polo</span></div>
      <div class="space-control">
        <button class="space-trigger" id="space-trigger" aria-expanded="false" aria-haspopup="menu">
          <span class="space-avatar" id="space-avatar">我</span>
          <span class="space-copy"><strong id="space-name">我的空间</strong><small id="space-type">个人工作上下文</small></span>
          <svg class="icon icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div class="popover space-menu" id="space-menu" role="menu" hidden></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="应用标签"></nav>
      <div class="bar-actions">
        <button class="bar-button" id="runtime-button" aria-haspopup="dialog" aria-expanded="false"><span class="status-dot running"></span><span>运行中</span></button>
        <button class="icon-button" id="notification-button" aria-label="通知" aria-haspopup="dialog" aria-expanded="false"><span class="icon icon-bell"></span><span class="notification-dot" aria-hidden="true"></span></button>
        <button class="avatar-button" id="account-button" aria-label="打开账号菜单" aria-haspopup="menu" aria-expanded="false">林</button>
      </div>
      <div class="popover account-menu" id="account-menu" role="menu" hidden></div>
    </header>

    <main class="workspace-main" id="workspace-main"></main>
  </div>

  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/app.js"></script>
</body>
</html>
