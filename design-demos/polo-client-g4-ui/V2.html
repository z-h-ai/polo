    .state-layer{position:absolute;z-index:25;inset:0;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-inner);background:color-mix(in srgb,var(--background) 96%,transparent)}.state-layer[hidden]{display:none}.state-card{max-width:410px;padding:26px;text-align:center}.state-icon{width:52px;height:52px;display:grid;place-items:center;margin:0 auto;border-radius:14px;background:var(--fg-5);color:var(--accent)}.state-icon svg{width:25px}.state-card h2{margin:14px 0 6px;font-size:20px;line-height:1.25}.state-card p{margin:0;color:var(--fg-60);font-size:13px;line-height:1.55}.state-card .btn{margin-top:16px}.state-card.bad .state-icon{background:color-mix(in srgb,var(--destructive) 8%,transparent);color:var(--destructive)}.state-card.warn .state-icon{background:color-mix(in srgb,var(--info) 8%,transparent);color:var(--info)}
    .modal-backdrop{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,13,25,.45);animation:fade .15s}.modal{width:min(560px,calc(100vw - 40px));overflow:hidden;border-radius:14px;background:var(--background);box-shadow:0 24px 80px rgba(0,0,0,.28)}.modal-head{padding:20px 20px 14px}.modal-head h2{margin:0;font-size:16px}.modal-head p{margin:6px 0 0;color:var(--fg-60);font-size:12px;line-height:1.5}.run-list{margin:0 20px 14px;overflow:hidden;border-radius:8px;box-shadow:var(--shadow-minimal)}.run-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--border)}.run-row:last-child{border-bottom:0}.run-row .app-art{width:28px;height:28px;border-radius:7px}.run-row b{display:block;font-size:12px;font-weight:500}.run-row small{display:block;margin-top:2px;color:var(--fg-50);font-size:10px}.run-state{font-size:11px;color:var(--fg-50)}.run-state.warn{color:var(--info)}.run-state.bad{color:var(--destructive)}.modal-error{margin:0 20px 14px;padding:9px 10px;border-radius:8px;background:color-mix(in srgb,var(--destructive) 8%,transparent);color:var(--destructive);font-size:11px}.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:13px 20px;border-top:1px solid var(--border)}
    .toast{position:fixed;z-index:120;right:18px;bottom:18px;max-width:360px;padding:10px 12px;border-radius:8px;background:var(--foreground);color:var(--background);box-shadow:var(--shadow-middle);font-size:12px;animation:toast .18s}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drawer{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:1080px){.assistant-shell{grid-template-columns:200px 260px minmax(0,1fr)}.catalog-scroll{padding:28px 26px}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.featured,.skills-circles{grid-template-columns:1fr}}

</head>
<body>
  <div id="app"></div>
  <script>
    const Ico={home:'M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z',grid:['M4 4h6v6H4z','M14 4h6v6h-6z','M4 14h6v6H4z','M14 14h6v6h-6z'],spark:['m12 3-1.6 5.4L5 10l5.4 1.6L12 17l1.6-5.4L19 10l-5.4-1.6L12 3Z','m19 16-.7 2.3L16 19l2.3.7L19 22l.7-2.3L22 19l-2.3-.7L19 16Z'],down:'m6 9 6 6 6-6',plus:'M12 5v14M5 12h14',close:'M18 6 6 18M6 6l12 12',back:'m15 18-6-6 6-6',forward:'m9 18 6-6-6-6',flask:['M9 3h6','M10 3v5l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 17l-5-9V3','M8 15h8'],moon:'M21 12.7A9 9 0 1 1 11.3 3 7 7 0 0 0 21 12.7Z',refresh:['M20 11a8 8 0 1 0 2 5.5','M20 4v7h-7'],shield:['M12 3 5 6v5c0 4.8 2.9 8.3 7 10 4.1-1.7 7-5.2 7-10V6l-7-3Z','m9 12 2 2 4-5'],pen:['M12 20h9','M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z'],chat:['M21 15a4 4 0 0 1-4 4H8l-5 3 1.7-5A8 8 0 1 1 21 15Z'],source:['M4 5h16v14H4z','M8 9h8M8 13h5'],bolt:'m13 2-9 12h7l-1 8 9-12h-7l1-8Z',clock:['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z','M12 7v5l3 2'],search:['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z','m20 20-4-4'],more:'M5 12h.01M12 12h.01M19 12h.01',folder:['M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z'],paperclip:'M21.4 11.1 12.2 20.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5',send:['m22 2-7 20-4-9-9-4 20-7Z','M22 2 11 13'],check:'m5 12 4 4L19 6',warning:['M10.3 3.5 2.6 17a2 2 0 0 0 1.8 3h15.2a2 2 0 0 0 1.8-3L13.7 3.5a2 2 0 0 0-3.4 0Z','M12 9v4M12 17h.01'],stop:'M7 7h10v10H7z',user:['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z','M4 21a8 8 0 0 1 16 0']};
    const svg=(d,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${(Array.isArray(d)?d:[d]).map(x=>`<path d="${x}"/>`).join('')}</svg>`;
    const polo=()=>`<svg viewBox="0 0 100 100" fill="none"><path d="M22 85V10h22a19 19 0 0 1 0 38H34" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="42" cy="76" r="9" fill="currentColor"/><path d="M60 65v20h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="84" cy="76" r="9" fill="currentColor"/></svg>`;
    const flows=[
      ['PC-F01','首次进入 Polo','登录后自动进入“我的空间”',['恢复账号会话','准备唯一的个人空间','安全加载 Catalog']],
      ['PC-F02','在我的空间使用 App','个人数据与个人付款',['选择授权 App','准备并固定版本','运行、审核与保存结果']],
      ['PC-F03','加入和管理我的圈子','圈子只作为个人分发关系',['查看加入条件','确认免费或付费加入','管理续费与退出']],
      ['PC-F04','启用 Skill 与使用助手','启用归 Catalog，使用归会话',['在 Catalog 启用 Skill','打开独立助手会话','按任务选择已启用 Skill']],
      ['PC-F05','接受企业邀请','浏览器完成加入，客户端承接',['打开企业邀请','验证账号并加入','客户端刷新企业空间']],
      ['PC-F06','安全切换空间','全部终止后原子切换',['预检目标权限','终止旧空间运行项','清空旧上下文并加载目标']],
      ['PC-F07','使用企业能力','企业授权、企业数据、企业付款',['进入企业 Catalog','使用企业 Apps 和 Skills','进入企业独立助手']],
      ['PC-F08','权限或作品失效','立即停止新执行并解释原因',['识别失效对象','终止相关运行项','保留归属方历史并提供恢复']],
      ['PC-F09','账号与管理入口','按真实身份显示条件式入口',['查看账号安全与个人费用','跳转有权访问的管理端','处理注销阻塞项']],
      ['PC-F10','离线与断网恢复','缓存不作为新授权',['只读查看本机历史','暂停新的网络调用','联网后重新校验再继续']],
      ['PC-F11','契约不一致','阻止进入业务界面',['识别不兼容版本','展示升级与帮助','更新重启后重新校验']]
    ];
    const reviewStates=['正常','空','加载','失败','离线','无权限','资格失效','企业受限','治理阻断','运行中','终止中','终止失败','成功'];
    const state={view:'catalog',tabs:['assistant'],activeTab:'home',space:'personal',spaceMenu:false,review:false,flow:3,reviewState:'正常',skills:{research:true,writing:false,meeting:true},workspace:'客户项目',skillPick:true,switchModal:false,stopPhase:'idle',toast:null};
    const spaces={personal:{name:'我的空间',short:'我',payer:'个人承担 AI 算力',kind:'个人空间'},enterprise:{name:'知远智能',short:'企',payer:'知远智能承担 AI 算力',kind:'企业空间'},readonly:{name:'星云制造',short:'企',payer:'企业空间 · 仅可查看历史',kind:'企业只读'}};
    const app=document.getElementById('app');let toastTimer;
    function notify(text){state.toast=text;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;render()},2200)}
    function current(){return spaces[state.space]}
    function tabbar(){return `<div class="tabbar"><span class="traffic"><i></i><i></i><i></i></span><button class="home-tab ${state.activeTab==='home'?'active':''}" data-tab="home" aria-label="Catalog">${svg(Ico.home)}</button>${state.tabs.map(id=>`<button class="tab ${state.activeTab===id?'active':''}" data-tab="${id}">${id==='assistant'?svg(Ico.spark):svg(Ico.grid)}<span>${id==='assistant'?'Polo 助手':'项目交付看板'}</span><span class="tab-close" data-close-tab="${id}">×</span></button>`).join('')}</div>`}
    function topbar(){const s=current();return `<div class="topbar"><div class="top-left"><span class="brand">${polo()} Polo</span><button class="ghost" title="后退">${svg(Ico.back)}</button><button class="ghost" title="前进">${svg(Ico.forward)}</button></div><div class="space-wrap"><button class="space-trigger ${state.spaceMenu?'open':''}" id="space-trigger"><span class="space-avatar">${s.short}</span><span class="space-label">${s.name}</span><small>${s.kind}</small>${svg(Ico.down)}</button><div class="space-menu" ${state.spaceMenu?'':'hidden'}><div class="menu-label">ProductSpace</div>${Object.entries(spaces).map(([id,x])=>`<button class="space-row ${state.space===id?'active':''}" data-space="${id}"><span class="space-avatar">${x.short}</span><span><b>${x.name}</b><small>${x.payer}</small></span>${state.space===id?svg(Ico.check,'check'):''}</button>`).join('')}<div class="menu-label">圈子不会出现在此列表</div></div></div><div class="top-right"><button class="ghost" id="refresh" title="刷新当前空间">${svg(Ico.refresh)}</button><button class="ghost ${state.review?'active':''}" id="review-button" title="评审控制台">${svg(Ico.flask)}</button><button class="ghost" id="theme-button" title="切换外观">${svg(Ico.moon)}</button><button class="ghost" title="账号">${svg(Ico.user)}</button></div></div>`}
    function payer(){const s=current();return `<div class="payer-card">${svg(Ico.shield)}<span>付款方：<b>${s.payer}</b></span></div>`}
    function feature(){return `<div class="featured"><article class="feature-card"><div class="feature-top"><span class="app-art polo">${svg(Ico.spark)}</span><span><h3>Polo 助手</h3><div class="source">Polo · 当前 ${current().name} 的独立内置 App</div></span></div><p>复用现有三面板工作界面；会话、文件、已启用 Skills 和付款方均随 ProductSpace 隔离。</p><div class="feature-actions"><button class="btn" data-open="assistant">${svg(Ico.chat)}打开助手</button><button class="btn secondary" data-review-flow="3">查看隔离说明</button></div></article><article class="feature-card"><div class="feature-top"><span class="app-art">${svg(Ico.grid)}</span><span><h3>项目交付看板</h3><div class="source">${state.space==='personal'?'北极星工作室':'企业导入'} · v2.4.0</div></span></div><p>将目标、风险和里程碑整理为当前空间可执行的项目视图。</p><div class="feature-actions"><button class="btn secondary">查看详情</button><button class="btn" data-open="app">打开 App</button></div></article></div>`}
    const appCards=[
      ['客户访谈整理','桥见圈子','把录音与笔记整理为可审核洞察。','可用','good','打开'],
      ['素材清洗器','北极星工作室','检查格式与字段，准备本次执行。','准备中 · 68%','info','取消'],
      ['销售周报助手','企业导入','正在知远智能生成本周销售摘要。','运行中','info','查看'],
      ['品牌洞察','北极星工作室','已有稳定版本，新版本下次启动生效。','更新 v1.9.0 可用','info','更新'],
      ['财务摘要','企业导入','本次启动失败，输入和草稿已保留。','启动失败','bad','重试'],
      ['合规审阅','企业导入','该版本因严重风险被平台阻断。','治理阻断','bad','不可用']
    ];
    function apps(){return `<div class="app-grid">${appCards.slice(0,state.space==='personal'?4:6).map((a,i)=>`<article class="app-card"><div class="app-top"><span class="app-art" style="background:${i%2?'color-mix(in srgb,var(--success) 72%,var(--foreground))':'var(--foreground)'}">${svg(i%2?Ico.bolt:Ico.grid)}</span><span><h3>${a[0]}</h3><div class="source">${a[1]} · v${i+1}.2.${i}</div></span></div><div class="app-desc">${a[2]}</div>${i===1?'<div class="progress"><i style="width:68%"></i></div>':''}<div class="card-foot"><span class="status ${a[4]}"><i></i>${a[3]}</span><button class="btn ${a[5]==='不可用'?'secondary':''}" ${a[5]==='不可用'?'disabled':''}>${a[5]}</button></div></article>`).join('')}</div>`}
    function skillList(){const rows=[['research','资料研究','Polo · 当前空间可用'],['writing','商务写作','桥见圈子 · 当前空间可用'],['meeting','会议纪要','${space} · 当前空间可用']];return `<div class="skills-circles"><section class="list-card"><div class="list-title">Skills · 在 Catalog 管理启用状态</div>${rows.map(([id,name,source])=>`<div class="skill-row"><span class="skill-icon">${svg(Ico.spark)}</span><span><b>${name}</b><small>${source.replace('${space}',state.space==='personal'?'Polo':'知远智能')}</small></span><button class="switch ${state.skills[id]?'on':''}" data-skill="${id}" aria-label="切换 ${name}"><i></i></button></div>`).join('')}</section><section class="list-card"><div class="list-title">我的圈子 · 个人分发关系</div>${state.space==='personal'?`<div class="circle-row"><span class="circle-icon">北</span><span><b>北极星工作室</b><small>2 Apps · 1 Skill</small></span><button class="link-btn">查看</button></div><div class="circle-row"><span class="circle-icon">桥</span><span><b>桥见圈子</b><small>1 App · 1 Skill</small></span><button class="link-btn">查看</button></div>`:`<div style="padding:16px;color:var(--fg-50);font-size:11px;line-height:1.55">企业空间不继承个人圈子授权。企业作品由 Owner 或 Manager 在组织管理端导入和分发。</div>`}</section></div>`}
    function catalog(){return `<div class="shell"><main class="panel main-panel catalog-panel" style="position:relative"><div class="catalog-scroll"><div class="catalog-content"><header class="catalog-head"><div><div class="kicker">当前 ProductSpace <span class="chip">${current().kind}</span></div><h1>${current().name}</h1><p>${state.space==='personal'?'使用经过授权的 Apps、Skills 与 Polo 助手；个人文件、会话和费用不会进入企业空间。':'只展示企业已分发给你的能力；企业数据、历史和费用不会进入个人空间。'}</p></div>${payer()}</header><section class="section"><div class="section-head"><div><h2>固定入口</h2><p>Catalog 是客户端首页；Polo 助手作为内置 App 打开现有工作界面。</p></div></div>${feature()}</section><section class="section"><div class="section-head"><div><h2>Apps</h2><p>只显示当前 ProductSpace 授权的作品；技术交付类型对成员隐藏。</p></div><button class="link-btn">查看全部</button></div>${apps()}</section><section class="section"><div class="section-head"><div><h2>Skills 与我的圈子</h2><p>Skill 启用归当前账号与 ProductSpace；助手只选择已经启用的 Skills。</p></div></div>${skillList()}</section></div></div>${stateOverlay()}</main></div>`}
    function appView(){return `<div class="shell"><main class="panel main-panel catalog-panel" style="position:relative"><div class="catalog-scroll"><div class="catalog-content"><header class="catalog-head"><div><div class="kicker">App · ${current().kind}</div><h1>项目交付看板</h1><p>当前运行与产出只属于 ${current().name}，不会读取其他 ProductSpace 的会话、文件或付款配置。</p></div>${payer()}</header><section class="section"><div class="featured"><article class="feature-card"><div class="feature-top"><span class="app-art">${svg(Ico.grid)}</span><span><h3>本次项目视图</h3><div class="source">北极星工作室 · v2.4.0 · 已固定版本</div></span></div><p>将目标、风险和里程碑整理为可评审的交付视图。关闭标签页不会终止后台运行。</p><div class="feature-actions"><button class="btn">${svg(Ico.bolt)}开始整理</button><button class="btn secondary" data-tab="home">返回 Catalog</button></div></article><article class="feature-card"><div class="feature-top"><span class="app-art polo">${svg(Ico.shield)}</span><span><h3>空间与费用边界</h3><div class="source">${current().name} · ${current().payer}</div></span></div><p>输入文件、运行记录和最终结果均保存在当前空间；切换空间前会先处理仍在运行的项目。</p></article></div></section><section class="section"><div class="section-head"><div><h2>最近运行</h2><p>只显示当前 ProductSpace 的历史。</p></div></div><div class="list-card"><div class="skill-row"><span class="skill-icon">${svg(Ico.check)}</span><span><b>8 月项目复盘</b><small>今天 09:42 · 已完成 · 4 个里程碑</small></span><button class="link-btn">打开结果</button></div><div class="skill-row"><span class="skill-icon">${svg(Ico.clock)}</span><span><b>客户交付风险检查</b><small>昨天 17:20 · 已终止 · 草稿已保留</small></span><button class="link-btn">查看</button></div></div></section></div></div>${stateOverlay()}</main></div>`}
    function assistantNav(){return `<aside class="panel assistant-nav"><button class="new-session">${svg(Ico.pen)}新建会话</button><div class="assistant-nav-scroll"><div class="nav-section">会话</div><button class="nav-item active">${svg(Ico.chat)}<span>全部会话</span><small>8</small></button><button class="nav-item">${svg(Ico.clock)}<span>正在进行</span><small>2</small></button><div class="nav-section">上下文</div><button class="nav-item">${svg(Ico.source)}<span>Sources</span><small>5</small></button><button class="nav-item">${svg(Ico.folder)}<span>文件</span></button><div class="nav-section">高级能力</div><button class="nav-item">${svg(Ico.bolt)}<span>Automations</span><small>3</small></button></div><div class="user-card"><span class="user-avatar">林</span><span><b>林然</b><small>${current().name} · 已连接</small></span></div></aside>`}
    function sessions(){return `<aside class="panel session-panel"><div class="panel-header"><h2>${current().name}的会话</h2><button class="ghost">${svg(Ico.more)}</button></div><label class="search">${svg(Ico.search)}<input placeholder="搜索会话"></label><div class="session-list"><div class="group-label">今天</div><button class="session-row active"><b>新建方案的调研框架</b><p>建议按现状、风险、决策与下一步组织评审材料。</p><span class="session-meta"><i></i>刚刚 · 资料研究</span></button><button class="session-row"><b>8 月项目复盘</b><p>已整理里程碑、延期原因和责任人。</p><span class="session-meta">32 分钟前</span></button><button class="session-row"><b>客户访谈要点</b><p>共归纳 7 条关键问题和 3 个待验证假设。</p><span class="session-meta">昨天</span></button><div class="group-label">过去 7 天</div><button class="session-row"><b>销售材料校对</b><p>版本 v3 已完成，等待业务确认。</p><span class="session-meta">星期五</span></button><button class="session-row"><b>产品定位讨论</b><p>市场、用户与差异化假设。</p><span class="session-meta">星期三</span></button></div></aside>`}
    function chat(){const enabled=Object.entries(state.skills).filter(([,v])=>v).map(([k])=>({research:'资料研究',writing:'商务写作',meeting:'会议纪要'}[k]));return `<main class="panel chat-panel" style="position:relative"><header class="chat-head"><button class="chat-title">新建方案的调研框架 ${svg(Ico.down)}</button><span class="chat-actions"><button class="ghost">${svg(Ico.more)}</button></span></header><div class="chat-context"><span class="context-chip">${svg(Ico.shield)}${current().name}</span><span>付款方：${state.space==='personal'?'个人':'知远智能'}</span><span>·</span><span>会话数据不会跨 ProductSpace</span></div><div class="chat-scroll"><div class="messages"><div class="message"><div class="bubble"><div class="activity">已读取本次会话选择的 Skills 与文件上下文</div>你好，我是 Polo 助手。我正在 <b>${current().name}</b> 的独立会话中工作。需要我先整理评审框架，还是直接检查已有材料？<div class="turn-tools">${svg(Ico.check)} 当前会话可用：${enabled.join('、')}</div></div></div><div class="message user"><div class="bubble">帮我为下周的项目评审整理一份调研框架。</div></div><div class="message"><div class="bubble">可以。我建议先确认目标、参与者和已有材料，再按「现状、风险、决策、下一步」组织。<div class="turn-tools">${svg(Ico.spark)} 使用资料研究 · 结果保存在 ${current().name}</div></div></div></div></div><div class="composer-area"><div class="composer"><textarea id="composer" placeholder="在 ${current().name} 中输入消息…"></textarea><div class="composer-tools"><button class="tool-pill">${svg(Ico.paperclip)}文件</button><button class="tool-pill workspace" id="workspace-button">${svg(Ico.folder)}<span>本地 Workspace：${state.workspace}</span>${svg(Ico.down)}</button><button class="tool-pill ${state.skillPick?'active':''}" id="skill-picker">${svg(Ico.spark)}本次会话 · ${enabled.length} Skills</button><button class="tool-pill">Auto · GPT-5</button><button class="send" id="send-button">${svg(Ico.send)}</button></div></div></div>${stateOverlay()}</main>`}
    function assistant(){return `<div class="shell"><div class="assistant-shell">${assistantNav()}${sessions()}${chat()}</div></div>`}
    function stateOverlay(){if(state.reviewState==='正常')return '';const config={空:['当前还没有可显示的内容','不会使用其他空间或过期缓存填充。','spark',''],加载:['正在安全加载当前空间','目录、会话、文件与付款方完成一致切换后才会展示。','refresh',''],失败:['当前内容加载失败','已保留原空间和可恢复状态，请重试。','warning','bad'],离线:['当前处于离线状态','仅可查看本机保存的历史与文件说明，不能启动新的执行。','warning','warn'],无权限:['你没有访问此内容的权限','当前账号或成员角色未获得这项能力。','shield','warn'],资格失效:['资格或订阅已失效','新的启动已停止；已明确保存的结果仍归原数据所有方。','warning','warn'],企业受限:['这个企业空间当前为只读','不能启动 App、Polo 助手或 AI 执行；Owner 可前往管理端处理。','shield','warn'],治理阻断:['该作品版本已被平台阻断','所有空间立即停止新启动，并标记历史结果来源。','warning','bad'],运行中:['当前空间有 2 个运行项','切换 ProductSpace 前必须先终止全部。','clock',''],终止中:['正在逐项终止运行项','全部进入终态前不会加载目标空间。','refresh',''],终止失败:['有运行项未能终止','仍保留在原空间；只能重试失败项或取消切换。','warning','bad'],成功:['操作已完成','当前空间、目录、会话、文件、权限和付款方均已更新。','check','']}[state.reviewState];return `<div class="state-layer"><div class="state-card ${config[3]}"><span class="state-icon ${state.reviewState==='加载'||state.reviewState==='终止中'?'spin':''}">${svg(Ico[config[2]])}</span><h2>${config[0]}</h2><p>${config[1]}</p><button class="btn" data-state-action>${['失败','终止失败'].includes(state.reviewState)?'安全重试':'返回正常状态'}</button></div></div>`}
    function reviewDrawer(){const flow=flows[state.flow];return `<button class="review-toggle" id="review-toggle">${svg(Ico.flask)}评审控制台</button><aside class="review-drawer" ${state.review?'':'hidden'}><header class="review-head"><span><h2>G4-B · UI v2 评审</h2><p>评审工具独立于正式产品导航。</p></span><button class="ghost" id="review-close">${svg(Ico.close)}</button></header><div class="review-body"><label class="review-label">11 组用户流程</label><select class="review-select" id="flow-select">${flows.map((f,i)=>`<option value="${i}" ${i===state.flow?'selected':''}>${f[0]} · ${f[1]}</option>`).join('')}</select><label class="review-label" style="margin-top:14px">关键状态</label><div class="state-grid">${reviewStates.map(x=>`<button class="state-btn ${state.reviewState===x?'active':''}" data-review-state="${x}">${x}</button>`).join('')}</div><section class="review-card"><h3>${flow[0]} · ${flow[1]}</h3><p>${flow[2]}</p><div class="review-path">${flow[3].map((x,i)=>`<div class="review-step"><i>${i+1}</i><span><b>${x}</b><small>${i===flow[3].length-1?'形成可验收结果':'保持空间与权限边界'}</small></span></div>`).join('')}</div><button class="review-action" id="open-flow">打开此流程的核心页面</button></section><section class="review-card"><h3>本版结构冻结</h3><p>Catalog 为首页；助手复用三面板；ProductSpace 在顶部；本地 Workspace 在输入区；Skill 启用归 Catalog；Apps 与助手沿用标签页。</p></section></div></aside>`}
    function modal(){if(!state.switchModal)return '';const phase=state.stopPhase;const failed=phase==='failed',stopping=phase==='stopping';return `<div class="modal-backdrop"><section class="modal"><header class="modal-head"><h2>终止全部并切换</h2><p>切换到 <b>知远智能</b> 前，必须先终止“我的空间”中的运行项；目标空间不会提前加载。</p></header><div class="run-list"><div class="run-row"><span class="app-art">${svg(Ico.grid)}</span><span><b>项目交付看板</b><small>我的空间 · 个人任务</small></span><span class="run-state ${failed?'bad':stopping?'warn':''}">${failed?'未能终止':stopping?'正在终止…':'正在运行'}</span></div><div class="run-row"><span class="app-art polo">${svg(Ico.spark)}</span><span><b>Polo 助手：8 月项目复盘</b><small>我的空间 · 个人助手会话</small></span><span class="run-state ${stopping?'warn':''}">${failed?'已终止':stopping?'正在终止…':'正在生成回复'}</span></div></div>${failed?'<div class="modal-error">有运行项未能终止。仍保留在“我的空间”；请重试失败项或取消切换。</div>':''}<footer class="modal-foot"><button class="btn secondary" id="cancel-switch">取消切换</button>${failed?'<button class="btn danger" id="retry-switch">重试失败项</button>':stopping?'<button class="btn" disabled>正在终止…</button>':'<button class="btn" id="confirm-switch">终止全部并切换</button>'}</footer></section></div>`}
    function activeView(){if(state.activeTab==='assistant')return assistant();if(state.activeTab==='app')return appView();return catalog()}
    function render(){app.innerHTML=`<div class="app">${tabbar()}${topbar()}${activeView()}</div>${reviewDrawer()}${modal()}${state.toast?`<div class="toast">${state.toast}</div>`:''}`;bind()}
    function setTab(id){if(id==='home'){state.activeTab='home';state.view='catalog'}else{if(!state.tabs.includes(id))state.tabs.push(id);state.activeTab=id;state.view=id==='assistant'?'assistant':'app'}render()}
    function resetSpaceContext(id,reviewState='正常'){state.space=id;state.tabs=['assistant'];state.activeTab='home';state.view='catalog';state.reviewState=reviewState}
    function chooseSpace(id){state.spaceMenu=false;if(id===state.space){render();return}if(id==='readonly'){resetSpaceContext('readonly','企业受限');render();return}if(state.space==='personal'&&id==='enterprise'){state.switchModal=true;state.stopPhase='idle';render();return}resetSpaceContext(id);render();notify(`已切换到 ${current().name}`)}
    function openSelectedFlow(){const id=flows[state.flow][0];state.reviewState='正常';if(id==='PC-F04'){setTab('assistant');return}if(id==='PC-F06'){state.switchModal=true;state.stopPhase='idle';render();return}if(id==='PC-F07'){state.space='enterprise';state.activeTab='home'}else state.activeTab='home';render();notify(`已打开 ${id} 核心页面`)}
    function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-close-tab]'))return;setTab(x.dataset.tab)});document.querySelectorAll('[data-close-tab]').forEach(x=>x.onclick=e=>{e.stopPropagation();state.tabs=state.tabs.filter(t=>t!==x.dataset.closeTab);if(state.activeTab===x.dataset.closeTab)state.activeTab='home';render()});document.getElementById('space-trigger').onclick=()=>{state.spaceMenu=!state.spaceMenu;render()};document.querySelectorAll('[data-space]').forEach(x=>x.onclick=()=>chooseSpace(x.dataset.space));document.getElementById('review-button').onclick=()=>{state.review=!state.review;render()};document.getElementById('review-toggle').onclick=()=>{state.review=!state.review;render()};document.getElementById('review-close')?.addEventListener('click',()=>{state.review=false;render()});document.getElementById('theme-button').onclick=()=>{document.documentElement.classList.toggle('dark');render()};document.getElementById('refresh').onclick=()=>notify(`正在重新确认 ${current().name} 的目录与授权`);document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>setTab(x.dataset.open));document.querySelectorAll('[data-skill]').forEach(x=>x.onclick=()=>{state.skills[x.dataset.skill]=!state.skills[x.dataset.skill];render();notify(`已在 ${current().name} ${state.skills[x.dataset.skill]?'启用':'停用'}该 Skill`)});document.getElementById('flow-select')?.addEventListener('change',e=>{state.flow=Number(e.target.value);render()});document.querySelectorAll('[data-review-state]').forEach(x=>x.onclick=()=>{state.reviewState=x.dataset.reviewState;render()});document.getElementById('open-flow')?.addEventListener('click',openSelectedFlow);document.querySelectorAll('[data-state-action]').forEach(x=>x.onclick=()=>{state.reviewState='正常';render();notify('已返回正常状态')});document.getElementById('workspace-button')?.addEventListener('click',()=>{state.workspace=state.workspace==='客户项目'?'产品评审材料':'客户项目';render();notify(`本次会话已切换本地 Workspace：${state.workspace}`)});document.getElementById('skill-picker')?.addEventListener('click',()=>notify('这里只选择本次会话使用的已启用 Skills；启用状态请在 Catalog 管理'));document.getElementById('send-button')?.addEventListener('click',()=>notify(`消息仅保存到 ${current().name} 的独立会话`));document.getElementById('cancel-switch')?.addEventListener('click',()=>{state.switchModal=false;state.stopPhase='idle';render();notify('已取消切换，运行项继续留在“我的空间”')});document.getElementById('confirm-switch')?.addEventListener('click',()=>{state.stopPhase='stopping';render();setTimeout(()=>{state.stopPhase='failed';render()},700)});document.getElementById('retry-switch')?.addEventListener('click',()=>{state.stopPhase='stopping';render();setTimeout(()=>{state.switchModal=false;state.stopPhase='idle';resetSpaceContext('enterprise','成功');render();notify('全部运行项已终止，已安全切换到知远智能')},700)})}
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.switchModal){state.switchModal=false;state.stopPhase='idle'}else if(state.review)state.review=false;else if(state.spaceMenu)state.spaceMenu=false;render()}});render();
  </script>
</body>
</html>
