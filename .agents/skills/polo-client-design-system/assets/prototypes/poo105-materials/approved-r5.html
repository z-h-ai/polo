<script>
'use strict';
const data=JSON.parse(document.querySelector('#playground-data').textContent);
const $=id=>document.getElementById(id), key=`ui-explore:${data.id}:${data.revision}:${data.material_sha256}`;
let draft={schema_version:1,material:{id:data.id,revision:data.revision,sha256:data.material_sha256},shortlist:[],reject_all:false,feedback:{}};
let storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved && saved.material?.sha256===data.material_sha256 && Array.isArray(saved.shortlist) && saved.feedback && typeof saved.feedback==='object' && !Array.isArray(saved.feedback)){draft=saved;draft.shortlist=draft.shortlist.filter(id=>data.candidates.some(c=>c.id===id));if(draft.reject_all)draft.shortlist=[];}}catch(e){storageOK=false;}
function notice(text){$('notice').textContent=text;}
function save(){draft.view=Object.fromEntries(['scene','viewport','left','right','target','mobile'].map(id=>[id,$(id).value]));draft.updated_at=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(draft));storageOK=true;}catch(e){storageOK=false;}notice(storageOK?'草稿已保存在本机':'本地存储不可用，请复制或导出反馈');$('fallback-label').hidden=true;}
function options(id,items,label){for(const item of items){const o=document.createElement('option');o.value=item.id;o.textContent=label(item);$(id).append(o);}}
options('scene',data.scenes,x=>x.label);options('viewport',data.viewports,x=>`${x.label} · ${x.width} × ${x.height}`);
for(const id of ['left','right','target'])options(id,data.candidates,x=>`${x.id} · ${x.name}`);
$('right').value=data.candidates[1].id;
for(const id of ['scene','viewport','left','right','target','mobile']){const value=draft.view?.[id];if([...$(id).options].some(o=>o.value===value))$(id).value=value;}
$('title').textContent=data.title;document.title=data.title+' · 设计探索';
$('version').textContent=`材料 ${data.id} / ${data.revision} · ${data.material_sha256}`;
for(const [title,values] of [['固定项',data.fixed],['开放项',data.open],['来源',data.sources.map(s=>`${s.label} · ${s.version}`)]]){const p=document.createElement('p');p.textContent=title+'：'+values.join('；');$('basis').append(p);}
const candidate=id=>data.candidates.find(c=>c.id===id), viewport=()=>data.viewports.find(v=>v.id===$('viewport').value);
function fit(stage){const canvas=stage.firstElementChild;if(!canvas)return;const v=viewport();const scale=stage.id==='zoom-stage' && $('zoom-scale').value==='1'?1:Math.min(1,stage.clientWidth/v.width,stage.clientHeight/v.height);canvas.style.width=v.width*scale+'px';canvas.style.height=v.height*scale+'px';const frame=canvas.firstElementChild;frame.style.width=v.width+'px';frame.style.height=v.height+'px';frame.style.transform=`scale(${scale})`;}
const observer=new ResizeObserver(items=>items.forEach(x=>fit(x.target)));
function mount(stage,c,thumbnail=false){const token=c.id+':'+$('scene').value;if(stage.dataset.token===token){fit(stage);return;}stage.dataset.token=token;stage.replaceChildren();const canvas=document.createElement('div');canvas.className='canvas';const frame=document.createElement('iframe');frame.title=`${c.id} · ${data.scenes.find(s=>s.id===$('scene').value).label}`;frame.setAttribute('sandbox','allow-scripts allow-forms');frame.srcdoc=c.documents[$('scene').value];if(thumbnail){frame.tabIndex=-1;frame.setAttribute('aria-hidden','true');}canvas.append(frame);stage.append(canvas);observer.observe(stage);fit(stage);}
function shortlists(){document.querySelectorAll('[data-shortlist]').forEach(input=>input.checked=draft.shortlist.includes(input.dataset.shortlist));$('reject').checked=!!draft.reject_all;}
for(const c of data.candidates){const card=document.createElement('article');card.className='card';const heading=document.createElement('h3');heading.textContent=`${c.id} · ${c.name}`;const preview=document.createElement('div');preview.className='thumbnail';preview.id='thumb-'+c.id;const summary=document.createElement('p');summary.textContent=c.summary;const tradeoff=document.createElement('p');tradeoff.className='muted';tradeoff.textContent='代价：'+c.tradeoff;const controls=document.createElement('div');controls.className='toolbar';const label=document.createElement('label');label.className='check';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.dataset.shortlist=c.id;checkbox.onchange=()=>{draft.shortlist=draft.shortlist.filter(id=>id!==c.id);if(checkbox.checked){draft.shortlist.push(c.id);draft.reject_all=false;}shortlists();save();};label.append(checkbox,document.createTextNode('入围'));controls.append(label);for(const [text,fn] of [['放左侧',()=>{$('left').value=c.id;render();save();}],['放右侧',()=>{$('right').value=c.id;render();save();}],['放大',()=>zoom(c.id)]]){const button=document.createElement('button');button.textContent=text;button.onclick=fn;controls.append(button);}card.append(heading,preview,summary,tradeoff,controls);$('overview').append(card);}
function feedbackKey(){return [$('target').value,$('scene').value,$('viewport').value].join('/');}
function readFeedback(){const entry=draft.feedback[feedbackKey()]||{};for(const field of ['like','dislike','combine'])$(field).value=entry[field]||'';$('position').textContent=`场景 ${$('scene').value} · 视口 ${$('viewport').value}`;}
for(const field of ['like','dislike','combine'])$(field).oninput=()=>{const k=feedbackKey();draft.feedback[k]={candidate:$('target').value,scene:$('scene').value,viewport:$('viewport').value,like:$('like').value,dislike:$('dislike').value,combine:$('combine').value};save();};
function render(){for(const c of data.candidates)mount($('thumb-'+c.id),c,true);for(const side of ['left','right']){$(side+'-pane').dataset.mobileHidden=String(side!==$('mobile').value);mount($(side+'-stage'),candidate($(side).value));}readFeedback();}
for(const id of ['scene','viewport','left','right','mobile'])$(id).onchange=()=>{render();save();};
$('target').onchange=()=>{readFeedback();save();};
$('reject').onchange=()=>{draft.reject_all=$('reject').checked;if(draft.reject_all)draft.shortlist=[];shortlists();save();};
function zoom(id){$('zoom-title').textContent=`${id} · ${candidate(id).name} / ${$('scene').value}`;$('zoom-scale').value='fit';$('zoom').showModal();mount($('zoom-stage'),candidate(id));fit($('zoom-stage'));}
document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom($(b.dataset.zoom).value));
addEventListener('message',e=>{if(e.data?.type==='explore-dismiss' && $('zoom').open && e.source===$('zoom-stage').querySelector('iframe')?.contentWindow)$('zoom').close();});
$('zoom').onclose=()=>{$('zoom-stage').replaceChildren();delete $('zoom-stage').dataset.token;};
$('close-zoom').onclick=()=>$('zoom').close();$('zoom-scale').onchange=()=>fit($('zoom-stage'));
function exported(){return JSON.stringify({...draft,sources:data.sources,candidates:data.candidates.map(c=>({id:c.id,name:c.name,page_hashes:c.page_hashes})),scenes:data.scenes,viewports:data.viewports,position:{left:$('left').value,right:$('right').value,scene:$('scene').value,viewport:$('viewport').value}},null,2);}
$('copy').onclick=async()=>{const text=exported();try{await navigator.clipboard.writeText(text);$('fallback-label').hidden=true;notice('完整反馈已复制');}catch(e){$('fallback-label').hidden=false;$('fallback').value=text;$('fallback').focus();$('fallback').select();notice('自动复制不可用，已显示可手动复制的完整反馈');}};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([exported()],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='playground-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('已导出当前版本的完整反馈');};
shortlists();render();if(!storageOK)notice('本地存储不可用，请复制或导出反馈');
</script>
</body>
</html>
