* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
html { font-size: 15px; font-optical-sizing: auto; background: var(--background); }
body {

  font-family: var(--font-sans);

}
button, input, textarea, select { color: inherit; font: inherit; }
button { border: 0; cursor: pointer; }
/* Source buttons use disabled:pointer-events-none disabled:opacity-50. */

/* Source inputs/buttons focus with a 1px foreground/30 ring, not an accent

}

}
.icon { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: 0 0 auto; }
.icon svg { width: 100%; height: 100%; }
.muted { color: var(--fg-50); }

.button { min-height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: transparent; font-size: 12px; }
