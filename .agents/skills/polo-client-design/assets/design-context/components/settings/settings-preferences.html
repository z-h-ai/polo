<title>设置 · 偏好 · Polo 组件画廊</title>
<style>
/* Translated from apps/electron/src/renderer/index.css :root/.dark plus the
   shadow utility classes (index.css ~604-652). Values are the source ones;
   --fg-* aliases kept for the existing prototype stylesheets. */

:root {
  --background: oklch(0.98 0.003 265);
  --foreground: oklch(0.185 0.01 270);
  --foreground-rgb: 38, 36, 42;
  --accent: oklch(0.62 0.13 293);
  --accent-rgb: 104, 78, 133;
  --info: oklch(0.75 0.16 70);
  --info-rgb: 180, 120, 40;
  --success: oklch(0.55 0.17 145);
  --success-rgb: 34, 120, 60;
  --destructive: oklch(0.58 0.24 28);
  --destructive-rgb: 180, 60, 50;
  --background-elevated: color-mix(in srgb, var(--foreground) 1.5%, var(--background));
  --foreground-dimmed: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --user-bubble: oklch(from var(--foreground) l c h / 0.05);
  --border: oklch(from var(--foreground) l c h / 0.05);
  --input: oklch(from var(--foreground) l c h / 0.1);
  --ring: oklch(from var(--foreground) l c h / 0.25);
  --fg-2: color-mix(in srgb, var(--foreground) 2%, var(--background));
  --fg-3: color-mix(in srgb, var(--foreground) 3%, var(--background));
  --fg-5: color-mix(in srgb, var(--foreground) 5%, var(--background));
  --fg-7: color-mix(in srgb, var(--foreground) 7%, var(--background));
  --fg-10: color-mix(in srgb, var(--foreground) 10%, var(--background));
  --fg-20: color-mix(in srgb, var(--foreground) 20%, var(--background));
  --fg-30: color-mix(in srgb, var(--foreground) 30%, var(--background));
  --fg-40: color-mix(in srgb, var(--foreground) 40%, var(--background));
  --fg-50: color-mix(in srgb, var(--foreground) 50%, var(--background));
  --fg-60: color-mix(in srgb, var(--foreground) 60%, var(--background));
  --fg-70: color-mix(in srgb, var(--foreground) 70%, var(--background));
  --fg-80: color-mix(in srgb, var(--foreground) 80%, var(--background));
  /* Source-named shadcn compatibility tokens (index.css:164-178). */
  --muted: oklch(from var(--foreground) l c h / 0.05);
  --muted-foreground: var(--fg-50);
  --foreground-2: var(--fg-2);
  --amber-strong: #d97706;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--background));
  --info-soft: color-mix(in srgb, var(--info) 12%, var(--background));
  --success-soft: color-mix(in srgb, var(--success) 12%, var(--background));
  --danger-soft: color-mix(in srgb, var(--destructive) 10%, var(--background));
  --on-accent: #fff;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --panel-gap: 6px;
  --panel-inset: 6px;
  --tabbar-height: 36px;
  --content-top-offset: 84px;
  --radius-xs: 2px;
  --radius-sm: 3.75px;
  --radius-md: 5.625px;
  --radius-lg: 11.25px;
  --radius-edge: 14px;
  --radius-pill: 999px;
  --topbar-height: 48px;
  /* Shadow opacity registry (index.css:113-115) and layered shadows
     (index.css:118-139, 604-652). The 1px ring is always foreground 6%. */
  --shadow-border-opacity: 0.08;
  --shadow-blur-opacity: 0.06;
  --shadow-minimal:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px;
  --shadow-middle:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 6px 6px -3px;
  --shadow-strong:
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(0, 0, 0, 0) 0 0 0 0,
    rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(0, 0, 0, var(--shadow-blur-opacity)) 0 6px 6px -3px,
    rgba(0, 0, 0, calc(var(--shadow-blur-opacity) * 0.67)) 0 12px 12px -6px,
    rgba(0, 0, 0, calc(var(--shadow-blur-opacity) * 0.67)) 0 24px 24px -12px;
  /* Tinted shadow: set --shadow-color to an "r, g, b" triple before use
     (index.css:619-628). */
  --shadow-tinted:
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), calc(var(--shadow-border-opacity) * 1.5)) 0 0 0 1px,
    rgba(var(--shadow-color, 0, 0, 0), var(--shadow-border-opacity)) 0 1px 1px -0.5px,
    rgba(var(--shadow-color, 0, 0, 0), var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
    rgba(var(--shadow-color, 0, 0, 0), calc(var(--shadow-blur-opacity) * 0.67)) 0 6px 6px -3px;
  --shadow-panel: 0 18px 52px rgba(0,0,0,.18);
  --shadow-modal-small:
    rgba(0,0,0,0) 0 0 0 0,
    rgba(0,0,0,0) 0 0 0 0,
    rgba(var(--foreground-rgb), .06) 0 0 0 1px,
    rgba(0,0,0,.04) 0 1px 1px -.5px,
    rgba(0,0,0,.04) 0 3px 3px 0,
    rgba(0,0,0,.02) 0 6px 6px 0,
    rgba(0,0,0,.02) 0 12px 12px 0,
    rgba(0,0,0,.02) 0 24px 24px 0;
}

html[data-theme="dark"] {
  --background: oklch(0.145 0.015 270);
  --foreground: oklch(0.95 0.01 270);
  --foreground-rgb: 237, 236, 240;
  --accent: oklch(0.65 0.22 293);
  --accent-rgb: 130, 75, 185;
  --info: oklch(0.78 0.14 70);
  --info-rgb: 210, 155, 55;
  --success: oklch(0.60 0.17 145);
  --success-rgb: 50, 140, 80;
  --destructive: oklch(0.65 0.22 28);
  --destructive-rgb: 200, 70, 60;
  --background-elevated: color-mix(in srgb, var(--foreground) 2.5%, var(--background));
  --foreground-dimmed: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --border: oklch(from var(--foreground) l c h / 0.09);
  /* Dark mode uses stronger blur opacity; the ring stays foreground 6%
     exactly as in the source (index.css:267-269 and utility classes). */
  --shadow-border-opacity: 0.15;
  --shadow-blur-opacity: 0.12;
  /* Dark tinted shadows are outline-only at uniform lightness 0.425
     (index.css:632-640). */
  --shadow-tinted:
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 0 0 0,
    oklch(from rgb(var(--shadow-color, 0, 0, 0)) 0.425 c h / 0.6) 0 0 0 1px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 1px 1px -0.5px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 3px 3px -1.5px,
    rgba(var(--shadow-color, 0, 0, 0), 0) 0 6px 6px -3px;
  --amber-strong: #fbbf24;
  --shadow-panel: 0 20px 70px rgba(0,0,0,.48);
  --shadow-modal-small:
    rgba(0,0,0,0) 0 0 0 0,
    rgba(0,0,0,0) 0 0 0 0,
    rgba(var(--foreground-rgb), .12) 0 0 0 1px,
    rgba(0,0,0,.08) 0 1px 1px -.5px,
    rgba(0,0,0,.08) 0 3px 3px 0,
    rgba(0,0,0,.04) 0 6px 6px 0,
    rgba(0,0,0,.04) 0 12px 12px 0,
    rgba(0,0,0,.04) 0 24px 24px 0;
}

* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
html { font-size: 15px; font-optical-sizing: auto; background: var(--background); }
body {
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  transition: color .2s ease, background .2s ease;
}
button, input, textarea, select { color: inherit; font: inherit; }
button { border: 0; cursor: pointer; }
/* Source buttons use disabled:pointer-events-none disabled:opacity-50. */
button:disabled { pointer-events: none; opacity: .5; }
/* Source inputs/buttons focus with a 1px foreground/30 ring, not an accent
   outline (input.tsx, button.tsx). */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--foreground) 30%, transparent);
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 6px; }
*:hover::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb:hover { background: var(--fg-20); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
/* SpinKit grid spinner keyframes from packages/ui/src/styles/index.css,
   used by the source Spinner component (LoadingIndicator.tsx). */
@keyframes spinner-grid {
  0%, 70%, 100% { transform: scale3d(0.5, 0.5, 1); }
  35% { transform: scale3d(0, 0, 1); }
}
.icon { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: 0 0 auto; }
.icon svg { width: 100%; height: 100%; }
.muted { color: var(--fg-50); }
.eyebrow { margin: 0 0 7px; color: var(--fg-50); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.button { min-height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: transparent; font-size: 12px; }
.button:hover { background: var(--fg-5); }
.button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.button.danger { border-color: var(--destructive); background: var(--destructive); color: var(--on-accent); }

/* Translated from TopBar.tsx, AppShell.tsx, PanelStackContainer.tsx,
   LeftSidebar.tsx, PanelSlot.tsx and panel-constants.ts. Root font-size is
   15px, so Tailwind rem values are written verbatim (1rem = 15px). */

.source-shell{width:100%;height:100%;min-height:0;overflow:hidden;background:var(--background);color:var(--foreground)}
/* TopBar: fixed under the tab bar, z-panel, h-(--topbar-height), px-3. */
.source-topbar{position:fixed;top:36px;left:0;right:0;z-index:50;height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.source-topbar__left,.source-topbar__right,.source-topbar__workspace{display:flex;min-width:0;align-items:center;gap:2px}
.source-topbar__left{flex:1;padding-left:11.25px}
.source-topbar__right{padding-right:11.25px}
.source-topbar__workspace{width:clamp(220px,42vw,640px);gap:3.75px;margin-left:3.75px}
/* TopBarButton: 28px square rounded-lg icon buttons, foreground/70 icons that
   darken on hover with a foreground/3 wash (TopBar.tsx, HeaderIconButton). */
.source-icon-button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;padding:0;border:0;border-radius:7.5px;background:transparent;color:color-mix(in srgb,var(--foreground) 70%,transparent);transition:background-color 100ms}
.source-icon-button:hover{background:color-mix(in srgb,var(--foreground) 3%,transparent)}
.source-icon-button:disabled{opacity:.3}
.source-icon-button svg{width:18px;height:18px}
/* The Polo AI menu symbol button keeps its accent color at 16px. */
.source-topbar__left>.source-icon-button:nth-child(2) svg{width:15px;height:15px;color:var(--accent)}
/* Right cluster: Plus/Help are 26px rounded-lg buttons with 50% icons; the
   Plus button carries ml-1 (TopBar.tsx:224-247). */
.source-topbar__right .source-icon-button{width:26px;height:26px;border-radius:7.5px;color:color-mix(in srgb,var(--foreground) 50%,transparent)}
.source-topbar__right .source-icon-button:first-child{margin-left:3.75px}
.source-topbar__right .source-icon-button svg{width:16px;height:16px}
/* WorkspaceSwitcher trigger: h-[30px] px-3 rounded-lg border-foreground/6,
   gap-0.5 with an avatar mr-1.5 and a 60% chevron. */
.source-workspace-switcher{height:30px;min-width:0;flex:1;display:flex;align-items:center;gap:2px;margin-left:3.75px;padding:0 11.25px;border:1px solid color-mix(in srgb,var(--foreground) 6%,transparent);border-radius:7.5px;background:transparent;color:color-mix(in srgb,var(--foreground) 50%,transparent);font-size:13px;text-align:left}
.source-workspace-switcher>span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-workspace-switcher__avatar{width:16px;height:16px;flex:none;margin-right:5.625px;border-radius:50%;background:color-mix(in srgb,var(--foreground) 5%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--foreground) 10%,transparent)}
.source-workspace-switcher svg{opacity:.6}
/* Panel stack: top 84px (36px tab bar + 48px top bar), 6px gap and inset
   (panel-constants.ts PANEL_GAP/INSET), sidebar 220px, navigator 300px,
   content min 440px (AppShell.tsx:546-550). */
.source-panel-stack{position:absolute;inset:84px 0 0;display:flex;gap:6px;min-height:0;padding:0 6px 6px 0}
.source-panel-stack--without-sidebar{padding-left:6px}
.source-sidebar{width:220px;flex:0 0 220px;min-height:0;display:flex;flex-direction:column}
.source-new-session{width:calc(100% - 16px);display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:7px 8px;border:0;border-radius:6px;background:var(--background);color:var(--foreground);box-shadow:var(--shadow-minimal);font-size:13px;text-align:left}
.source-new-session svg{width:14px;height:14px}
.source-sidebar__nav{display:grid;align-content:start;gap:2px;min-height:0;overflow:auto;padding:4px 8px 16px}
.source-sidebar__nav hr{width:calc(100% - 16px);height:1px;margin:4px 8px;border:0;background:color-mix(in srgb,var(--foreground) 5%,transparent)}
.source-sidebar__nested{position:relative;display:grid;gap:2px;padding-left:20px}
.source-sidebar__nested:before{content:'';position:absolute;top:4px;bottom:4px;left:13px;width:1px;background:color-mix(in srgb,var(--foreground) 10%,transparent)}
/* Sidebar rows: py-[5px] px-2 rounded-md text-[13px]; hover is sidebar-hover
   = foreground 2% (index.css:421), active foreground 7%. */
.source-nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px;border:0;border-radius:6px;background:transparent;color:var(--foreground);font-size:13px;text-align:left}
.source-nav-item:hover{background:color-mix(in srgb,var(--foreground) 2%,transparent)}
.source-nav-item.is-active{background:color-mix(in srgb,var(--foreground) 7%,transparent)}
.source-nav-item svg{width:14px;height:14px;flex:none;color:color-mix(in oklch,var(--foreground) 60%,transparent)}
/* Sidebar footer user row: border-t + 32px gradient avatar + name + chevron
   (LeftSidebar.tsx:324-392). */
.source-sidebar__footer{display:flex;align-items:center;gap:8px;margin-top:auto;padding:12px 8px;border-top:1px solid color-mix(in srgb,var(--foreground) 5%,transparent)}
.source-sidebar__user{display:flex;min-width:0;flex:1;align-items:center;gap:8px;padding:4px;border:0;border-radius:6px;background:transparent;text-align:left}
.source-sidebar__user:hover{background:color-mix(in srgb,var(--foreground) 2%,transparent)}
.source-sidebar__user-avatar{width:32px;height:32px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 45%,var(--foreground)));color:var(--background);display:grid;place-items:center;font-size:13px;font-weight:600}
.source-sidebar__user-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;color:var(--foreground)}
.source-sidebar__user svg{width:12px;height:12px;flex:none;color:color-mix(in srgb,var(--foreground) 50%,transparent)}
/* PanelHeader above navigator lists: h-[42px] pl-4 pr-2 gap-1.5 with a
   text-sm semibold title (PanelHeader.tsx) and a HeaderIconButton (h-7 w-7
   rounded-[4px], icon h-4 w-4 = 15px). */
.source-navigator__header{display:flex;height:42px;flex-shrink:0;align-items:center;gap:5.625px;padding-left:15px;padding-right:7.5px;border-bottom:1px solid color-mix(in srgb,var(--foreground) 5%,transparent)}
.source-navigator__header-title{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--foreground);font-size:13.125px;font-weight:600;line-height:1.25}
.source-navigator__header-button{display:flex;width:26.25px;height:26.25px;flex:none;align-items:center;justify-content:center;padding:0;border:0;border-radius:4px;background:transparent;color:var(--fg-50)}
.source-navigator__header-button svg{width:15px;height:15px}
.source-navigator__header-button:hover{background:color-mix(in srgb,var(--foreground) 3%,transparent)}
/* Panels: navigator bg-background, content panel bg-foreground-2
   (PanelSlot.tsx:117-122), shadow-middle; radii 10px inner / 14px outer edge
   (RADIUS_INNER/RADIUS_EDGE). */
.source-navigator,.source-content-panel{min-height:0;height:100%;overflow:hidden;box-shadow:var(--shadow-middle)}
.source-navigator{width:300px;flex:0 0 300px;background:var(--background);border-radius:10px;display:flex;flex-direction:column}
.source-content-panel{min-width:440px;flex:1 1 0;background:var(--fg-2);border-radius:10px 14px 14px 10px}
.source-panel-stack--without-sidebar .source-navigator{border-radius:10px 10px 14px 10px}
/* Empty session list: EntityListEmptyScreen — bare 40px Inbox at 50% color,
   14px/500 title, 12px description, p-6 pb-[20%] (empty.tsx). */
.source-navigator__list{flex:1;min-height:0;overflow:auto}
.source-navigator__empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;padding-bottom:20%;text-align:center}
.source-navigator__empty>svg{width:40px;height:40px;margin-bottom:8px;color:var(--fg-50)}
.source-navigator__empty strong{font-size:14px;font-weight:500;letter-spacing:-.025em}
.source-navigator__empty p{max-width:360px;margin:0;color:var(--fg-50);font-size:12px;line-height:1.375}
.source-navigator__empty button{display:inline-flex;height:28px;align-items:center;padding:0 11.25px;border:0;border-radius:8px;background:var(--background);box-shadow:var(--shadow-minimal);color:var(--foreground);font-size:12px;font-weight:500}
.source-navigator__empty button:hover{background:color-mix(in srgb,var(--foreground) 3%,var(--background))}

</style>
<style>
/* Gallery chrome only — not part of the translated component. */
html, body { overflow: auto; height: auto; }
#root { min-height: 100%; }
.gallery-body { position: relative; min-height: 100vh; background: var(--background); }
.gallery-note { position: fixed; left: 12px; bottom: 10px; z-index: 999; padding: 4px 10px; border-radius: 6px; background: color-mix(in srgb, var(--foreground) 4%, var(--background)); box-shadow: var(--shadow-minimal); color: var(--fg-50); font-size: 11px; user-select: none; }
.gallery-dark-toggle { position: fixed; right: 12px; bottom: 10px; z-index: 999; padding: 4px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--foreground) 15%, transparent); background: var(--background); color: var(--foreground); font-size: 11px; box-shadow: var(--shadow-minimal); }
