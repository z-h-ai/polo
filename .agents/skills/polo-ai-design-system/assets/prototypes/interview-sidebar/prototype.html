<!doctype html><html><head><meta charset="utf-8"><title>Adopted native sidebar reference</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe title="Adopted native sidebar reference" id="reference"></iframe><script>const scenes={"sidebar-collapsed": {"desktop-1280x800": "views/sidebar-collapsed-desktop-1280x800.html", "desktop-1440x900": "views/sidebar-collapsed-desktop-1440x900.html"}, "sidebar-expanded": {"desktop-1280x800": "views/sidebar-expanded-desktop-1280x800.html", "desktop-1440x900": "views/sidebar-expanded-desktop-1440x900.html"}},sizes=[{"name": "desktop-1280x800", "width": 1280, "height": 800}, {"name": "desktop-1440x900", "width": 1440, "height": 900}];const selected=new URLSearchParams(location.search).get('scene');const scene=Object.hasOwn(scenes,selected)?selected:Object.keys(scenes)[0];const viewport=[...sizes].sort((a,b)=>Math.abs(a.width-innerWidth)-Math.abs(b.width-innerWidth))[0].name;document.getElementById('reference').src=scenes[scene][viewport];</script></body></html>
