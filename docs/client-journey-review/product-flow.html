<script>/* Navigation/Bezier ideas adapted from user-flow-canvas/assets/flow-canvas-template.html.
 * Independent concept model: no iframe, source reconstruction or legacy protocol changes. */
(() => {
  'use strict';
  const {model, changes, prototype_hrefs} = JSON.parse(document.getElementById('flow-data').textContent);
  const $ = id => document.getElementById(id);
  const nodes = new Map(model.nodes.map(n => [n.id, n]));
  const lanes = new Map(model.lanes.map(l => [l.id, l]));
  const labels = {confirmed:'已确认', suggested:'建议', decision:'待决策'};
  const kindLabels = {success:'成功', failure:'失败', permission:'权限不足', interruption:'中断', recovery:'恢复', next:'下一步'};
  const affected = new Set(changes.affected);
  const changedEdges = new Set([...changes.added, ...changes.modified].filter(c => c.type === 'transitions').map(c => c.id));
  const prototypes = model.prototypes || [];
  let journey, entryIndex = 0, history = [], positions = new Map(), width, height;
  let scale = 1, tx = 0, ty = 0, pan = null;
  const current = () => history[history.length - 1].at;
  const same = (a, b) => a.node === b.node && a.state === b.state;
  const edges = () => model.transitions.filter(e => journey.transitions.includes(e.id));
  function el(tag, text, className) {
    const item = document.createElement(tag);
    if (text !== undefined) item.textContent = text;
    if (className) item.className = className;
    return item;
  }
  function button(text, action, className) {
    const item = el('button', text, className);
    item.type = 'button'; item.addEventListener('click', action); return item;
  }
  function option(select, value, text) {
    const item = el('option', text); item.value = value; select.append(item);
  }
  function svg(tag, attrs) {
    const item = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) item.setAttribute(k, v);
    return item;
  }
  function badge(status) { return el('span', labels[status], `badge ${status}`); }
  function sourceText(refs) {
    return refs.map(r => { const s = model.sources.find(s => s.id === r.source); return `${s.label}@${s.revision} / ${r.section}`; }).join('；');
  }
  function layout() {
    positions = new Map();
    const usedLanes = model.lanes.filter(l => journey.nodes.some(id => nodes.get(id).lane === l.id));
    const counts = new Map();
    for (const id of journey.nodes) {
      const n = nodes.get(id), row = usedLanes.findIndex(l => l.id === n.lane), col = counts.get(n.lane) || 0;
      positions.set(id, {x:170 + col * 340, y:100 + row * 300}); counts.set(n.lane, col + 1);
    }
    width = 220 + Math.max(...counts.values()) * 340;
    height = usedLanes.length * 300 + 50;
    $('nodes').replaceChildren();
    usedLanes.forEach((lane, i) => {
      const item = el('div', `${lane.actor} / ${lane.surface}`, 'lane');
      Object.assign(item.style, {left:'0px', top:`${i * 300 + 12}px`, width:`${width}px`, height:'284px'});
      $('nodes').append(item);
    });
    for (const id of journey.nodes) {
      const n = nodes.get(id), p = positions.get(id);
      const item = button('', () => {
        // Selecting is a preview jump, not a claim that a transition was traversed.
        history.push({at:{node:id, state:n.states[0].id}, edge:null, preview:true});
        refresh(); focusCurrent();
      }, 'node');
      item.dataset.node = id;
      item.setAttribute('aria-label', `${id} ${n.title}`);
      item.style.left = `${p.x}px`; item.style.top = `${p.y}px`;
      item.append(el('small', `${id} · ${n.states.length} 个状态`), el('strong', n.title), badge(n.status));
      if (affected.has(id)) item.append(el('span', '本轮涉及此节点', 'change-tag'));
      $('nodes').append(item);
    }
    Object.assign($('world').style, {width:`${width}px`, height:`${height}px`});
  }
  function drawEdges() {
    const root = $('edges'); root.replaceChildren(); root.setAttribute('width', width); root.setAttribute('height', height);
    const defs = svg('defs', {}), marker = svg('marker', {id:'arrow', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});
    marker.append(svg('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:'context-stroke'})); defs.append(marker); root.append(defs);
    const offsets = new Map();
    edges().forEach(edge => {
      const a = positions.get(edge.from.node), b = positions.get(edge.to.node);
      const ordinal = offsets.get(edge.from.node) || 0; offsets.set(edge.from.node, ordinal + 1);
      let d, lx, ly;
      if (edge.from.node === edge.to.node || (b.y === a.y && b.x < a.x)) {
        const lift = 30 + ordinal * 19;
        d = `M ${a.x+155} ${a.y} C ${a.x+300} ${a.y-lift-80}, ${b.x-60} ${b.y-lift-80}, ${b.x+65} ${b.y}`;
        lx = (a.x+b.x+225)/2; ly = Math.min(a.y,b.y)-lift;
      } else {
        const right = b.x > a.x, x1 = a.x+(right?225:0), x2=b.x+(right?0:225), y1=a.y+60+ordinal*9, y2=b.y+60;
        const bend = right ? Math.max(x1+40,(x1+x2)/2) : Math.min(x1-50-ordinal*24,(x1+x2)/2);
        d = `M ${x1} ${y1} C ${bend} ${y1}, ${bend} ${y2}, ${x2} ${y2}`;
        lx = bend; ly = (y1+y2)/2 - 26 + ordinal * 24;
      }
      const active = history.some(h => h.edge === edge.id);
      const available = same(edge.from, current());
      const path = svg('path', {d, class:`edge ${edge.kind !== 'next' && edge.kind !== 'success' ? 'exception' : ''} ${active ? 'active' : ''} ${changedEdges.has(edge.id) ? 'affected' : ''} ${available ? 'available' : ''}`, 'data-branch':edge.id, 'data-from':edge.from.node, 'data-to':edge.to.node});
      const title = svg('title', {}); title.textContent = `${edge.id}: ${edge.action} / ${edge.condition} → ${edge.to.node}/${edge.to.state}`; path.append(title); root.append(path);
      const label = svg('text', {x:lx, y:ly, 'text-anchor':'middle', class:`edge-label ${available ? 'available' : 'muted'}`});
      // Full action and condition remain available on the branch button and SVG title.
      (available ? [edge.id+' · '+edge.action, edge.condition] : [edge.id]).forEach((line,i) => {
        const t = svg('tspan', {x:lx, dy:i?15:0}); t.textContent = line.length > 23 ? line.slice(0,22)+'…' : line; label.append(t);
      }); root.append(label);
    });
  }
  function refresh() {
    const at = current(), n = nodes.get(at.node), state = n.states.find(s => s.id === at.state), lane = lanes.get(n.lane);
    document.querySelectorAll('.node').forEach(item => {
      item.classList.toggle('selected', item.dataset.node === at.node);
      item.classList.toggle('affected', affected.has(item.dataset.node));
      item.setAttribute('aria-pressed', String(item.dataset.node === at.node));
    });
    drawEdges();
    $('history').replaceChildren();
    history.forEach((h, i) => $('history').append(button(`${h.preview?'预览 ':''}${h.at.node}/${h.at.state}`, () => {history = history.slice(0,i+1); refresh(); focusCurrent();})));
    $('back').disabled = history.length <= 1;
    const detail = $('detail'); detail.replaceChildren(); detail.dataset.node = at.node; detail.dataset.state = at.state;
    detail.append(el('span', '产品构想，非真实实现', 'concept'), el('div', `${journey.id} / ${n.id} · ${lane.actor} / ${lane.surface}`, 'meta'), el('h2', n.title), badge(n.status));
    if (affected.has(n.id)) detail.append(el('p', '本轮涉及此节点：查看下方变化对比。', 'change-tag'));
    const stateLabel = el('label', '状态预览 '), select = el('select'); select.id = 'state'; select.setAttribute('aria-label','页面状态预览');
    n.states.forEach(s => option(select, s.id, s.label)); select.value = state.id;
    select.addEventListener('change', () => {history.push({at:{node:n.id,state:select.value},edge:null,preview:true}); refresh();});
    stateLabel.append(select); detail.append(stateLabel);
    const wire = el('section', undefined, 'wireframe'); wire.append(el('h3', n.title));
    n.content.forEach(text => wire.append(el('div', text, 'wire-block')));
    wire.append(el('p', state.feedback, 'feedback'));
    if (state.result) wire.append(el('p', `结果：${state.result}`, 'result'));
    const actions = el('div', undefined, 'actions');
    edges().filter(e => same(e.from, at)).forEach((edge, i) => {
      const action = button('', () => {
        history.push({at:{...edge.to}, edge:edge.id}); refresh(); focusCurrent();
        const feedback = el('p', edge.feedback, 'feedback'); feedback.setAttribute('role','status'); $('detail').prepend(feedback);
      }, `action ${i===0?'primary':''}`);
      action.dataset.branch = edge.id; action.dataset.to = edge.to.node;
      action.append(el('span', edge.action), el('small', `${kindLabels[edge.kind]} · ${edge.condition}`), el('small', `${edge.id} → ${edge.to.node}/${edge.to.state} · ${labels[edge.status]}`));
      actions.append(action);
    });
    wire.append(actions); detail.append(wire, el('p', sourceText(n.refs), 'meta'));
    prototypes.filter(p => p.journey === journey.id && p.node === n.id && p.state === state.id).forEach(p => {
      const link = el('a', `查看页面原型 · ${p.label}`, 'prototype-link');
      link.href = `${prototype_hrefs[p.id]}#scene=${encodeURIComponent(p.scene_id)}`;
      link.dataset.prototype = p.id;
      detail.append(link);
    });
    const nextDecision = model.decisions.filter(d => d.status === 'decision' && d.nodes.includes(n.id));
    nextDecision.forEach(d => detail.append(el('p', `${d.id} 待决策：${d.question}`)));
  }
  function transform() {
    $('world').style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; $('zoom').textContent = `${Math.round(scale*100)}%`;
  }
  function fit() {
    scale = Math.min(1, ($('viewport').clientWidth-24)/width, ($('viewport').clientHeight-24)/height);
    tx = ($('viewport').clientWidth-width*scale)/2; ty = ($('viewport').clientHeight-height*scale)/2; transform();
  }
  function zoom(factor, x=$('viewport').clientWidth/2, y=$('viewport').clientHeight/2) {
    const next = Math.max(.08,Math.min(2.5,scale*factor)); tx=x-(x-tx)*next/scale; ty=y-(y-ty)*next/scale; scale=next; transform();
  }
  function focusCurrent() {
    const p = positions.get(current().node); scale=Math.max(scale,.7);
    tx=$('viewport').clientWidth/2-(p.x+112)*scale; ty=$('viewport').clientHeight/2-(p.y+64)*scale; transform();
  }
  function reset() { history=[{at:{...journey.entries[entryIndex].at},edge:null}]; refresh(); fit(); }
  function chooseJourney() {
    journey=model.journeys.find(j => j.id === $('journey').value); entryIndex=0;
    $('entry').replaceChildren(); journey.entries.forEach((entry,i) => option($('entry'),String(i),entry.label));
    $('goal').textContent=`${journey.id} · ${journey.goal}`; layout(); reset(); renderReview();
  }
  function describe(item, type) {
    if (!item) return '无';
    const refs = item.refs ? '；依据 '+item.refs.map(r=>`${r.source}/${r.section}`).join('、') : '';
    if (type === 'transitions') return `${item.from.node}/${item.from.state} — ${item.action}（${item.condition}）→ ${item.to.node}/${item.to.state}；${kindLabels[item.kind]}；${item.feedback}；${labels[item.status]}${refs}`;
    if (type === 'decisions') return `${item.question}；${item.recommendation}；${labels[item.status]}；涉及 ${item.nodes.join('、')}${item.accepted_revision?'；确认依据 '+item.accepted_revision:''}${item.supersedes?'；替代 '+item.supersedes:''}${refs}`;
    if (type === 'nodes') return `${item.title}；所在泳道 ${item.lane}；${labels[item.status]}；${item.content.join(' / ')}；${item.states.map(s => `${s.id}（${s.label}）：${s.feedback}${s.result?'；结果 '+s.result:''}`).join(' / ')}${refs}`;
    if (type === 'journeys') return `${item.title}；目标：${item.goal}；入口 ${item.entries.map(e=>`${e.label} → ${e.at.node}/${e.at.state}`).join('、')}；节点 ${item.nodes.join('、')}；分支 ${item.transitions.join('、')}`;
    if (type === 'sources') return `${item.label}@${item.revision}；${item.path}；内容摘要 ${item.sha256.slice(0,12)}`;
    if (type === 'prototypes') return `${item.label}@${item.revision}；${item.journey}/${item.node}/${item.state} → ${item.scene_id}；${item.manifest}`;
    return `${item.actor} / ${item.surface}`;
  }
  function renderReview() {
    $('changes').replaceChildren();
    let count=0;
    for (const [key,label] of [['added','新增'],['modified','修改'],['removed','移除']]) for (const c of changes[key]) {
      const row=el('div',undefined,'change-row'); row.dataset.change=c.id;
      row.append(el('strong',`${label} ${c.id}`));
      if (c.before) row.append(el('p',`之前：${describe(c.before,c.type)}`));
      if (c.after) row.append(el('p',`现在：${describe(c.after,c.type)}`));
      $('changes').append(row); count++;
    }
    if (!count) $('changes').append(el('p',changes.baseline?'与上一版相同。':'首次草拟：当前内容为提案，按标记讨论。','empty'));
    if (changes.affected.length) $('changes').append(el('p',`影响节点：${changes.affected.join('、')}`));
    $('decisions').replaceChildren(); $('inherited').replaceChildren();
    const superseded = new Set(model.decisions.filter(d=>d.status==='confirmed').map(d=>d.supersedes).filter(Boolean));
    let pending=0;
    model.decisions.filter(d=>d.nodes.some(n=>journey.nodes.includes(n))).forEach(d=>{
      const row=el('div',undefined,'decision'); row.dataset.decision=d.id;
      row.append(badge(d.status),el('p',`${d.id} · ${d.question}`),el('p',`建议 / 结论：${d.recommendation}`),el('p',`相关节点：${d.nodes.join('、')}`, 'meta'),el('p',sourceText(d.refs),'meta'));
      if(d.accepted_revision) row.append(el('p',`确认依据：${d.accepted_revision}`,'meta'));
      if(superseded.has(d.id)) row.append(el('p','已有新的确认结论，此处保留历史记录。','meta'));
      const isPending=d.status==='decision'&&!superseded.has(d.id);
      $(isPending?'decisions':'inherited').append(row); if(isPending) pending++;
    });
    if(!pending) $('decisions').append(el('p','本旅程没有新增待决策项。','empty'));
  }
  model.journeys.forEach(j=>option($('journey'),j.id,j.title));
  $('journey').addEventListener('change',chooseJourney);
  $('entry').addEventListener('change',()=>{entryIndex=Number($('entry').value);reset();});
  $('back').addEventListener('click',()=>{if(history.length>1){history.pop();refresh();focusCurrent();}});
  $('reset').addEventListener('click',reset); $('fit').addEventListener('click',fit);
  $('plus').addEventListener('click',()=>zoom(1.25)); $('minus').addEventListener('click',()=>zoom(.8));
  const viewport=$('viewport');
  viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button')) return; pan={x:e.clientX,y:e.clientY,tx,ty};viewport.setPointerCapture(e.pointerId);});
  viewport.addEventListener('pointermove',e=>{if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform();}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(event=>viewport.addEventListener(event,()=>{pan=null;}));
  viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  viewport.addEventListener('keydown',e=>{
    if(e.target!==viewport)return;
    const movement={ArrowLeft:[35,0],ArrowRight:[-35,0],ArrowUp:[0,35],ArrowDown:[0,-35]}[e.key];
    if(movement){e.preventDefault();tx+=movement[0];ty+=movement[1];transform();}
    else if(e.key==='+'||e.key==='=')zoom(1.25);else if(e.key==='-')zoom(.8);else if(e.key==='0')fit();
  });
  new ResizeObserver(fit).observe(viewport);
  $('version').textContent=`生成时版本：${model.revision} · 输入摘要 ${document.body.dataset.modelSha256.slice(0,12)}${changes.baseline?' · 对比 '+changes.baseline:''}。此离线页面不会自动感知外部文档变化；继续评审前由 Agent 校验并刷新。`;
  model.sources.forEach(s=>$('sources').append(el('p',`${s.label} · ${s.revision} · ${s.path} · SHA256 ${s.sha256}`,'source')));
  const requested=new URLSearchParams(location.hash.slice(1));
  if(model.journeys.some(j=>j.id===requested.get('journey'))) $('journey').value=requested.get('journey');
  chooseJourney();
  if(requested.get('node')&&journey.nodes.includes(requested.get('node'))){
    const node=nodes.get(requested.get('node')), requestedState=requested.get('state');
    const state=node.states.some(s=>s.id===requestedState)?requestedState:node.states[0].id;
    history.push({at:{node:node.id,state},edge:null,preview:true});refresh();focusCurrent();
  }
})();
</script>
</body></html>
