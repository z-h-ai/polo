:root {
  --background: #fbfbfa;
  --surface: #ffffff;
  --foreground: #17181a;
  --accent: #6e56cf;
  --info: #3275d8;
  --success: #2d8a5b;
  --destructive: #c84646;
  --on-accent: #ffffff;
  --bg-elevated: var(--surface);
  --surface-strong: #f3f4f5;
  --border: #e6e7e9;
  --fg-3: color-mix(in srgb, var(--foreground) 3%, var(--background));
  --fg-5: color-mix(in srgb, var(--foreground) 5%, var(--background));
  --fg-10: color-mix(in srgb, var(--foreground) 10%, var(--background));
  --fg-20: color-mix(in srgb, var(--foreground) 20%, var(--background));
  --fg-40: color-mix(in srgb, var(--foreground) 40%, var(--background));
  --fg-50: color-mix(in srgb, var(--foreground) 50%, var(--background));
  --fg-60: color-mix(in srgb, var(--foreground) 60%, var(--background));
  --fg-70: color-mix(in srgb, var(--foreground) 70%, var(--background));
  --fg-80: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --success-soft: color-mix(in srgb, var(--success) 10%, transparent);
  --info-soft: color-mix(in srgb, var(--info) 10%, transparent);
  --destructive-soft: color-mix(in srgb, var(--destructive) 10%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --overlay: color-mix(in srgb, var(--foreground) 42%, transparent);
  --shadow-minimal: 0 1px 2px rgba(23, 24, 26, .06), 0 1px 4px rgba(23, 24, 26, .03);
  --shadow-middle: 0 14px 34px rgba(23, 24, 26, .10), 0 2px 7px rgba(23, 24, 26, .04);
  --shadow-panel: 0 20px 44px rgba(23, 24, 26, .14), 0 3px 9px rgba(23, 24, 26, .06);
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-inner: 10px;
  --radius-lg: 12px;
  --radius-edge: 14px;
  --radius-card: 20px;
  --radius-pill: 9999px;
  --transition-fast: 0.14s ease-out;
  --transition-state: 0.28s ease-out;
}

[data-theme="dark"] {
  --background: #18191b;
  --surface: #222326;
  --foreground: #f4f3f1;
  --accent: #8c78df;
  --info: #6da3ec;
  --success: #5aae80;
  --destructive: #e06a6a;
  --surface-strong: #252629;
  --border: #34363b;
  --shadow-minimal: 0 1px 3px rgba(0, 0, 0, .24);
  --shadow-middle: 0 20px 44px rgba(0, 0, 0, .34);
  --shadow-panel: 0 24px 56px rgba(0, 0, 0, .42);
}

* { box-sizing: border-box; }
html { min-width: 320px; font-size: 15px; font-optical-sizing: auto; }
body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--foreground); background: var(--background); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { color: inherit; font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 24%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
.icon { display: inline-block; width: 16px; height: 16px; flex: 0 0 auto; }

.app-shell { display: grid; height: 100vh; min-height: 0; grid-template-rows: 64px auto minmax(0, 1fr); overflow: hidden; }
.workbench-bar { position: sticky; z-index: 20; top: 0; display: flex; grid-row: 1; align-items: center; gap: 12px; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--background) 92%, transparent); backdrop-filter: blur(18px); }
.brand-lockup { display: flex; min-width: 82px; align-items: center; gap: 9px; padding: 0; border: 0; background: transparent; color: var(--foreground); font-size: 14px; font-weight: 720; letter-spacing: -.03em; }
.brand-mark { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 8px; background: var(--foreground); color: var(--background); font-size: 13px; font-weight: 800; }
.space-control { position: relative; flex: 0 0 auto; }
.space-trigger { display: flex; min-width: 130px; max-width: 190px; height: 36px; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); text-align: left; }
.space-trigger:hover, .space-trigger[aria-expanded="true"] { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: var(--surface); }
.space-dot { width: 8px; height: 8px; flex: 0 0 auto; overflow: hidden; border-radius: 50%; background: var(--accent); color: transparent; font-size: 0; }
.space-avatar { display: grid; width: 26px; height: 26px; flex: 0 0 auto; place-items: center; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }
.space-copy { display: grid; min-width: 0; gap: 2px; flex: 1; }
.space-copy strong { overflow: hidden; color: var(--foreground); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.space-copy small { display: none; }
.icon-chevron { width: 13px; height: 13px; }
.tabs { display: flex; min-width: 0; height: 100%; flex: 1 1 auto; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; min-width: 98px; max-width: 190px; height: 36px; flex: 0 0 auto; align-items: center; border-radius: 9px; color: var(--fg-50); font-size: 12px; white-space: nowrap; }
.tab:hover { background: var(--surface-strong); color: var(--foreground); }
.tab.active { background: var(--surface); color: var(--foreground); box-shadow: var(--shadow-minimal); }
.tab-activate { display: inline-flex; min-width: 0; height: 36px; flex: 1; align-items: center; gap: 7px; padding: 0 4px 0 10px; overflow: hidden; border: 0; background: transparent; color: inherit; }
.tab-activate > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
.tab .tab-icon { display: grid; width: 18px; height: 18px; place-items: center; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tab .tab-icon .icon { width: 13px; height: 13px; }
.tab-run-dot { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 2px var(--success-soft); }
.tab-close { display: grid; width: 18px; height: 18px; flex: 0 0 auto; margin-right: 5px; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--fg-40); font-size: 15px; line-height: 1; }
.tab-close:hover { background: var(--fg-10); color: var(--foreground); }
.home-tab { display: inline-flex; width: auto; height: 36px; flex: 0 0 auto; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-50); font-size: 12px; font-weight: 620; }
.home-tab:hover { background: var(--surface-strong); color: var(--foreground); }
.home-tab.active { background: var(--surface); color: var(--foreground); box-shadow: var(--shadow-minimal); }
.bar-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
.bar-button, .icon-button, .avatar-button { border: 0; background: transparent; }
.bar-button { display: flex; height: 34px; align-items: center; gap: 7px; padding: 0 9px; border-radius: 9px; color: var(--fg-60); font-size: 12px; font-weight: 500; white-space: nowrap; }
.bar-button:hover { background: var(--surface-strong); color: var(--foreground); }
.icon-button { position: relative; display: inline-grid; width: 32px; height: 32px; place-items: center; border-radius: var(--radius-sm); color: var(--fg-50); }
.icon-button:hover { background: var(--fg-5); color: var(--foreground); }
.avatar-button { display: grid; width: 28px; height: 28px; place-items: center; margin-left: 3px; border-radius: var(--radius-pill); background: var(--foreground); color: var(--background); font-size: 11px; font-weight: 600; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-40); }
.status-dot.running { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.notification-dot { position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border: 1px solid var(--background); border-radius: 50%; background: var(--info); }
.popover { position: absolute; top: calc(100% + 8px); border: 1px solid var(--border); border-radius: var(--radius-inner); background: var(--background); box-shadow: var(--shadow-panel); }
.space-menu { right: 0; left: auto; width: min(306px, calc(100vw - 24px)); padding: 6px; background: var(--surface); }
.account-menu { right: 20px; width: min(294px, calc(100vw - 24px)); padding: 6px; background: var(--surface); }
.menu-label, .menu-section-title { padding: 8px 9px 5px; color: var(--fg-40); font-size: 11px; font-weight: 500; letter-spacing: .75px; text-transform: uppercase; }
.space-row, .menu-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 44px; padding: 7px 8px; border: 0; border-radius: var(--radius-sm); background: transparent; text-align: left; }
.space-row:hover, .space-row.active, .menu-row:hover { background: var(--fg-5); }
.space-row > span:nth-child(2), .menu-row .menu-copy { display: grid; min-width: 0; flex: 1; gap: 2px; }
.space-row b, .menu-row b { font-size: 13px; font-weight: 500; }
.space-row small, .menu-row small { color: var(--fg-50); font-size: 11px; line-height: 1.35; }
.space-row .check { width: 15px; height: 15px; color: var(--success); }
.menu-divider { height: 1px; margin: 5px 3px; background: var(--border); }
.menu-row .menu-icon { display: grid; width: 26px; height: 26px; place-items: center; border-radius: var(--radius-sm); background: var(--fg-5); color: var(--fg-60); }
.menu-row .menu-icon .icon { width: 14px; height: 14px; }
.menu-row .menu-arrow { width: 13px; height: 13px; color: var(--fg-40); }
.connection-banner { display: grid; width: calc(100% - 24px); max-width: 1236px; grid-row: 2; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px; margin: 8px auto 0; padding: 9px 11px; border: 1px solid color-mix(in srgb, var(--info) 42%, var(--border)); border-radius: var(--radius-md); background: var(--info-soft); color: var(--foreground); box-shadow: var(--shadow-minimal); }
.connection-icon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: var(--radius-sm); background: var(--surface); color: var(--info); }
.connection-copy { display: grid; min-width: 0; gap: 2px; }
.connection-copy strong { font-size: 12px; font-weight: 650; }
.connection-copy small { color: var(--fg-60); font-size: 10px; line-height: 1.4; }

.workspace-main { width: 100%; max-width: 1260px; min-height: 0; grid-row: 3; margin: 0 auto; padding: 46px 44px 72px; overflow-y: auto; }
.eyebrow { margin: 0 0 7px; color: var(--fg-50); font-size: 11px; font-weight: 500; letter-spacing: .75px; text-transform: uppercase; }
.app-page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
.app-page-heading h1, .subpage-heading h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1.25; }
.app-page-heading > div > p:last-child, .subpage-heading > div > p:last-child { max-width: 690px; margin: 7px 0 0; color: var(--fg-60); font-size: 13px; line-height: 1.5; }
.page-meta { margin: 5px 0 0 !important; color: var(--fg-50) !important; font-size: 11px !important; line-height: 1.4 !important; }
.home-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
}

.home-hero > div {
  min-width: 0;
}

.home-hero h1 {
  margin: 0;
  font-size: clamp(30px, 3vw, 38px);
  font-weight: 750;
  letter-spacing: -.055em;
  line-height: 1.08;
}

.home-hero p:last-child {
  max-width: 690px;
  margin: 13px 0 0;
  color: var(--fg-60);
  font-size: 15px;
  line-height: 1.65;
}

.home-hero strong {
  color: var(--foreground);
}

.home-context-link {
  display: grid;
  min-width: 210px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  background: transparent;
  color: var(--fg-70);
  box-shadow: none;
  text-align: left;
}

.home-context-link:hover {
  border-color: transparent;
  background: var(--fg-5);
  color: var(--foreground);
  box-shadow: none;
}

.home-context-link > .icon:first-child {
  color: var(--accent);
}

.home-context-link > .icon:last-child {
  width: 14px;
  height: 14px;
  color: var(--fg-40);
}

.home-context-link span {
  display: grid;
  gap: 3px;
}

.home-context-link strong {
  font-size: 13px;
  font-weight: 600;
}

.home-context-link small {
  color: var(--fg-50);
  font-size: 11px;
}

.section {
  margin-top: 34px;
}

.section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.section-header > div {
  min-width: 0;
}

.section-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 720;
  letter-spacing: -.03em;
}

.section-header p {
  max-width: 720px;
  margin: 6px 0 0;
  color: var(--fg-60);
  font-size: 14px;
  line-height: 1.45;
}

.section-link,
.text-button {
  padding: 3px 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
}

.section-link:hover,
.text-button:hover {
  text-decoration: underline;
}

.home-section-action {
  min-height: 30px;
  flex: 0 0 auto;
  padding: 0 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--fg-60);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.home-section-action:hover {
  background: var(--fg-5);
  color: var(--foreground);
  text-decoration: none;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.compact-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.product-card,
.result-card,
.detail-card {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--surface);
  box-shadow: var(--shadow-minimal);
}

.product-card {
  display: flex;
  min-height: 222px;
  flex-direction: column;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.product-card:hover,
.result-card:hover {
  border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
  transform: translateY(-3px);
  box-shadow: var(--shadow-middle);
}

.home-app-grid .product-card:hover {
  border-color: var(--fg-20);
  transform: translateY(-1px);
  box-shadow: var(--shadow-middle);
}

.highlighted-card {
  border-color: var(--accent) !important;
  box-shadow:
    0 0 0 3px var(--accent-soft),
    var(--shadow-middle) !important;
}

.home-app-grid .card-heading {
  display: grid;
  gap: 0;
}

.home-app-grid .app-art {
  width: 42px;
  height: 42px;
  margin-bottom: 26px;
  border-radius: 13px;
}

.assistant-card {
  border-color: var(--border);
}

.assistant-card .app-art {
  background: var(--accent-soft);
  color: var(--accent);
}

.assistant-card .card-action + .card-action {
  margin-left: 0;
}

.placement-card { min-height: 210px; }
.placement-card .status-line { flex-wrap: wrap; }
.placement-card .card-action + .card-action { margin-left: 0; }
.home-placement { color: var(--fg-50); font-size: 10px; white-space: nowrap; }
.home-placement.on { color: var(--accent); }

.card-kicker {
  margin: 0 0 4px;
  color: var(--accent);
  font-size: 9px;
  font-weight: 720;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.card-heading {
  display: flex;
  min-width: 0;
  align-items: flex-start;
  gap: 10px;
}

.app-art {
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  color: var(--accent);
}

.app-art.compact {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
}

.app-art.teal {
  background: var(--success-soft);
  color: var(--success);
}

.app-art.amber {
  background: var(--info-soft);
  color: var(--info);
}

.app-art.ink {
  background: var(--fg-10);
  color: var(--foreground);
}

.app-art .icon {
  width: 18px;
  height: 18px;
}

.app-art.compact .icon {
  width: 15px;
  height: 15px;
}

.card-title {
  min-width: 0;
}

.card-title h3 {
  overflow: hidden;
  margin: 1px 0 3px;
  font-size: 15px;
  font-weight: 720;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-app-grid .card-title h3 {
  font-size: 16px;
}

.source-line {
  overflow: hidden;
  margin: 0;
  color: var(--fg-50);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-app-grid .source-line {
  font-size: 12px;
}

.product-description,
.result-card p {
  margin: 18px 0 0;
  color: var(--fg-60);
  font-size: 12px;
  line-height: 1.55;
}

.home-app-grid .product-description {
  max-width: 34rem;
  margin-top: 17px;
  font-size: 13px;
  line-height: 1.6;
}

.card-meta {
  margin-top: 9px;
  color: var(--fg-50);
  font-size: 10px;
}

.status-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: auto;
  padding-top: 14px;
}

.status-line.actions-only {
  justify-content: flex-end;
}

.status {
  display: inline-flex;
  min-height: 20px;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
}

.status::before {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  content: "";
}

.status.good {
  background: var(--success-soft);
  color: var(--success);
}

.status.info {
  background: var(--info-soft);
  color: var(--info);
}

.status.bad {

}

.status.neutral {

.card-action {

  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.card-action:hover {
  border-color: var(--accent);
  color: var(--accent);
}

}

.card-action:disabled:hover {

  color: var(--foreground);
}

.card-action.primary {

.home-app-grid .card-action {
  border-color: transparent;
  background: transparent;
  color: var(--fg-60);

}

.home-app-grid .card-action:hover {

  background: var(--fg-5);
  color: var(--foreground);

  padding: 0 12px;

.utility-card:hover {
  border-color: var(--fg-20);
  transform: translateY(-1px);

function switchProgress(done, total) {

  if (opt.userMsg) msgs.push('<div class="message user"><span class="message-avatar">王</span><div><small>小王</small><p>' + opt.userMsg + '</p></div></div>');
  const credits = opt.credit ? '<div class="credits-banner">' + icon('wallet') + '<span><b>积分不足</b> · 本次发送需要 ' + CREDIT.need + ' 积分，当前余额 ' + CREDIT.balance + ' 积分。输入内容已保留。</span><button class="button" data-go="P-M09-BROWSER">去充值</button></div>' : '';
  const entNote = opt.entNote ? '<div class="credits-banner info">' + icon('info') + '<span><b>企业额度不足</b> · Member 不能自费充值，已通知企业管理员（Owner）处理。</span><button class="button" data-go="P-M05-CHAT">知道了</button></div>' : '';

        '<div class="chat-file-row">' + icon('file') + '<div><strong>Q2-报价底稿.xlsx</strong><small>附件 · 2.1 MB · 会话内可预览</small></div><button class="icon-button" aria-label="更多">' + icon('more') + '</button></div>' +

<script>

B['P-M11-CONTRACT-DL'] = () => systemCard({ glyph: 'download', spin: 1, eyebrow: '正在升级', title: '正在下载新版本', desc: '后台下载 · 不强制等待', progress: 68, progressLabel: '验证更新包 · 68%', actions: '<button class="button primary" data-go="P-M11-CONTRACT-FAIL">模拟下载失败</button>' });

<script>
const $ = (s) => document.querySelector(s);
/* =====================================================================
   三条代表故事
   ===================================================================== */
const STORIES = [
  { name: '故事 1 · 首登加入企业并使用', steps: [
    { s: 'P-M01-LOGIN-PASSWORD', n: '小王首次使用 Polo，用账号密码登录。' },
    { s: 'P-M01-PERSONAL-PREP', n: '登录成功，系统为它准备唯一的「我的空间」。' },
    { s: 'P-M03-HOME-ZERO', n: '首登还没有常用 App：助手始终可用，引导去全部 Apps。' },
    { s: 'P-M03-ALL-APPS', n: '在全部 Apps 里按来源浏览：企业分发、圈子作品。' },
    { s: 'P-M03-INSPECTOR', n: '查看详情：来源、版本与状态原因都在这里核对。' },
    { s: 'P-M04-PREPARE', n: '准备「合同审查」更新：确认权限后下载。' },
    { s: 'P-M04-APP-VIEW', n: 'App 占满主内容工作区，内部界面归 FDE（原型为中性占位）。' },
    { s: 'P-M05-CHAT', n: '回到 Polo 助手，让助手基于附件整理报价汇总。' },
    { s: 'P-M08-FILES', n: '附件与生成文件都留在会话里，重开后可继续。' }
  ] },
  { name: '故事 2 · 日常切换空间（部分停止失败）', steps: [
    { s: 'P-M03-HOME-ENT', n: '小王在晨星科技工作，首页显示 3 项运行中。' },
    { s: 'P-M04-RUNTIME', n: '运行状态中心按空间列出本机任务：App 与助手生成。' },
    { s: 'P-M02-SWITCHER', n: '从顶栏空间切换器发起切换；有活动任务时会先确认。' },
    { s: 'P-M02-CONFIRM', n: '确认框列出将被终止的 3 项任务。' },
    { s: 'P-M02-STOPPING', n: '逐项终止中；全部停止后才提交切换。' },
    { s: 'P-M02-STOP-FAILED', n: '1 项未能终止：重试失败项，或取消切换。' },
    { s: 'P-M02-STOP-CANCEL', n: '小王取消切换：留在晨星科技，已终止的项不会自动复活。' },
    { s: 'P-M04-BACKGROUND', n: '改为后台继续：顶栏保留运行入口，随时可查看。' }
  ] },
  { name: '故事 3 · 积分不足 → 浏览器 → 单次查询', steps: [
    { s: 'P-M05-CHAT', n: '小王正在让助手按客户分组整理报价汇总。' },
    { s: 'P-M09-PRE-BLOCK', n: '发送前发现积分不足：输入保留，发送不可用。' },
    { s: 'P-M09-BROWSER', n: '去浏览器完成充值；桌面端只发起与确认结果。' },
    { s: 'P-M09-CHECKING', n: '回到 Polo：只做一次到账查询，会话与草稿保留。' },
    { s: 'P-M09-NOT-YET', n: '第一次查询未到账：保持阻断，可再查一次。' },
    { s: 'P-M09-RESUMED', n: '积分到账：解除阻断，但不自动发送——由小王决定。' },
    { s: 'P-M05-CHAT', n: '小王自己点下发送，继续刚才的整理。' }
  ] }
];

/* =====================================================================
   路由与渲染
   ===================================================================== */
let story = null; // { idx, step }
const overlayEl = $('#overlay-root');

function currentId() {
  const m = location.hash.match(/s=([A-Za-z0-9-]+)/);
  return (m && SCREENS[m[1]]) ? m[1] : DEFAULT_SCREEN;
}
function go(id) { if (SCREENS[id]) location.hash = '#s=' + id; }

function openModal(html) { const layer = $('#modal-layer'); layer.innerHTML = html; layer.hidden = false; }
function closeModal() { const layer = $('#modal-layer'); layer.hidden = true; layer.innerHTML = ''; }
let toastTimer = null;
function showToast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000); }

function render() {
  const id = currentId();
  const meta = SCREENS[id] || SCREENS[DEFAULT_SCREEN];
  const out = B[id] ? B[id]() : '';
  const o = (out && typeof out === 'object') ? out : { main: out };
  const st = Object.assign({}, meta, { menu: o.menu || null });
  if (st.space === 'ent') st.space = 'chenxing'; // SCREENS 元数据用 'ent'，数据模型用具体企业 id
  if (o.offlineMode) st.offline = o.offlineMode;

  const isSystem = meta.chrome !== 'desktop';
  $('#app-shell').hidden = isSystem;
  $('#system-screen').hidden = !isSystem;
  $('#connection-banner').hidden = true;
  if (isSystem) {
    $('#system-screen').innerHTML = o.main || '';
  } else {
    renderChrome(st, id);
    const wm = $('#workspace-main');
    wm.innerHTML = o.main || '';
    wm.classList.toggle('assistant-mode', meta.layout === 'assist');
    if (meta.offline) showOfflineBanner(st);
  }

  if (o.modal) openModal(o.modal); else closeModal();
  if (o.toast) showToast(o.toast);
  if (!story) { menuState = st.menu; syncPopovers(); }

  renderNote(meta, id);
  renderStoryBar(meta, id);
  document.title = meta.t + ' · POO-71 原型';
  window.scrollTo(0, 0);
}

/* ---------- 本页标注 ---------- */
function renderNote(st, id) {
  const p = $('#note-panel');
  p.innerHTML =
    '<div class="np-head"><span class="class-chip ' + st.cls + '">' + (CLS_LABEL[st.cls] || st.cls) + '</span>' +
    '<b>' + MODULE_TITLES[st.m] + '</b><span class="np-id">' + id + '</span>' +
    '<button class="np-close" data-close-note>✕</button></div>' +
    '<p>' + st.note + '</p>' +
    '<div class="np-foot">演示数据均为虚构；浏览器交接页为「另一端负责」的示意。</div>';
}

/* ---------- 故事播放 ---------- */
function startStory(idx) { story = { idx, step: 0 }; go(STORIES[idx].steps[0].s); }
function stopStory() { story = null; $('#dm-narrator').hidden = true; $('#dm-next').hidden = true; $('#dm-exit-story').hidden = true; }
function storyStep(delta) {
  if (!story) return;
  const steps = STORIES[story.idx].steps;
  const next = Math.min(Math.max(story.step + delta, 0), steps.length - 1);
  story.step = next; go(steps[next].s);
}
function renderStoryBar(st, id) {
  const nar = $('#dm-narrator'), nxt = $('#dm-next'), exit = $('#dm-exit-story');
  if (!story) { nar.hidden = true; nxt.hidden = true; exit.hidden = true; return; }
  const steps = STORIES[story.idx].steps;
  let i = steps.findIndex(x => x.s === id);
  if (i < 0) i = story.step;
  story.step = i;
  $('#dn-step').textContent = STORIES[story.idx].name + ' · ' + (i + 1) + '/' + steps.length;
  $('#dn-text').textContent = steps[i].n;
  nar.hidden = false; nxt.hidden = false; exit.hidden = false;
  nxt.textContent = i >= steps.length - 1 ? '结束故事 ▸' : '下一步 ▸';
}

/* ---------- 页面索引 ---------- */
function buildIndex() {
  const groups = {};
  Object.keys(SCREENS).forEach(k => { (groups[SCREENS[k].m] = groups[SCREENS[k].m] || []).push(k); });
  let h = '<div class="overlay-backdrop" data-close-overlay><div class="overlay-card">' +
    '<div class="ov-head"><b>页面索引 · ' + Object.keys(SCREENS).length + ' 个页面 / 状态</b>' +
    '<span class="ov-sub">每屏一个 hash 路由，可直达；角标为来源分类</span>' +
    '<button class="overlay-close" data-close-overlay>✕</button></div><div class="ov-body">';
  Object.keys(groups).forEach(m => {
    h += '<div class="idx-group"><h3>' + MODULE_TITLES[m] + ' <span class="cnt">' + groups[m].length + '</span></h3><div class="idx-items">';
    groups[m].forEach(k => {
      const s = SCREENS[k];
      h += '<button class="idx-item" data-go="' + k + '"><span class="sid">' + k.replace('P-', '') + '</span>' +
        '<span class="ii-t">' + s.t + '</span><span class="class-chip ' + s.cls + '">' + CLS_LABEL[s.cls] + '</span></button>';
    });
    h += '</div></div>';
  });
  h += '</div></div></div>';
  return h;
}
function toggleIndex(force) {
  const open = force !== undefined ? force : !overlayEl.innerHTML;
  overlayEl.innerHTML = open ? buildIndex() : '';
}

/* ---------- 事件（委托） ---------- */
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close-modal]')) { closeModal(); return; }
  // modal 空白处点击关闭
  if (e.target.closest('#modal-layer') && !e.target.closest('.dialog')) { closeModal(); return; }
  const goEl = e.target.closest('[data-go]');
  if (goEl) { const id = goEl.getAttribute('data-go'); if (id && SCREENS[id]) { go(id); return; } }
  // 顶栏弹出层触发钮
  const popEl = e.target.closest('[data-pop]');
  if (popEl) {
    const key = popEl.getAttribute('data-pop');
    menuState = menuState === key ? null : key;
    syncPopovers();
    return;
  }
  // 点击 popover / 顶栏以外区域 → 关闭菜单
  if (!e.target.closest('.popover') && !e.target.closest('.workbench-bar')) {
    if (menuState) { menuState = null; syncPopovers(); }
  }
  if (e.target.closest('[data-close-overlay]')) {
    if (e.target.closest('.overlay-card') && !e.target.closest('.overlay-close')) return;
    toggleIndex(false); return;
  }
  if (e.target.closest('[data-close-note]')) { $('#note-panel').hidden = true; return; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (overlayEl.innerHTML) { toggleIndex(false); return; }
    if (!$('#modal-layer').hidden) { closeModal(); return; }
    if (menuState) { menuState = null; syncPopovers(); return; }
  }
  if (story && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) storyStep(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', () => { toggleIndex(false); render(); });
window.addEventListener('resize', () => { $('#window-guard').hidden = window.innerWidth > 640; viewSize(); });

/* ---------- 演示控制区 ---------- */
$('#dm-index').addEventListener('click', () => toggleIndex());
$('#dm-note').addEventListener('click', () => { const p = $('#note-panel'); p.hidden = !p.hidden; });
$('#dm-compact').addEventListener('click', () => {
  const on = document.body.classList.toggle('preview-1024');
  $('#dm-compact').textContent = on ? '退出 1024 预览' : '1024×768 预览';
  viewSize();
});
$('#dm-story1').addEventListener('click', () => startStory(0));
$('#dm-story2').addEventListener('click', () => startStory(1));
$('#dm-story3').addEventListener('click', () => startStory(2));
$('#dm-exit-story').addEventListener('click', stopStory);
$('#dm-next').addEventListener('click', () => {
  if (!story) return;
  const steps = STORIES[story.idx].steps;
  if (story.step >= steps.length - 1) { stopStory(); return; }
  storyStep(1);
});
function viewSize() { $('#dm-viewsize').textContent = '视口 ' + window.innerWidth + '×' + window.innerHeight + (document.body.classList.contains('preview-1024') ? ' · 预览 1024×768' : ''); }

/* ---------- init ---------- */
(function init() {
  if (new URLSearchParams(location.search).has('clean')) document.body.classList.add('clean');
  $('#window-guard').hidden = window.innerWidth > 640;
  viewSize();
  if (!location.hash) location.replace('#s=' + DEFAULT_SCREEN);
  render();
})();

/* ---------- 溢出审计（仅 ?audit=1 时激活，供截图脚本读取，不影响正常使用） ---------- */
(function audit() {
  const q = new URLSearchParams(location.search);
  if (!q.has('audit')) return;
  if (q.has('all')) {
    // 单次会话遍历全部屏（重写 currentId 绑定，不触发 hash 导航）：[id, 横向溢出 px, 是否空渲染]
    const real = currentId;
    const out = [];
    try {
      Object.keys(SCREENS).forEach(id => {
        currentId = () => id;
        render();
        const doc = document.documentElement;
        const filled = ['#workspace-main', '#system-screen'].some(sel => { const el = $(sel); return el && el.innerHTML.trim(); });
        out.push([id, Math.max(doc.scrollWidth, document.body.scrollWidth) - window.innerWidth,
          filled ? 0 : 1]);
      });
    } finally { currentId = real; }
    document.title = 'AUDIT:' + JSON.stringify(out);
    try {
      // 上报给本地审计接收器（fire-and-forget；无接收器时静默失败，不影响使用）
      fetch('http://127.0.0.1:8765/audit?vp=' + encodeURIComponent(q.get('vp') || ''), { method: 'POST', mode: 'no-cors', body: JSON.stringify({ vp: q.get('vp') || '', out }) });
    } catch (e) { /* 忽略 */ }
    return;
  }
  requestAnimationFrame(() => {
    try {
      const doc = document.documentElement;
      const overflowX = Math.max(doc.scrollWidth, document.body.scrollWidth) - window.innerWidth;
      document.body.setAttribute('data-audit-screen', currentId());
      document.body.setAttribute('data-audit-overflow-x', String(overflowX));
      document.body.setAttribute('data-audit-blank', ['#workspace-main', '#system-screen'].some(sel => { const el = document.querySelector(sel); return el && el.innerHTML.trim(); }) ? '0' : '1');
      document.body.setAttribute('data-audit-scrollh', String(Math.max(doc.scrollHeight, document.body.scrollHeight)));
      const stack = document.elementsFromPoint(window.innerWidth / 2, window.innerHeight - 4)
        .map(e => e.tagName + (e.id ? '#' + e.id : '')).slice(0, 5).join(' | ');
      document.body.setAttribute('data-audit-bottom', stack);
    } catch (e) { /* 调试探测失败不影响页面 */ }
  });
})();
</script>
