<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self' file:; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Product UI Prototype Review</title>
<style>
:root{color-scheme:light;--ink:#24313d;--muted:#64707d;--line:#d7dde3;--accent:#263746;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--ink);background:#eef1f4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}[hidden]{display:none!important}
button,select{font:inherit;color:inherit;background:#fff;border:1px solid #b8c1ca;border-radius:6px;min-height:32px;padding:5px 8px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #607e9b;outline-offset:2px}
.review-console{height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr)}
.review-toolbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line);min-width:0;font-size:12px;white-space:nowrap}
.current-page{min-width:30px;max-width:210px;overflow:hidden;text-overflow:ellipsis;font-size:13px}.badge{font-size:10px;color:var(--muted)}[data-panel-hint]{max-width:180px;overflow:hidden;text-overflow:ellipsis}.question-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1}.annotation-count{flex:none}.question{display:flex;gap:5px;align-items:center;flex:1;min-width:64px;text-align:left;overflow:hidden;text-overflow:ellipsis}.toolbar-story{display:flex;align-items:center;gap:4px}.toolbar-story button{padding:4px 6px}.toolbar-story:empty{display:none}
.workspace{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}.workspace.inspector-open{grid-template-columns:minmax(0,1fr) 320px}
.viewport-column{position:relative;min-width:0;min-height:0;overflow:hidden}.viewport-area{height:100%;width:100%;overflow:hidden;background:#dfe4e8;overscroll-behavior:contain;scrollbar-gutter:auto}.viewport-area.zoomed{overflow:auto}.viewport-canvas{display:grid;place-items:center;min-width:100%;min-height:100%;padding:12px;width:max-content;height:max-content}.viewport-scale-box{flex:none}.viewport-frame{display:block;border:0;background:white;transform-origin:top left}
.inspector{display:none;background:white;border-left:1px solid var(--line);min-height:0;overflow:auto;padding:10px;font-size:13px;overflow-wrap:anywhere}.inspector-open .inspector{display:block}.panel-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.inspector-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}.inspector-tabs button{padding:5px 2px;font-size:12px}.inspector-tab[aria-selected="true"],.page-link.active{background:var(--accent);color:white}.module-group{border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0}.module-group summary{cursor:pointer;padding:6px}.module-count{float:right}.page-link,.annotation-entry{display:block;width:100%;text-align:left;margin:6px 0}.page-link small,.annotation-entry small{display:block;font-size:11px;margin-top:4px}.annotation-entry[aria-current="true"]{outline:2px solid #607e9b}.annotation-body{white-space:pre-wrap;line-height:1.6}.annotation-detail{border-top:1px solid var(--line);padding:8px 0}.control{display:grid;gap:5px;margin:14px 0}.review-brief p{line-height:1.6}.muted{color:var(--muted)}.story-actions{display:flex;gap:4px;flex-wrap:wrap}.story-description{line-height:1.6}
/* Only these scoped annotation elements may overlay the stage. Empty space passes through. */
[data-annotation-layer]{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;font-size:14px}
[data-annotation-layer] .annotation-pin{position:absolute;pointer-events:auto;min-height:26px;width:26px;height:26px;padding:0;border-radius:50%;background:#243746;color:white;font-size:13px;box-shadow:0 1px 4px #0003}
[data-annotation-layer] .annotation-highlight{position:absolute;pointer-events:none;border:2px solid #607e9b;border-radius:3px}
[data-annotation-layer] .annotation-card{position:absolute;pointer-events:auto;width:300px;max-height:280px;overflow:auto;padding:12px;background:white;border:1px solid #9baab7;border-radius:8px;box-shadow:0 5px 20px #0002;line-height:1.5;font-size:14px}
.annotation-card h2{font-size:15px;margin:0 0 8px}.annotation-card p{white-space:pre-wrap;margin:8px 0}.card-actions{display:flex;gap:5px;flex-wrap:wrap}.panel-return{display:none}
@media(max-width:1100px){.badge .long-label{display:none}.current-page{max-width:150px}}
@media(max-width:860px){.review-toolbar{padding:0 6px;gap:4px}.current-page{max-width:90px}.toolbar-story{display:none}.toolbar-label{display:none}.badge{font-size:9px}.workspace.inspector-open{grid-template-columns:minmax(0,1fr)}.viewport-column,.inspector{grid-area:1/1}.inspector-open .viewport-column{visibility:hidden}.inspector{border:0}.panel-return{display:inline}.panel-close{display:none}.question{min-width:42px}[data-panel-hint]{max-width:90px;min-width:40px}.badge{max-width:65px;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body data-prototype-mode="high_fidelity">
<main class="review-console" data-review-chrome>
<header class="review-toolbar" data-review-controls>
 <button type="button" data-back aria-label="返回上一页">←</button>
 <strong class="current-page" data-current-scene></strong>
 <button type="button" data-open-panel="index" aria-label="打开页面入口">☰<span class="toolbar-label"> 页面</span></button>
 <span class="badge" title="产品构想，非真实实现 · 演示数据">原型<span class="long-label"> · 产品构想，非真实实现</span> · 演示数据</span>
 <button type="button" class="question" data-open-panel="review" data-question-entry><span class="question-summary" data-question-summary></span><span class="annotation-count" data-annotation-count></span></button>
 <div class="toolbar-story" data-toolbar-story></div>
 <button type="button" data-toggle-annotations aria-pressed="false" aria-label="查看说明">◎<span class="toolbar-label"> 查看说明</span></button>
 <button type="button" data-panel-hint hidden>在面板阅读</button>
 <button type="button" data-open-panel="settings" aria-label="显示设置">⚙<span class="toolbar-label"> 显示</span></button>
</header>
<section class="workspace" data-workspace>
 <div class="viewport-column">
  <div class="viewport-area" data-viewport-area><div class="viewport-canvas"><div class="viewport-scale-box" data-viewport-scale-box><iframe class="viewport-frame" data-prototype-viewport title="产品原型" src="surface.html"></iframe></div></div></div>
  <div data-annotation-layer aria-label="定位说明"></div>
 </div>
 <aside class="inspector" data-inspector aria-label="评审面板">
  <div class="panel-heading"><strong data-review-title></strong><button type="button" data-inspector-toggle aria-label="关闭面板，返回原型"><span class="panel-return">返回原型</span><span class="panel-close">关闭</span></button></div>
  <div class="inspector-tabs" role="tablist" aria-label="评审内容">
   <button class="inspector-tab" role="tab" data-inspector-tab="index" aria-selected="true">页面</button><button class="inspector-tab" role="tab" data-inspector-tab="annotation" aria-selected="false">说明</button><button class="inspector-tab" role="tab" data-inspector-tab="review" aria-selected="false">本轮评审</button><button class="inspector-tab" role="tab" data-inspector-tab="settings" aria-selected="false">设置</button>
  </div>
  <section class="inspector-panel" data-panel="index"><label class="control">故事<select data-story-select><option value="">普通浏览</option></select></label><section data-story-player><strong data-story-name>普通浏览</strong><p data-story-progress></p><details><summary>演示步骤说明</summary><p class="story-description" data-story-description></p></details><div class="story-actions"><button data-story-prev disabled>上一步</button><button data-story-next disabled>下一步</button><button data-story-exit disabled>退出故事</button></div></section><div data-page-index></div></section>
  <section class="inspector-panel" data-panel="annotation" data-page-annotation hidden></section>
  <section class="inspector-panel review-brief" data-panel="review" data-review-brief hidden><h2>本轮评审</h2><p data-review-version></p><p><strong>现在怎样：</strong><span data-review-current></span></p><p><strong>改成怎样：</strong><span data-review-target></span></p><p><strong>为什么改：</strong><span data-review-reason></span></p><p><strong>本轮问题：</strong><span data-review-question></span></p><p data-change-summary></p><p>用自然语言反馈即可。行为、布局、视觉分别确认；浏览和演示步骤结束不代表批准。确认与同步结果以现有评审记录及 Spec／任务正文为准。</p><a data-return-flow hidden>返回流程</a></section>
  <section class="inspector-panel" data-panel="settings" hidden>
   <label class="control">视口<select data-viewport-select></select></label><label class="control">缩放<select data-zoom-select><option value="fit">适合窗口</option><option value="width">适合宽度</option><option value="actual">100%</option></select></label><p class="muted" data-viewport-size></p>
   <label class="control" data-theme-control>主题<select data-theme-select></select></label><label class="control" data-language-control>语言<select data-language-select></select></label><label class="control" data-perspective-control>角色 / 视角<select data-perspective-select><option value="">默认</option></select></label><button type="button" data-reset>重置演示</button>
  </section>
 </aside>
</section>
</main>

<script>
(()=>{'use strict';

function renderIndex(){const root=$('[data-page-index]');const open=new Set($$('[data-module-group][open]').map(el=>el.dataset.moduleGroup));root.textContent='';manifest.modules.forEach(module=>{const scenes=manifest.scenes.filter(s=>s.module===module.id);const group=document.createElement('details');group.className='module-group';group.dataset.moduleGroup=module.id;group.open=open.has(module.id)||byScene.get(currentScene).module===module.id;const summary=document.createElement('summary');summary.textContent=`${module.title} · ${scenes.length}`;group.append(summary);for(const scene of scenes){const button=document.createElement('button');button.className=`page-link${scene.id===currentScene?' active':''}`;button.dataset.sceneLink=scene.id;button.textContent=scene.title;const small=document.createElement('small'),entry=reviewEntryByScene.get(scene.id);small.textContent=entry?`${scene.id} · ${scene.category} · 评审进入：${entry.reason}`:`${scene.id} · ${scene.category}`;button.append(small);group.append(button)}root.append(group)})}
function renderAnnotations(){const root=$('[data-page-annotation]');root.textContent='';const title=document.createElement('h2');title.textContent=byScene.get(currentScene).title;const page=document.createElement('p');page.textContent=byScene.get(currentScene).annotation;root.append(title,page);annotations().forEach((a,i)=>{const button=document.createElement('button');button.className='annotation-entry';button.dataset.annotationEntry=a.id;button.setAttribute('aria-current',String(selected===a.id));button.textContent=`${i+1}. ${a.title}`;const state=document.createElement('small');state.dataset.annotationState=a.id;button.append(state);const detail=document.createElement('div');detail.className='annotation-detail';detail.dataset.annotationDetail=a.id;detail.hidden=selected!==a.id;const body=document.createElement('p');body.className='annotation-body';body.textContent=a.body;detail.append(body);if(a.anchor){const actual=document.createElement('button');actual.dataset.annotationActual=a.id;actual.textContent='以此控件为中心 · 100%';detail.append(actual)}root.append(button,detail)});updateStates()}

function renderStory(){const step=activeStory?.steps[storyStep],next=activeStory?.steps[storyStep+1],needsProduct=next&&next.arrival!=='review';$('[data-story-name]').textContent=activeStory?.title||'普通浏览';$('[data-story-progress]').textContent=step?`演示步骤 ${storyStep+1} / ${activeStory.steps.length}`:'演示步骤不代表评审完成';const entry=step&&step.arrival==='review'?reviewEntryByScene.get(step.scene):null;$('[data-story-description]').textContent=step?`${activeStory.description}\n${step.description}${entry?`\n评审进入：${entry.reason}`:''}`:'';$('[data-story-prev]').disabled=!step||storyStep===0;$('[data-story-next]').disabled=!step||Boolean(needsProduct);$('[data-story-next]').textContent=step&&storyStep===activeStory.steps.length-1?'结束故事':needsProduct?'请在产品内操作':'下一步';$('[data-story-exit]').disabled=!step;const toolbar=$('[data-toolbar-story]');toolbar.textContent='';if(step){const label=document.createElement('span');label.textContent=$('[data-story-progress]').textContent;toolbar.append(label);for(const [action,text] of [['prev','←'],['next','→']]){const b=document.createElement('button');b.dataset.storyAction=action;b.textContent=text;b.setAttribute('aria-label',action==='prev'?'上一个演示步骤':$('[data-story-next]').textContent);b.disabled=action==='prev'?storyStep===0:Boolean(needsProduct);toolbar.append(b)}}}
function renderScene(){document.body.dataset.currentScene=currentScene;const scene=byScene.get(currentScene);$('[data-review-controls] [data-current-scene]').textContent=scene.title;$('[data-review-controls] [data-current-scene]').title=`${scene.id} · ${scene.title}`;const q=$('[data-question-entry]');$('[data-question-summary]').textContent=brief?.question||'本轮问题待关联';$('[data-annotation-count]').textContent=`${annotations().length}处说明`;q.title=`${brief?.question||'本轮问题待关联'} · ${annotations().length}处说明`;renderIndex();renderAnnotations();renderStory();$('[data-back]').disabled=navHistory.length<2;hash()}
function invalidate(){epoch++;sequence=-1;positions.clear();draw()}
function commandScene(id,push=true){if(!byScene.has(id))return;if(id!==currentScene){closeCard();selected=null;pendingReveal=null;status()}if(push&&navHistory.at(-1)!==id)navHistory.push(id);currentScene=id;invalidate();send('show-scene',{theme,language,perspective});renderScene()}
function center(){const r=frame.getBoundingClientRect(),a=area.getBoundingClientRect();return {x:(a.left+area.clientWidth/2-r.left)/scale,y:(a.top+area.clientHeight/2-r.top)/scale}}
function centerOn(point){if(!point)return;const r=frame.getBoundingClientRect(),a=area.getBoundingClientRect();area.scrollLeft+=r.left+point.x*scale-a.left-area.clientWidth/2;area.scrollTop+=r.top+point.y*scale-a.top-area.clientHeight/2;viewCenter=center()}
function fit(point){if(!area.clientWidth||!area.clientHeight)return;point=point||center();const w=Math.max(1,area.clientWidth-24),h=Math.max(1,area.clientHeight-24);scale=zoom==='actual'?1:Math.min(1,w/viewport.width,...(zoom==='fit'?[h/viewport.height]:[]));frame.width=viewport.width;frame.height=viewport.height;frame.style.width=`${viewport.width}px`;frame.style.height=`${viewport.height}px`;frame.style.transform=`scale(${scale})`;box.style.width=`${viewport.width*scale}px`;box.style.height=`${viewport.height*scale}px`;area.classList.toggle('zoomed',zoom!=='fit');centerOn(point);$('[data-viewport-size]').textContent=`${viewport.width} × ${viewport.height} · ${Math.round(scale*100)}%`;draw()}
function openPanel(tab,from){if(!panel){savedCenter=center();panelTrigger=from||document.activeElement}panel=tab;workspace.classList.add('inspector-open');$$('[data-panel]').forEach(el=>el.hidden=el.dataset.panel!==tab);$$('[data-inspector-tab]').forEach(el=>{const active=el.dataset.inspectorTab===tab;el.setAttribute('aria-selected',String(active));el.tabIndex=active?0:-1});fit(savedCenter);$(`[data-inspector-tab="${tab}"]`).focus()}

function intersects(a,b){return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y}
function inBounds(r){return r.x>=4&&r.y>=4&&r.x+r.width<=layer.clientWidth-4&&r.y+r.height<=layer.clientHeight-4}
function place(el,r){Object.assign(el.style,{left:`${r.x}px`,top:`${r.y}px`})}
function draw(){
 const focused=document.activeElement?.dataset.annotationPin;
 layer.querySelectorAll('.annotation-pin,.annotation-highlight').forEach(el=>el.remove());
 if(!enabled){layer.textContent='';return}
 const occupied=[];const visible=new Map();
 annotations().forEach((a,i)=>{const p=positions.get(a.id);if(p?.state!=='visible')return;const r=localRect(p.clip);if(!intersects(r,{x:0,y:0,width:layer.clientWidth,height:layer.clientHeight}))return;visible.set(a.id,r);const candidates=[{x:r.x+r.width+3,y:r.y-10},{x:r.x-29,y:r.y-10},{x:r.x,y:r.y-29},{x:r.x,y:r.y+r.height+3}].map(v=>({...v,width:26,height:26}));const spot=candidates.find(v=>inBounds(v)&&!occupied.some(o=>intersects(o,v)));if(!spot)return;occupied.push(spot);const pin=document.createElement('button');pin.className='annotation-pin';pin.dataset.annotationPin=a.id;pin.textContent=i+1;pin.setAttribute('aria-label',`说明 ${i+1}：${a.title}`);place(pin,spot);layer.append(pin);if(focused===a.id)pin.focus({preventScroll:true})});
 if(selected&&visible.has(selected)){const r=visible.get(selected),highlight=document.createElement('div');highlight.className='annotation-highlight';place(highlight,r);highlight.style.width=`${r.width}px`;highlight.style.height=`${r.height}px`;layer.append(highlight)}
 const old=layer.querySelector('.annotation-card');
 if(!card||!visible.has(card)){if(card&&!visible.has(card))card=null;old?.remove();return}
 const a=annotation(card),r=visible.get(card);let el=old;
 if(!el||el.dataset.card!==card){old?.remove();el=document.createElement('section');el.className='annotation-card';el.dataset.card=card;el.setAttribute('role','dialog');el.setAttribute('aria-label',a.title);const title=document.createElement('h2');title.textContent=a.title;const body=document.createElement('p');body.textContent=a.body;const actions=document.createElement('div');actions.className='card-actions';for(const [key,label] of [['close','关闭'],['read','在面板阅读'],['actual','100% 查看']]){const b=document.createElement('button');b.dataset.cardAction=key;b.textContent=label;actions.append(b)}el.append(title,body,actions);layer.append(el)}
 const w=Math.min(300,layer.clientWidth-16);el.style.width=`${w}px`;const h=el.offsetHeight;
 const candidates=[{x:r.x+(r.width-w)/2,y:r.y+r.height+10},{x:r.x+(r.width-w)/2,y:r.y-h-10},{x:r.x+r.width+10,y:r.y+(r.height-h)/2},{x:r.x-w-10,y:r.y+(r.height-h)/2}].map((p,i)=>({x:i<2?Math.max(4,Math.min(layer.clientWidth-w-4,p.x)):p.x,y:i>=2?Math.max(4,Math.min(layer.clientHeight-h-4,p.y)):p.y,width:w,height:h}));
 const spot=candidates.find(p=>inBounds(p)&&!intersects(p,r));
 if(!spot){el.remove();status('在面板阅读');return}place(el,spot);status();
}
function storyAction(action){if(!activeStory)return;if(action==='exit'||action==='next'&&storyStep===activeStory.steps.length-1){activeStory=null;$('[data-story-select]').value='';renderStory();return}if(action==='next'&&activeStory.steps[storyStep+1]?.arrival!=='review')return;storyStep=Math.max(0,storyStep+(action==='prev'?-1:1));const step=activeStory.steps[storyStep];perspective=step.perspective||perspective;$('[data-perspective-select]').value=perspective;commandScene(step.scene)}
document.addEventListener('click',event=>{
 const el=event.target.closest('button');if(!el)return;
 if(el.dataset.openPanel)openPanel(el.dataset.openPanel,el);
 if(el.dataset.inspectorTab)openPanel(el.dataset.inspectorTab,el);
 if(el.hasAttribute('data-inspector-toggle'))closePanel();
 if(el.hasAttribute('data-back')&&navHistory.length>1){navHistory.pop();commandScene(navHistory.at(-1),false)}
 if(el.dataset.sceneLink){activeStory=null;$('[data-story-select]').value='';commandScene(el.dataset.sceneLink);if(matchMedia('(max-width:860px)').matches)closePanel()}
 if(el.hasAttribute('data-toggle-annotations')){enabled=!enabled;el.setAttribute('aria-pressed',String(enabled));if(!enabled){card=null;status()}draw()}
 if(el.dataset.annotationPin){selected=el.dataset.annotationPin;card=selected;trigger=el;hash();renderAnnotations();draw();layer.querySelector('[data-card-action="close"]')?.focus()}
 if(el.dataset.annotationEntry)choose(el.dataset.annotationEntry,el);
 if(el.dataset.annotationActual){const id=el.dataset.annotationActual;choose(id,el);setZoom('actual',targetCenter(id));if(panel)closePanel()}
 if(el.hasAttribute('data-panel-hint'))panelRead();
 if(el.dataset.cardAction==='close')closeCard(true);
 if(el.dataset.cardAction==='read')panelRead();
 if(el.dataset.cardAction==='actual'){const point=targetCenter(selected);setZoom('actual',point);if(panel){savedCenter=point;closePanel()}}
 for(const action of ['prev','next','exit'])if(el.hasAttribute(`data-story-${action}`)||el.dataset.storyAction===action)storyAction(action);
 if(el.hasAttribute('data-reset')){activeStory=null;$('[data-story-select]').value='';selected=null;card=null;pendingReveal=null;navHistory=[manifest.start_scene];currentScene=manifest.start_scene;invalidate();send('reset',{theme,language,perspective});renderScene();area.scrollTo(0,0)}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(card){event.preventDefault();closeCard(true)}else if(panel){event.preventDefault();closePanel()}}const tab=event.target.closest('[data-inspector-tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=$$('[data-inspector-tab]'),i=tabs.indexOf(tab),index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;openPanel(tabs[index].dataset.inspectorTab)}});
$('[data-viewport-select]').addEventListener('change',event=>{viewport=manifest.target.viewports.find(v=>v.id===event.target.value);invalidate();fit({x:viewport.width/2,y:viewport.height/2});send('measure')});
$('[data-zoom-select]').addEventListener('change',event=>setZoom(event.target.value,selected?targetCenter(selected):null));
$('[data-story-select]').addEventListener('change',event=>{activeStory=manifest.stories.find(s=>s.id===event.target.value)||null;storyStep=0;if(activeStory){perspective=activeStory.steps[0].perspective||perspective;$('[data-perspective-select]').value=perspective;commandScene(activeStory.steps[0].scene)}renderStory()});
for(const key of ['theme','language','perspective'])$(`[data-${key}-select]`).addEventListener('change',event=>{if(key==='theme')theme=event.target.value;if(key==='language')language=event.target.value;if(key==='perspective')perspective=event.target.value;send('settings',{theme,language,perspective})});
const validRect=r=>r&&['x','y','width','height'].every(k=>typeof r[k]==='number'&&Number.isFinite(r[k])&&Math.abs(r[k])<1e7)&&r.width>=0&&r.height>=0;
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow)return;const d=event.data;if(!d||d.version!==1||d.session!==session||d.epoch!==epoch||!byScene.has(d.scene))return;
 if(d.type==='product-ui-prototype:scene-change'){
  if(d.reason==='action'){if(d.from!==currentScene||!byScene.get(d.from).transitions.some(e=>e.id===d.transition&&e.to===d.scene))return;const next=activeStory?.steps[storyStep+1];if(next?.scene===d.scene&&next.arrival!=='review'){storyStep++;perspective=next.perspective||perspective;$('[data-perspective-select]').value=perspective}commandScene(d.scene);return}
  if(d.scene!==currentScene||!['command','ready','reset'].includes(d.reason))return;return;
 }
 if(d.scene!==currentScene)return;
 if(d.type==='product-ui-prototype:dismiss'){if(typeof d.keyboard!=='boolean')return;closeCard(d.keyboard);return}
 if(d.type!=='product-ui-prototype:positions'||!Number.isSafeInteger(d.sequence)||d.sequence<=sequence||d.width!==viewport.width||d.height!==viewport.height||!Array.isArray(d.targets)||d.targets.length!==annotations().filter(a=>a.anchor).length)return;
 const seen=new Set();for(const p of d.targets){const a=annotation(p.id);if(!a?.anchor||seen.has(p.id)||!['visible','offscreen','hidden'].includes(p.state)||!validRect(p.rect)||!validRect(p.clip))return;if(p.clip.x<0||p.clip.y<0||p.clip.x+p.clip.width>d.width+1||p.clip.y+p.clip.height>d.height+1)return;seen.add(p.id)}
 sequence=d.sequence;positions=new Map(d.targets.map(p=>[p.id,p]));updateStates();
 if(pendingReveal&&d.revealed===pendingReveal){const id=pendingReveal,p=positions.get(id);pendingReveal=null;if(p?.state==='visible'){const point=targetCenter(id);centerOn(point);if(panel)savedCenter=point;card=id}else{card=null;status(p?.state==='hidden'?'当前状态不可见 · 在面板阅读':'在面板阅读')}}draw();
});
area.addEventListener('scroll',()=>{viewCenter=center();draw()},{passive:true});
new ResizeObserver(()=>fit(viewCenter)).observe(area);
window.addEventListener('resize',()=>fit(viewCenter));
function readHash(){const params=new URLSearchParams(location.hash.slice(1)),id=params.get('scene'),aid=params.get('annotation');if(byScene.has(id)&&id!==currentScene){activeStory=null;$('[data-story-select]').value='';commandScene(id)}if(aid){if(annotation(aid))choose(aid,$('[data-toggle-annotations]'));else{selected=null;pendingReveal=null;closeCard();status('说明不存在 · 查看当前页说明')}}}
window.addEventListener('hashchange',readHash);
const initial=new URLSearchParams(location.hash.slice(1));if(byScene.has(initial.get('scene'))){currentScene=initial.get('scene');navHistory=[currentScene]}
const initialAnnotation=initial.get('annotation');
frame.addEventListener('load',()=>{commandScene(currentScene,false);if(initialAnnotation){if(annotation(initialAnnotation))choose(initialAnnotation,$('[data-toggle-annotations]'));else status('说明不存在 · 查看当前页说明')}});
$('[data-viewport-select]').value=viewport.id;$('[data-theme-select]').value=theme;renderScene();fit({x:viewport.width/2,y:viewport.height/2});
})();
</script>
