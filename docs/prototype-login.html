<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polo AI — Login Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Craft Agents: default sans = system-ui stack; code = JetBrains Mono. -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React 18 + Babel via CDN: no build step, JSX transpiled in-browser. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    /* ────────────────────────────────────────────────────────────────
       DESIGN TOKENS
       Phase 2: replace the TODO values below with the project's REAL
       tokens (grep the project for CSS custom properties, tailwind.config
       theme, or theme.ts). Keep the STRUCTURE — the --fg-N ramp, derived
       surfaces, and shadow utilities auto-adapt to --foreground/--background.
       ──────────────────────────────────────────────────────────────── */
    :root {
      /* CORE COLORS — Polo AI color system (warm-contrast palette). */
      --background:      oklch(0.98 0.008 290);
      --foreground:      oklch(0.17 0.02 290);
      --foreground-rgb:  26, 23, 38;
      --accent:          oklch(0.44 0.30 285);
      --info:            oklch(0.72 0.16 75);
      --success:         oklch(0.58 0.14 165);
      --destructive:     oklch(0.58 0.22 25);

      /* DERIVED SURFACES — auto-computed from the core colors. Keep as-is. */
      --user-bubble:  oklch(from var(--foreground) l c h / 0.05);
      --bg-elevated:  color-mix(in srgb, var(--foreground) 1.5%, var(--background));
      --border:       oklch(from var(--foreground) l c h / 0.05);

      /* FOREGROUND OPACITY RAMP — auto-computed tints. Keep as-is.
         Use var(--fg-N) for muted text, borders, hover backgrounds. */
      --fg-2:  color-mix(in srgb, var(--foreground) 2%,  var(--background));
      --fg-3:  color-mix(in srgb, var(--foreground) 3%,  var(--background));
      --fg-5:  color-mix(in srgb, var(--foreground) 5%,  var(--background));
      --fg-7:  color-mix(in srgb, var(--foreground) 7%,  var(--background));
      --fg-10: color-mix(in srgb, var(--foreground) 10%, var(--background));
      --fg-20: color-mix(in srgb, var(--foreground) 20%, var(--background));
      --fg-30: color-mix(in srgb, var(--foreground) 30%, var(--background));
      --fg-40: color-mix(in srgb, var(--foreground) 40%, var(--background));
      --fg-50: color-mix(in srgb, var(--foreground) 50%, var(--background));
      --fg-60: color-mix(in srgb, var(--foreground) 60%, var(--background));
      --fg-70: color-mix(in srgb, var(--foreground) 70%, var(--background));
      --fg-80: color-mix(in srgb, var(--foreground) 80%, var(--background));

      /* SHADOW PARAMETERS (light = subtle) */
      --shadow-border-opacity: 0.08;
      --shadow-blur-opacity:   0.06;

      /* LAYOUT METRICS — Craft Agents uses floating shadowed panels. */
      --panel-gap:   6px;
      --panel-inset: 6px;
      --radius-edge: 14px;
      --radius-inner: 10px;
      --topbar-h:    48px; /* matches --topbar-height */

      /* TYPOGRAPHY — Craft Agents default: system-ui sans, JetBrains Mono code. */
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    /* DARK THEME — Polo AI .dark (warm-contrast palette). */
    .dark {
      --background:      oklch(0.14 0.025 290);
      --foreground:      oklch(0.94 0.015 290);
      --foreground-rgb:  238, 234, 245;
      --accent:          oklch(0.52 0.28 285);
      --accent-rgb:      123, 63, 245;
      --info:            oklch(0.76 0.15 75);
      --info-rgb:        224, 168, 48;
      --success:         oklch(0.68 0.14 165);
      --success-rgb:     20, 184, 128;
      --destructive:     oklch(0.64 0.22 25);
      --destructive-rgb: 239, 85, 85;
      --shadow-border-opacity: 0.15;
      --shadow-blur-opacity:   0.12;
      /* (--user-bubble / --bg-elevated / --border / --fg-N re-derive automatically) */
    }

    /* ── GLOBAL RESET & BASE ── */
    * { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }
    html { font-size: 15px; font-optical-sizing: auto; }
    html, body, #root { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      transition: background 0.35s ease, color 0.35s ease;
    }
    button { font-family: inherit; }

    /* Scrollbars — subtle, reveal on hover. */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
    *:hover > ::-webkit-scrollbar-thumb,
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-20); }

    /* ── SHADOW UTILITIES (generic elevation system) ── */
    .shadow-middle {
      box-shadow:
        rgba(0,0,0,0) 0 0 0 0, rgba(0,0,0,0) 0 0 0 0,
        rgba(var(--foreground-rgb), 0.06) 0 0 0 1px,
        rgba(0,0,0, var(--shadow-blur-opacity)) 0 1px 1px -0.5px,
        rgba(0,0,0, var(--shadow-blur-opacity)) 0 3px 3px -1.5px,
        rgba(0,0,0, var(--shadow-blur-opacity)) 0 6px 6px -3px;
    }
    .shadow-minimal {
      box-shadow:
        rgba(0,0,0,0) 0 0 0 0, rgba(0,0,0,0) 0 0 0 0,
        rgba(var(--foreground-rgb), 0.04) 0 0 0 1px,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.5)) 0 1px 1px -0.5px;
    }
    /* Focused-panel shadow with a gradient border-ring via a ::before mask. */
    .shadow-panel-focused {
      position: relative;
      box-shadow:
        rgba(0,0,0,0) 0 0 0 0, rgba(0,0,0,0) 0 0 0 0, rgba(0,0,0,0) 0 0 0 0,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.67)) 0 1px 1px -0.5px,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.67)) 0 3px 3px 1px,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.5))  0 6px 6px 2px,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.5))  0 12px 12px 3px,
        rgba(0,0,0, calc(var(--shadow-blur-opacity)*0.33)) 0 24px 24px 4px;
    }
    .shadow-panel-focused::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(to bottom, rgba(var(--foreground-rgb),0.1), rgba(var(--foreground-rgb),0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 1;
    }
    .shadow-panel-focused > * { position: relative; z-index: 2; }

    /* Tinted shadow — color is set via --shadow-color inline style. */
    .shadow-tinted {
      box-shadow:
        0px 0px 0.5px rgba(var(--shadow-color), 0.3),
        0px 1px 0.1px rgba(0,0,0,0.04),
        0px 3px 0.2px rgba(0,0,0,0.03);
    }

    /* ── LOGIN CARD (structural; brand colors are TODO) ── */
    .login-card {
      position: relative; z-index: 1; width: 100%; max-width: 28rem;
      padding: 40px 36px 36px;
      background: oklch(from var(--background) l c h / 0.86);
      border: 1px solid var(--border); border-radius: 20px; text-align: center;
      box-shadow: rgba(0,0,0,0) 0 0 0 0, rgba(0,0,0,0) 0 0 0 0,
        rgba(var(--foreground-rgb),0.06) 0 0 0 1px,
        rgba(0,0,0,0.06) 0 1px 1px -0.5px, rgba(0,0,0,0.06) 0 3px 3px 0,
        rgba(0,0,0,0.03) 0 6px 6px 0, rgba(0,0,0,0.03) 0 12px 12px 0, rgba(0,0,0,0.03) 0 24px 24px 0;
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }
    .login-logo {
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; width: 40px; height: 40px;
      /* TODO: replace with project's brand gradient */
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent) 100%);
      border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }
    .login-logo-mark { font-size: 18px; font-weight: 700; color: #fff; font-family: var(--font-sans); user-select: none; }
    .login-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
    .login-subtitle { font-size: 13px; opacity: 0.56; margin-bottom: 28px; }
    .login-field { margin-bottom: 16px; text-align: left; }
    .login-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .login-input {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--border); border-radius: 8px; outline: none;
      background: var(--background); color: var(--foreground);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .login-input::placeholder { opacity: 0.34; }
    .login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
    .login-input:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; font-weight: 500;
      font-family: inherit; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
      transition: transform 0.15s, filter 0.15s, background 0.15s; user-select: none;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .login-btn:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
    .login-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }

    /* ── ANIMATIONS ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0 } }
    @keyframes splashIn { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes splashOut { from { transform: scale(1); opacity: 1; } to { transform: scale(3); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%,100%{ transform:translateX(0) } 10%,50%,90%{ transform:translateX(-4px) } 30%,70%{ transform:translateX(4px) } }
    .typing-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
    .spinner { animation: spin 0.8s linear infinite; }

    /* ── CODE BLOCK (generic) ── */
    .code-block { background: var(--fg-3); border-radius: 8px; overflow: hidden; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
    .code-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: var(--fg-5); font-size: 12px; color: var(--fg-50); }
    .code-header button { background: none; border: none; color: var(--fg-50); cursor: pointer; font-size: 12px; font-family: inherit; padding: 2px 8px; border-radius: 4px; display: flex; align-items: center; gap: 4px; transition: background 0.15s, color 0.15s; }
    .code-header button:hover { background: var(--fg-5); color: var(--foreground); }
    .code-content { padding: 12px 16px; overflow-x: auto; white-space: pre; }
    .tok-keyword { color: oklch(0.7 0.15 300); }
    .tok-string { color: oklch(0.72 0.14 145); }
    .tok-comment { color: var(--fg-40); font-style: italic; }
    .tok-function { color: oklch(0.75 0.12 220); }
    .tok-number { color: oklch(0.75 0.14 70); }
    .tok-param { color: oklch(0.82 0.08 60); }
    .tok-operator { color: var(--fg-60); }
    .tok-paren { color: var(--fg-50); }

    /* ── LIST-ITEM SEPARATOR VISIBILITY (hover/active hides the divider) ── */
    .session-item:hover > .session-sep,
    .session-item[data-active] > .session-sep { opacity: 0; }
    .session-item:hover + .session-item > .session-sep,
    .session-item[data-active] + .session-item > .session-sep { opacity: 0; }
  </style>
</head>

      return (

    function ProcessingIndicator() {
      const [phraseIdx, setPhraseIdx] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      useEffect(() => {
        const pi = setInterval(()=>setPhraseIdx(i=>(i+1)%PROCESSING_PHRASES.length), 3000);
        const ei = setInterval(()=>setElapsed(e=>e+1), 1000);
        return ()=>{ clearInterval(pi); clearInterval(ei); };
      }, []);
      const fmt = elapsed >= 60 ? `${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}` : `${elapsed}s`;
      return (
        <div style={{ display:'flex', alignItems:'center', gap: 8, marginBottom: 20, paddingLeft: 32 }}>

          <span style={{ fontSize: 12, color:'var(--fg-30)' }}>{fmt}</span>
        </div>
      );
    }

    /* ═══════ QUOTA WIDGET (S-014, S-015, S-016) ═══════ */
    function QuotaWidget({ quota, appScenario }) {
      const isWarning = appScenario === 'quota-warning';
      const isExhausted = appScenario === 'quota-exhausted';
      const pct = isExhausted ? 100 : isWarning ? 82 : Math.round((quota.used / quota.total) * 100);
      const barColor = isExhausted ? 'var(--destructive)' : isWarning ? 'var(--info)' : 'var(--accent)';
      const fmt = (n) => n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(0)+'K' : n;
      const usedDisplay = isExhausted ? quota.total : isWarning ? Math.round(quota.total * 0.82) : quota.used;
      return (
        <div style={{ padding:'10px 14px', borderTop:'1px solid var(--border)' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5 }}>
            <span style={{ fontSize:11, color:'var(--fg-50)', display:'flex', alignItems:'center', gap:4 }}>
              <Ico.BarChart size={12}/> 本月用量
            </span>
            <span style={{ fontSize:11, fontWeight:500, color: isExhausted ? 'var(--destructive)' : isWarning ? 'var(--info)' : 'var(--fg-50)' }}>
              {fmt(usedDisplay)} / {fmt(quota.total)}
            </span>
          </div>
          <div style={{ height:3, borderRadius:2, background:'var(--fg-7)', overflow:'hidden' }}>
            <div style={{ height:'100%', borderRadius:2, background:barColor, width:pct+'%', transition:'width 0.5s ease' }}/>
          </div>
          {isWarning && <div style={{ marginTop:4, fontSize:10, color:'var(--info)', display:'flex', alignItems:'center', gap:3 }}><Ico.AlertTriangle size={10}/> 额度已使用 {pct}%</div>}
          {isExhausted && <div style={{ marginTop:4, fontSize:10, color:'var(--destructive)', display:'flex', alignItems:'center', gap:3 }}><Ico.AlertTriangle size={10}/> 本月额度已用完，{quota.resetDate} 重置</div>}
        </div>
      );
    }

    function NavigatorPanel({ activeView, sessions, activeSessionId, onSelectSession }) {
      const [searchActive, setSearchActive] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [collapsedGroups, setCollapsedGroups] = useState(() => new Set());
      const data = sessions || MOCK_SESSIONS;
      const filtered = useMemo(() => {
        if (!searchQuery.trim()) return data;
        const q = searchQuery.toLowerCase();
        return data.filter(s => s.title.toLowerCase().includes(q) || (s.preview && s.preview.toLowerCase().includes(q)));
      }, [data, searchQuery]);
      const groups = useMemo(() => {
        const map = new Map();
        for (const s of filtered) { const g = s.timeGroup || 'Earlier'; if (!map.has(g)) map.set(g, []); map.get(g).push(s); }
        return Array.from(map.entries()).map(([label, items]) => ({ label, items }));
      }, [filtered]);
      const toggleGroup = (label) => setCollapsedGroups(prev => { const next = new Set(prev); next.has(label) ? next.delete(label) : next.add(label); return next; });
      const title = activeView === 'flagged' ? 'Flagged' : 'All Sessions';
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden', background:'var(--background)' }}>
          <PanelHeader title={title} actions={<>
            <GhostBtn onClick={()=>{ setSearchActive(s=>!s); setSearchQuery(''); }} title="Search"><Ico.Search size={16}/></GhostBtn>
            <GhostBtn title="New session"><Ico.SquarePen size={16}/></GhostBtn>
          </>}/>
          {searchActive && <SessionSearchHeader searchQuery={searchQuery} onSearchChange={setSearchQuery} onSearchClose={()=>{ setSearchActive(false); setSearchQuery(''); }}/>}
          <div style={{ flex:1, overflowY:'auto', minHeight:0, userSelect:'none' }}>
            <div style={{ display:'flex', flexDirection:'column', paddingBottom:8 }}>
              <div style={{ paddingTop:4 }}>
                {groups.map((group) => {
                  const isCollapsed = collapsedGroups.has(group.label);
                  return (
                    <div key={group.label}>
                      {groups.length > 1 ? <SectionHeader label={group.label} isCollapsed={isCollapsed} itemCount={group.items.length} onToggle={()=>toggleGroup(group.label)}/>
                        : <div style={{ paddingLeft:16, paddingRight:16, paddingTop:8, paddingBottom:8 }}><span style={{ fontSize:11, fontWeight:500, color:'var(--fg-50)', textTransform:'uppercase', letterSpacing:'0.05em' }}>{group.label}</span></div>}
                      {!isCollapsed && group.items.map((item, idx) => <SessionRow key={item.id} item={item} isActive={item.id === activeSessionId} isFirstInGroup={idx === 0} onSelect={onSelectSession}/>)}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

function TurnCardView({ msg }) {

  const handleCopy = () => {
    const textParts = (msg.content || [])
      .filter((b) => b.type === 'paragraph' || b.type === 'code')
      .map((b) => (b.type === 'code' ? b.code : b.text));
    const fullText = textParts.join('\n\n');
    try {
      navigator.clipboard && navigator.clipboard.writeText(fullText);
    } catch (e) {}
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);

// ─── Processing indicator row ────────────────────────────────────────
function ProcessingRow() {
  const [elapsed, setElapsed] = React.useState(0);

  React.useEffect(() => {
    const start = Date.now();
    const interval = setInterval(() => {
      setElapsed(Math.floor((Date.now() - start) / 1000));
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  const formatElapsed = (s) => {
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  };

  return (
    <div
      style={{
        display: 'flex',
        alignItems: 'center',
        gap: 8,
        paddingLeft: 12,
        paddingRight: 12,
        paddingTop: 4,
        paddingBottom: 4,
        fontSize: 13,
        color: 'var(--fg-50)',
      }}
    >
      <span
        style={{
          display: 'inline-flex',
          alignItems: 'center',
          justifyContent: 'center',
          width: 12,
          height: 12,
          flexShrink: 0,
        }}
      >
        {Ico.LoaderSpin({ size: 10, sw: 2, style: { animation: 'spin 0.8s linear infinite' } })}
      </span>
      <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        <span>Thinking…</span>
        {elapsed >= 1 && (
          <span style={{ color: 'var(--fg-30)', fontVariantNumeric: 'tabular-nums' }}>
            {formatElapsed(elapsed)}
          </span>
        )}
      </span>
    </div>
  );
}


// ─── Helpers ─────────────────────────────────────────────────────────
function getToolIcon(name) {
  if (!name) return Ico.Wrench({ size: 12, sw: 1.5 });
  const lower = name.toLowerCase();
  if (lower === 'read') return Ico.FileText({ size: 12, sw: 1.5 });
  if (lower === 'write' || lower === 'edit') return Ico.FilePenLine({ size: 12, sw: 1.5 });
  if (lower === 'bash') return Ico.Terminal({ size: 12, sw: 1.5 });
  if (lower === 'websearch') return Ico.Globe({ size: 12, sw: 1.5 });
  if (lower.startsWith('mcp__')) {
    if (lower.includes('linear') || lower.includes('database') || lower.includes('db')) {
      return Ico.Database({ size: 12, sw: 1.5 });
    }
    return Ico.Wrench({ size: 12, sw: 1.5 });
  }
  return Ico.Wrench({ size: 12, sw: 1.5 });
}

function getStatusIcon(status, toolName) {
  switch (status) {
    case 'pending':
      return Ico.Circle({ size: 12, sw: 1.5, style: { color: 'var(--fg-30)', opacity: 0.5 } });
    case 'running':
      return Ico.LoaderSpin({ size: 10, sw: 2, style: { animation: 'spin 0.8s linear infinite' } });
    case 'completed':
      if (toolName === 'Edit') return Ico.Pencil({ size: 12, sw: 1.5, style: { color: 'var(--accent)' } });
      if (toolName === 'Write') return Ico.FilePenLine({ size: 12, sw: 1.5, style: { color: 'var(--accent)' } });
      return Ico.CheckCircle2({ size: 12, sw: 1.5, style: { color: 'var(--success)' } });
    case 'error':
      return null;
    default:
      return Ico.Circle({ size: 12, sw: 1.5, style: { color: 'var(--fg-30)' } });
  }
}

function renderInlineMarkdown(text) {
  // Simple inline markdown: **bold**, `code`
  if (!text) return null;
  const parts = [];
  const regex = /(\*\*([^*]+)\*\*|`([^`]+)`)/g;
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parts.push(text.slice(lastIndex, match.index));
    }
    if (match[2]) {
      // Bold
      parts.push(React.createElement('strong', { key: key++, style: { fontWeight: 600 } }, match[2]));
    } else if (match[3]) {
      // Inline code
      parts.push(IC({ key: key++, children: match[3] }));
    }
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < text.length) {
    parts.push(text.slice(lastIndex));
  }
  return parts;
}

                    color:'color-mix(in oklab, var(--info) 30%, var(--foreground))',
                    border:'none', cursor:'pointer', fontFamily:'inherit',
                    '--shadow-color':'var(--info-rgb)', marginLeft:4,
                  }}>
                    68%
                  </button>
                  {/* Send / Stop */}
                  {disabled ? (
                    <button type="button" onClick={()=>{}} title="Stop" style={{
                      height:28, width:28, borderRadius:'50%', marginLeft:8, flexShrink:0,
                      display:'inline-flex', alignItems:'center', justifyContent:'center',
                      background:'var(--fg-10)', border:'none', cursor:'pointer', color:'var(--foreground)',
                      transition:'background 0.12s',
                    }}
                    onMouseEnter={(e)=>e.currentTarget.style.background='color-mix(in srgb, var(--foreground) 15%, transparent)'}
                    onMouseLeave={(e)=>e.currentTarget.style.background='var(--fg-10)'}
                    onMouseDown={(e)=>e.currentTarget.style.background='color-mix(in srgb, var(--foreground) 20%, transparent)'}
                    onMouseUp={(e)=>e.currentTarget.style.background='color-mix(in srgb, var(--foreground) 15%, transparent)'}>
                      <Ico.Square size={11} />
                    </button>
                  ) : (
                    <button type="submit" disabled={!has} title="Send" style={{
                      height:28, width:28, borderRadius:'50%', marginLeft:8, flexShrink:0,
                      display:'inline-flex', alignItems:'center', justifyContent:'center',
                      background: has ? 'var(--accent)' : 'var(--fg-10)',
                      border:'none', cursor: has ? 'pointer' : 'default',
                      color:'#fff', transition:'background 0.12s',
                    }}
                    onMouseEnter={(e)=>{ if (has) e.currentTarget.style.background='color-mix(in srgb, var(--accent) 85%, var(--foreground))' }}
                    onMouseLeave={(e)=>{ e.currentTarget.style.background = has ? 'var(--accent)' : 'var(--fg-10)' }}
                    onMouseDown={(e)=>{ if (has) e.currentTarget.style.background='color-mix(in srgb, var(--accent) 70%, var(--foreground))' }}
                    onMouseUp={(e)=>{ if (has) e.currentTarget.style.background='color-mix(in srgb, var(--accent) 85%, var(--foreground))' }}>
                      <Ico.ArrowUp size={16} />
                    </button>
                  )}
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }


    function MainContentPanel({ activeSessionId, appScenario }) {
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', minWidth:0 }}>
          <ChatPage activeSessionId={activeSessionId} appScenario={appScenario}/>
        </div>
      );
    }

    /* ChatPage  — header + scrollable ChatDisplay + ChatInputZone. */
    function ChatPage({ activeSessionId, appScenario }) {
      const s = (MOCK_SESSIONS.find(x => x.id === activeSessionId) || MOCK_SESSIONS[0]);
      const [permissionMode, setPermissionMode] = useState('ask');
      const [messages, setMessages] = useState(MOCK_MESSAGES);
      const [isProcessing, setIsProcessing] = useState(false);
      const noConfig = appScenario === 'no-config';
      const exhausted = appScenario === 'quota-exhausted';
      const onlineDisabled = appScenario === 'online-disabled';
      const [disabledTriggered, setDisabledTriggered] = useState(false);
      const inputDisabled = isProcessing || noConfig || exhausted || disabledTriggered;

      // Reset disabledTriggered when scenario changes away
      useEffect(() => { if (!onlineDisabled) setDisabledTriggered(false); }, [appScenario]);

      const onSend = (text) => {
        if (!text || !text.trim() || noConfig || exhausted || disabledTriggered) return;
        // S-007: next message triggers disabled notice
        if (onlineDisabled && !disabledTriggered) {
          setDisabledTriggered(true);
          return;
        }
        const userMsg = { id: 'u' + Date.now(), role: 'user', content: text };
        setMessages(prev => [...prev, userMsg]);
        setIsProcessing(true);
        setTimeout(() => {
          const reply = {
            id: 'a' + Date.now(), role: 'assistant',
            intent: 'Response',
            thinking: 'Considering the request and the available context.',
            content: [{ type: 'paragraph', text: "Got it. Here's a quick draft based on the current project state." }],
            tools: [],
          };
          setMessages(prev => [...prev, reply]);
          setIsProcessing(false);
        }, 1400);
      };
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', minWidth:0 }}>
          <PanelHeader title={s ? s.title : 'New Session'} actions={<>
            <GhostBtn title="Share"><Ico.ArrowUpRight size={14}/></GhostBtn>
            <GhostBtn title="Session menu"><MoreHIcon size={16}/></GhostBtn>
          </>}/>
          <ChatDisplay messages={messages} isProcessing={isProcessing}/>
          {/* Scenario banners (S-013, S-016) */}
          {noConfig && (
            <div style={{ maxWidth:840, margin:'0 auto', width:'100%', padding:'0 20px' }}>
              <div style={{ marginBottom:6, padding:'8px 12px', borderRadius:8, background:'color-mix(in srgb, var(--info) 10%, transparent)', display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--info)', animation:'slideUp 0.25s ease-out' }}>
                <Ico.AlertTriangle size={14}/> 管理员尚未为你配置 AI 服务，暂时无法发送消息
              </div>
            </div>
          )}
          {exhausted && (
            <div style={{ maxWidth:840, margin:'0 auto', width:'100%', padding:'0 20px' }}>
              <div style={{ marginBottom:6, padding:'8px 12px', borderRadius:8, background:'color-mix(in srgb, var(--destructive) 10%, transparent)', display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--destructive)', animation:'slideUp 0.25s ease-out' }}>
                <Ico.AlertTriangle size={14}/> 本月额度已用完，下个周期将自动重置
              </div>
            </div>
          )}
          {disabledTriggered && (
            <div style={{ maxWidth:840, margin:'0 auto', width:'100%', padding:'0 20px' }}>
              <div style={{ marginBottom:6, padding:'8px 12px', borderRadius:8, background:'color-mix(in srgb, var(--destructive) 10%, transparent)', display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--destructive)', animation:'slideUp 0.25s ease-out' }}>
                <Ico.AlertTriangle size={14}/> 账号已被禁用，请联系管理员。当前会话内容不受影响。
              </div>
            </div>
          )}
          <ChatInputZone onSend={onSend} disabled={inputDisabled} isEmptySession={messages.length === 0} permissionMode={permissionMode} onPermissionModeChange={setPermissionMode}/>
        </div>
      );
    }

    /* ═════════════════════════════════════════════════════════════════
       SPLASH SCREEN  — animated brand mark in/out.
       ═════════════════════════════════════════════════════════════════ */
    function SplashScreen() {
      const [exiting, setExiting] = useState(false);
      useEffect(() => {
        const t1 = setTimeout(()=>setExiting(true), 1000);
        return ()=>clearTimeout(t1);
      }, []);
      return (
        <div style={{
          position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
          background:'var(--background)', zIndex: 9999,
          animation: exiting ? 'fadeOut 0.4s ease-out forwards' : 'none',
        }}>
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, color:'var(--accent)', animation: exiting ? 'splashOut 0.4s cubic-bezier(0.16,1,0.3,1) forwards' : 'splashIn 0.3s cubic-bezier(0.16,1,0.3,1)' }}>
            <BrandLogo size={48}/>
            <span style={{ fontSize:15, fontWeight:500, color:'var(--fg-50)' }}>Polo AI</span>
          </div>
        </div>
      );
    }

    /* ═════════════════════════════════════════════════════════════════
       LOGIN PAGE  — glass card form. Structural; brand colors from tokens.
       ═════════════════════════════════════════════════════════════════ */
    function LoginPage({ onLogin, loginError, onClearError }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd] = useState(false);
      const [busy, setBusy] = useState(false);

      const go = (e) => {
        e.preventDefault();
        if (!username.trim() || !password.trim()) return;
        setBusy(true);
        onClearError && onClearError();
        setTimeout(() => {
          setBusy(false);
          onLogin(username.trim(), password.trim());
        }, 700);
      };

      return (
        <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--background)', padding:24 }}>
          <div className="login-card">
            <div className="login-logo">
              <span style={{ fontSize:22, fontWeight:700, color:'#fff', fontFamily:'var(--font-sans)' }}>P</span>
            </div>
            <h1 className="login-title">Polo AI</h1>
            <p className="login-subtitle">请输入你的账号和密码</p>

            {loginError && (
              <div style={{
                marginBottom:16, padding:'10px 14px', borderRadius:8,
                background:'color-mix(in srgb, var(--destructive) 8%, transparent)',
                display:'flex', alignItems:'center', gap:8,
                fontSize:13, color:'var(--destructive)', textAlign:'left',
                animation:'slideUp 0.25s ease-out',
              }}>
                <Ico.AlertTriangle size={16} />
                <span>{loginError}</span>
              </div>
            )}

            <form onSubmit={go}>
              <div className="login-field">
                <label className="login-label">用户名</label>
                <input className="login-input" type="text" placeholder="请输入用户名"
                  value={username} onChange={e=>setUsername(e.target.value)} disabled={busy} autoFocus />
              </div>
              <div className="login-field">
                <label className="login-label">密码</label>
                <div style={{ position:'relative' }}>
                  <input className="login-input" type={showPwd ? 'text' : 'password'} placeholder="请输入密码"
                    value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}
                    style={{ paddingRight:36 }} />
                  <button type="button" onClick={()=>setShowPwd(!showPwd)} tabIndex={-1}
                    style={{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
                      background:'none', border:'none', cursor:'pointer', color:'var(--fg-40)', display:'flex', padding:4 }}>
                    {showPwd ? <Ico.EyeOff size={16}/> : <Ico.Eye size={16}/>}
                  </button>
                </div>
              </div>
              <button type="submit" className="login-btn" disabled={busy || !username.trim() || !password.trim()}>
                {busy ? (<><svg className="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" strokeLinecap="round"/></svg> 登录中…</>) : '登 录'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    /* ═══════ KICKED PAGE (S-012: multi-device kick) ═══════ */
    function KickedPage({ onBackToLogin }) {
      return (
        <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--background)', padding:24 }}>
          <div className="login-card" style={{ maxWidth:'22rem' }}>
            <div style={{ marginBottom:16, color:'var(--info)' }}><Ico.Monitor size={40} /></div>
            <h1 className="login-title" style={{ fontSize:18 }}>已在其他设备登录</h1>
            <p className="login-subtitle" style={{ marginBottom:20, lineHeight:1.5 }}>
              你的账号已在另一台设备上登录。<br/>同一账号只能在一台设备上使用。
            </p>
            <button className="login-btn" onClick={onBackToLogin}>重新登录</button>
          </div>
        </div>
      );
    }

    /* ═════════════════════════════════════════════════════════════════
       ROOT  — phase state machine + theme state.
       Phases map to the project's app states (found in Phase 1 recon).
       Default: splash → login → ready. Add/remove phases to match reality.
       ═════════════════════════════════════════════════════════════════ */
    /* ═══════ SCENARIO DEMO PANEL (floating control) ═══════ */
    function ScenarioDemoPanel({ current, onChange }) {
      const [open, setOpen] = useState(true);
      const scenarios = [
        { id:'normal', label:'S-001 正常登录', desc:'用户名密码 → 成功进入' },
        { id:'wrong-password', label:'S-001 密码错误', desc:'提示"用户名或密码错误"' },
        { id:'network-error', label:'S-001 网络错误', desc:'无法连接到服务器' },
        { id:'auto-login', label:'S-002 免登录打开', desc:'一周内用过,直接进入' },
        { id:'disabled', label:'S-006 账号禁用', desc:'提示"账号已被禁用"' },
        { id:'online-disabled', label:'S-007 在线被禁用', desc:'当前会话继续,下次操作生效' },
        { id:'kicked', label:'S-012 多设备踢出', desc:'另一设备登录,被踢下线' },
        { id:'no-config', label:'S-013 未配置AI', desc:'进入但无法发消息' },
        { id:'quota-warning', label:'S-015 额度预警', desc:'用量接近80%阈值' },
        { id:'quota-exhausted', label:'S-016 额度用完', desc:'本月额度已耗尽' },
      ];
      return (
        <div style={{
          position:'fixed', top:12, right:12, zIndex:10000,
          background:'oklch(from var(--background) l c h / 0.92)',
          backdropFilter:'blur(12px)', borderRadius:12,
          border:'1px solid var(--border)', width: open ? 210 : 'auto',
          boxShadow:'rgba(0,0,0,0.12) 0 4px 16px', overflow:'hidden',
        }}>
          <button onClick={()=>setOpen(!open)} style={{
            display:'flex', alignItems:'center', gap:6, width:'100%', padding:'8px 12px',
            background:'transparent', border:'none', cursor:'pointer', fontFamily:'inherit',
            fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em', color:'var(--fg-40)',
          }}>
            场景演示 {open ? '▾' : '▸'}
          </button>
          {open && (
            <div style={{ padding:'0 6px 6px', display:'flex', flexDirection:'column', gap:1 }}>
              {scenarios.map(s => (
                <button key={s.id} onClick={()=>onChange(s.id)}
                  style={{
                    display:'flex', flexDirection:'column', gap:1,
                    padding:'5px 8px', borderRadius:6, border:'none',
                    background: current === s.id ? 'var(--fg-7)' : 'transparent',
                    cursor:'pointer', textAlign:'left', fontFamily:'inherit', transition:'background 0.1s',
                  }}
                  onMouseEnter={e=>{ if(current!==s.id) e.currentTarget.style.background='var(--fg-3)'; }}
                  onMouseLeave={e=>{ if(current!==s.id) e.currentTarget.style.background='transparent'; }}>
                  <span style={{ fontSize:11, fontWeight:500, color: current===s.id ? 'var(--foreground)' : 'var(--fg-60)' }}>{s.label}</span>
                  <span style={{ fontSize:10, color:'var(--fg-40)' }}>{s.desc}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [phase, setPhase] = useState('splash');
      const [isDark, setIsDark] = useState(false);
      const [scenario, setScenario] = useState('normal');
      const [loginError, setLoginError] = useState(null);
      const [loggedInUser, setLoggedInUser] = useState(null);

      const toggleTheme = () => {
        setIsDark(prev => { const n=!prev; document.documentElement.classList.toggle('dark',n); return n; });
      };

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        if (phase === 'splash') {
          const t = setTimeout(()=>setPhase('login'), 1400);
          return ()=>clearTimeout(t);
        }
      }, [phase]);

      // When scenario changes, adjust phase
      useEffect(() => {
        setLoginError(null);
        if (scenario === 'auto-login') {
          setLoggedInUser({ username:'xiaoming', displayName:'小明' });
          setPhase('ready');
          return;
        }
        if (scenario === 'kicked' && phase === 'ready') setPhase('kicked');
        if (scenario !== 'kicked' && phase === 'kicked') setPhase('login');
        if (scenario === 'online-disabled' && phase !== 'ready') {
          setLoggedInUser({ username:'xiaoming', displayName:'小明' });
          setPhase('ready');
        }
        if (['wrong-password', 'disabled', 'network-error'].includes(scenario) && phase === 'ready') {
          setPhase('login');
          setLoggedInUser(null);
        }
      }, [scenario]);

      const handleLogin = (username, password) => {
        if (scenario === 'wrong-password') {
          setLoginError('用户名或密码错误');
          return;
        }
        if (scenario === 'disabled') {
          setLoginError('账号已被禁用，请联系管理员');
          return;
        }
        if (scenario === 'network-error') {
          setLoginError('网络连接失败，请检查网络后重试');
          return;
        }
        if (scenario === 'kicked') {
          setPhase('kicked');
          return;
        }
        setLoginError(null);
        setLoggedInUser({ username, displayName: username === 'xiaoming' ? '小明' : username });
        setPhase('ready');
      };

      const handleLogout = () => {
        setLoggedInUser(null);
        setLoginError(null);
        setPhase('login');
      };

      return (
        <>
          <ScenarioDemoPanel current={scenario} onChange={setScenario}/>
          {phase === 'splash' && <SplashScreen/>}
          {phase === 'login' && <LoginPage onLogin={handleLogin} loginError={loginError} onClearError={()=>setLoginError(null)}/>}
          {phase === 'kicked' && <KickedPage onBackToLogin={()=>{setScenario('normal');setPhase('login');}}/>}
          {phase === 'ready' && <AppShell onToggleTheme={toggleTheme} isDark={isDark} loggedInUser={loggedInUser} onLogout={handleLogout} appScenario={scenario}/>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
